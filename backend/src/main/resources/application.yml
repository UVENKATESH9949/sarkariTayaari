spring:
  application:
    name: sarkaritaiyaari-backend

  config:
    import: optional:file:./application-local.yml

  servlet:
    multipart:
      # Spring's 1MB default rejects ordinary exam artwork, and the overflow surfaces
      # as an unmapped 500 rather than a readable error.
      max-file-size: 5MB
      max-request-size: 10MB

  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      max-lifetime: 240000
      idle-timeout: 120000
      keepalive-time: 120000
      connection-timeout: 20000
      validation-timeout: 5000
      # Lets the Postgres driver rewrite a batch of single-row INSERTs into one
      # multi-row statement — without this, `hibernate.jdbc.batch_size` below still
      # sends one round trip per row, since the driver never combines them on the wire.
      data-source-properties:
        reWriteBatchedInserts: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # Without this, syncing N questions issues ~5 lazy-load queries per question
        # (topic, subject, exams, translations, each translation's language) — against
        # a remote Neon DB that's ~500+ round trips for ~112 rows. This batches those
        # proxy/collection loads into `WHERE id IN (...)` chunks instead.
        #
        # Matched to the sync page size (500, see QuestionService.MAX_SYNC_PAGE_SIZE /
        # the mobile client's page size), not left at the original 50 — 50 was sized for
        # the ~112-question dev dataset (one page covered everything, so it barely
        # mattered), but at a full page of 500 rows it meant ~10 batched round trips per
        # lazy relationship instead of 1, which is exactly what load-testing 10,000+
        # questions for TICKET-501 surfaced (a full sync went from ~3.5s to ~198s before
        # this). See reports/12-load-test-data-seeding/.
        default_batch_fetch_size: 500
        # Question/Subject/Topic all use client-generated UUID keys (not IDENTITY), so
        # Hibernate can safely batch their inserts without needing a DB round trip per
        # row to get a generated key back first. order_inserts/order_updates group
        # same-table statements together so the batch above actually forms, instead of
        # alternating tables defeating it. Found and fixed while seeding load-test data
        # for TICKET-501 — see reports/12-load-test-data-seeding/.
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Cloud Run injects PORT and requires the container to listen on it. It happens to be
  # 8080 today, so a hardcoded value would work by coincidence — this makes it correct
  # rather than lucky, and changes nothing for local dev.
  port: ${PORT:8080}

app:
  cors:
    # Comma-separated. Dev default only — production sets APP_CORS_ALLOWED_ORIGINS to
    # the deployed admin site's origin. See CorsConfig for why this is configuration.
    allowed-origins: http://localhost:5173

  auth:
    # Long-lived deliberately: this is a study app people open daily, and forcing a
    # re-login every few weeks is friction with no security benefit while tokens are
    # revocable server-side.
    token-ttl-days: 365

  # Folder served at /downloads — drop an APK in and it is immediately downloadable.
  # Relative to the backend module's directory. Deliberately outside src/ so builds are
  # never packaged into the jar.
  downloads-dir: ./downloads

  question-pool:
    # Temporary measure: restricts every public question read (sync, live, counts, mock
    # sampling) to the ~500-question pool seeded by V9__temporary_question_pool.sql,
    # instead of the full ~37,900-question bank. Flip to false to serve everything again —
    # no other code change needed. See QuestionService.temporaryPoolEnabled.
    temporary-enabled: false

  epic-l:
    # Enables POST /api/admin/synthetic-curation/{seed,purge} — the synthetic Epic L
    # curation data (topic hierarchy, prerequisites, exam topic map, PYQ tagging) used to
    # exercise the feature before real editorial content exists.
    #
    # Off by default and deliberately not something a deployed instance can be talked into:
    # the endpoints also require an admin token, and even then refuse unless this is true.
    # An admin clicking the wrong thing on production must not overwrite real curation with
    # demo values. See SyntheticCurationService.
    synthetic-seed-enabled: false
