spring:
  application:
    name: sarkaritaiyaari-backend

  # SMTP for the one-time sign-in code (migration V51). Host and port default to Gmail, but
  # nothing in the code is Gmail-specific, so pointing at another provider is a configuration
  # change only. Credentials come from the environment and are never committed.
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Without these a dead SMTP host hangs the request thread until the OS gives up.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  config:
    import: optional:file:./application-local.yml

  servlet:
    multipart:
      # Spring's 1MB default rejects ordinary exam artwork, and the overflow surfaces
      # as an unmapped 500 rather than a readable error. Raised from 5MB/10MB (TASK-2501
      # Phase 2) so a locally-uploaded PYQ paper PDF isn't rejected before it even reaches
      # QuestionIngestionController's own size check — matches DocumentFetcher.MAX_BYTES'
      # 20MB cap for the URL-fetch path, so both entry points allow the same document size.
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      max-lifetime: 240000
      idle-timeout: 120000
      keepalive-time: 120000
      connection-timeout: 20000
      validation-timeout: 5000
      # Lets the Postgres driver rewrite a batch of single-row INSERTs into one
      # multi-row statement — without this, `hibernate.jdbc.batch_size` below still
      # sends one round trip per row, since the driver never combines them on the wire.
      data-source-properties:
        reWriteBatchedInserts: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # Without this, syncing N questions issues ~5 lazy-load queries per question
        # (topic, subject, exams, translations, each translation's language) — against
        # a remote Neon DB that's ~500+ round trips for ~112 rows. This batches those
        # proxy/collection loads into `WHERE id IN (...)` chunks instead.
        #
        # Matched to the sync page size (500, see QuestionService.MAX_SYNC_PAGE_SIZE /
        # the mobile client's page size), not left at the original 50 — 50 was sized for
        # the ~112-question dev dataset (one page covered everything, so it barely
        # mattered), but at a full page of 500 rows it meant ~10 batched round trips per
        # lazy relationship instead of 1, which is exactly what load-testing 10,000+
        # questions for TICKET-501 surfaced (a full sync went from ~3.5s to ~198s before
        # this). See reports/12-load-test-data-seeding/.
        default_batch_fetch_size: 500
        # Question/Subject/Topic all use client-generated UUID keys (not IDENTITY), so
        # Hibernate can safely batch their inserts without needing a DB round trip per
        # row to get a generated key back first. order_inserts/order_updates group
        # same-table statements together so the batch above actually forms, instead of
        # alternating tables defeating it. Found and fixed while seeding load-test data
        # for TICKET-501 — see reports/12-load-test-data-seeding/.
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Cloud Run injects PORT and requires the container to listen on it. It happens to be
  # 8080 today, so a hardcoded value would work by coincidence — this makes it correct
  # rather than lucky, and changes nothing for local dev.
  port: ${PORT:8080}

app:
  cors:
    # Comma-separated. Dev default only — production sets APP_CORS_ALLOWED_ORIGINS to
    # the deployed sites' origins. See CorsConfig for why this is configuration.
    #
    # Two dev servers now: 5173 is the admin console, 5174 the student web app (web/).
    # Origins are matched exactly — http://127.0.0.1:5174 is a DIFFERENT origin from
    # http://localhost:5174 and will fail preflight, which surfaces as an opaque network
    # error in the browser rather than a helpful message.
    allowed-origins: http://localhost:5173,http://localhost:5174

  auth:
    # Long-lived deliberately: this is a study app people open daily, and forcing a
    # re-login every few weeks is friction with no security benefit while tokens are
    # revocable server-side.
    token-ttl-days: 365
    # "Continue with Google" (2026-09-25). The WEB OAuth client id from Google Cloud Console: Google
    # ID tokens minted for the Android app carry it as their audience, and the server rejects any
    # token whose audience is not this value. Not a secret - it ships inside the app. Blank switches
    # Google sign-in off (the endpoint answers 400) without affecting email-code sign-in.
    google:
      web-client-id: ${GOOGLE_WEB_CLIENT_ID:815653276881-bgt8v5luik1jfee7c941510i1d20sb9u.apps.googleusercontent.com}

  # Sending the one-time sign-in code (migration V51).
  #
  # OFF BY DEFAULT, matching this project's standing posture for anything that leaves the
  # building. With it off, OtpMailSender writes the code to the log at WARN instead of emailing
  # it, so the whole flow is testable on a machine with no mail account. The two paths are
  # exclusive: a deployment with mail ON never logs a code.
  #
  # To turn it on, set all of these (Spring relaxed binding — note the APP_/SPRING_ prefixes,
  # the trap AIProperties' own comments got wrong once):
  #   APP_MAIL_ENABLED=true
  #   APP_MAIL_FROM=you@gmail.com
  #   SPRING_MAIL_USERNAME=you@gmail.com
  #   SPRING_MAIL_PASSWORD=<16-character Google app password, NOT your account password>
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:}
    app-name: SarkariTaiyaari
    # Returns the code in the HTTP response. A developer convenience for driving the flow with
    # curl and nothing else — never enable this anywhere real.
    expose-code-in-response: ${APP_MAIL_EXPOSE_CODE:false}

  # Folder served at /downloads — drop an APK in and it is immediately downloadable.
  # Relative to the backend module's directory. Deliberately outside src/ so builds are
  # never packaged into the jar.
  downloads-dir: ./downloads

  question-pool:
    # Temporary measure: restricts every public question read (sync, live, counts, mock
    # sampling) to the ~500-question pool seeded by V9__temporary_question_pool.sql,
    # instead of the full ~37,900-question bank. Flip to false to serve everything again —
    # no other code change needed. See QuestionService.temporaryPoolEnabled.
    temporary-enabled: false

  epic-l:
    # Enables POST /api/admin/synthetic-curation/{seed,purge} — the synthetic Epic L
    # curation data (topic hierarchy, prerequisites, exam topic map, PYQ tagging) used to
    # exercise the feature before real editorial content exists.
    #
    # Off by default and deliberately not something a deployed instance can be talked into:
    # the endpoints also require an admin token, and even then refuse unless this is true.
    # An admin clicking the wrong thing on production must not overwrite real curation with
    # demo values. See SyntheticCurationService.
    synthetic-seed-enabled: false

  ai:
    # AI provider foundation (infrastructure only — no AI feature calls this yet). See
    # system-design/06-ai-foundation.md for the full architecture and precedence model.
    #
    # Off by default: even once a future feature is coded to call AIService, it does
    # nothing until an operator flips this to true — the same "off unless explicitly
    # turned on" posture as the epic-l/exam-guide/question-pool flags above.
    enabled: false
    # CLAUDE | GROQ | OPENAI | GEMINI | MOCK. Only CLAUDE, GROQ and MOCK are implemented —
    # OPENAI/GEMINI resolve to AIUnknownProviderException until a provider bean exists for them.
    provider: MOCK
    # Never commit a real value here. Set via AI_API_KEY in application-local.yml
    # (gitignored) or a real environment variable — never returned to any client, never
    # logged (see AIProperties/ClaudeProvider).
    api-key:
    # Provider-specific default model id. Leave blank to use the provider's own built-in
    # default (ClaudeProvider falls back to claude-sonnet-5; GroqProvider to
    # openai/gpt-oss-120b — verified against a real GET /models call, unlike the
    # llama-3.3-70b-versatile this comment first guessed, which does not exist on a current
    # Groq account and failed with AIModelNotFoundException on the first real call).
    # A request-level override (AIRequest.model) always wins.
    model:
    # Leave blank to use the provider's real endpoint. Only needed to point at a proxy or
    # a test double.
    base-url:
    connect-timeout-ms: 10000
    request-timeout-ms: 60000
    max-retries: 2
    # AI Admin Control Center (see system-design/06-ai-foundation.md and ADR-014): the
    # server-side key used to encrypt/decrypt a provider API key stored in ai_provider_configs
    # via AES-256-GCM. Base64, must decode to exactly 32 bytes. Never stored in the database.
    # Blank is fine until an admin actually saves a key through the Control Center.
    encryption-key:
