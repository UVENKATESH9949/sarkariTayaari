- execution_id: EXEC-LESSONVIDEO-0011
  test_case_id: TC-LESSONVIDEO-019
  test_case_version: 1
  environment: "Real Cloudinary account (Free plan), provider overridden to cloudinary for this test class only"
  build_version: "main @ 72694bc + uncommitted 2026-09-28 AI Videos integration"
  tester: "venkatesh.undekod@innovapptive.com (via Claude Code session)"
  executed_at: "2026-09-28T18:30:00+05:30"
  actual_result: >
    The blocked case is now genuinely run, against real credentials. A real upload succeeded;
    Cloudinary reported duration=1s width=128 height=128, which the code now reads instead of
    trusting a typed-in number; the signed delivery URL served the bytes back byte-identically
    (HTTP 200); an UNSIGNED request for the same asset was REFUSED with HTTP 400, which is what
    makes premium gating real rather than cosmetic; and the object was deleted afterwards, leaving
    nothing in the account.

    Step 4, the question api/LESSON-VIDEOS.md could not answer: this account's plan DOES support
    time-limited delivery. The URL came back as a privateDownload link carrying an expiry
    (api.cloudinary.com/v1_1/<cloud>/video/download), so the documented expiry claim is TRUE here
    and the non-expiring signed-URL fallback stays dormant. It logs a WARN if that ever changes.
  status: Pass
  defect_id: ""
  remarks: >
    Two findings from getting this to run, both mine rather than the product's. A hand-built MP4
    (ftyp box plus empty moov) passes the application's own magic-byte check but Cloudinary
    DECODES uploads and rejected it as "Invalid video file" - so the test now uses a genuinely
    playable 2.2KB clip committed at backend/src/test/resources/tiny-video.mp4. And the first run
    used a stale cloud name because secrets.local.env had been edited without re-running
    `npm run secrets:apply`; `npm run secrets:check` correctly reported the generated file as out
    of date.
