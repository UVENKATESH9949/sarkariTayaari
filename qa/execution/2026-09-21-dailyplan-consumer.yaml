    "Based on the 1-2 hours a day you chose when you set up the app." Step 2: signed in as a second
    account holding a profile whose dailyStudyTime is null - a student who finished onboarding but
    skipped that step - and the screen showed 60m / 58m / 22 tasks with "We don't know how long you
