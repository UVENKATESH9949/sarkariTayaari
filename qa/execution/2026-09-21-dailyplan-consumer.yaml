# DAILYPLAN — execution records, 2026-09-21: the first student-facing consumer, on a device.
#
# Emulator `emulator-5554` (Pixel_7), real dev backend on localhost:8080, real Neon dev database.
# No physical device was attached; every adb call was pinned anyway. Account gate1.retest@example.com.
#
# This is the run that makes six phases visible. Until it, `learning-state`, `study-roadmap`,
# `revision-plan`, `preparation-profile` and `daily-plan` all worked and none had a reader.
#
# THE SCREEN PASSED FIRST TIME — no product defect was found, which is unusual enough in this
# project to state plainly rather than leave the reader to infer it from an absent failure note.
# The two real problems were mine and were caught before this run: two theme tokens that do not
# exist (`semantic.warningSoft`, `brand.soft` — the real names are `warningBg` and `glowSoft`) and
# two unused imports, both caught by tsc and lint rather than by review.
#
# ONE ENVIRONMENT INCIDENT, and it is the one this file keeps recording. The emulator's
# system_server ANRed repeatedly on cold boot ("Process system isn't responding"), and the machine
# had 350 MB genuinely available of 16 GB with 26.7 GB committed — a backend JVM, Metro, the
# emulator and the editor competing. `adb reboot` cleared it, exactly as this project's own notes
# prescribe. The app was never at fault: Home rendered correctly behind the system dialog.
#
# A SECOND, SMALLER TRAP worth recording: expo-router's typed routes are generated, so `tsc`
# rejected `router.push("/daily-plan")` with the route file already on disk. Metro regenerates
# `.expo/types/router.d.ts` on start; a brief dev-server run fixed it. Do not "fix" that error by
# casting the path.

