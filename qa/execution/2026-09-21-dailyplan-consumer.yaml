    dated NEWER than the device's. The device's own ONE_TO_TWO upload therefore lost on the real
    last-write-wins path and the device took the winner - so this run incidentally proved, on a
    device for the first time, that a losing upload corrects itself in the same round trip
    (REQ-DAILYPLAN-002). The server's updatedAt was unchanged afterwards.

