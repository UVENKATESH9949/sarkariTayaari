  actual_result: >
    All twelve methods passed in 0.031s. The spec's own band table reproduced exactly at 30, 45, 60,
    90, 120 and 180 minutes, including the 60-minute DEFAULT this app produces when no profile
    exists. The 90-minute reference split came out exactly 25/20/20/15/10. Shares summed to the
    budget at eleven different budgets with no minute lost or invented, and no purpose took the whole
    day. Trimming behaved: 15 recommended questions into a 10-minute allowance gave 8 at 75s each, 4
