# DAILYPLAN — execution records, 2026-09-22 (TASK-3501, the five learning purposes)
#
# One run, one Maven invocation, against the real Neon dev database (PostgreSQL 18.6):
# `mvn -f backend/pom.xml test -Dtest=DailyPlanTest,AdaptiveReplanningTest,DailyPlanAllocationTest,
#  TaskOutcomeRuleTest,WorkloadEstimatorTest,RevisionLadderTest`
# — 52 tests, 0 failures, 0 errors, BUILD SUCCESS, 28:50 min total.
#
#   DailyPlanTest            17/17   1252 s    (9 pre-existing + 8 new)
#   AdaptiveReplanningTest    5/5     465.1 s  (regression — Phase 6 reads study_tasks.source)
#   DailyPlanAllocationTest  12/12      0.031 s  (plain JUnit, no Spring, no database)
#   TaskOutcomeRuleTest       6/6       0.028 s
#   WorkloadEstimatorTest     6/6       0.033 s
#   RevisionLadderTest        6/6       0.036 s
#
# Flyway validated all 52 migrations at context startup, which independently re-confirms V52 is
# applied to this database with a matching checksum (it had been applied on 2026-09-21, v51 -> v52
# in 1.587s).
#
# THE REGRESSION WAS THE POINT OF INCLUDING AdaptiveReplanningTest. Phase 6 settles a closed day by
# reading study_tasks rows whose `source` V52 relabelled (PRACTICE -> NEW_TOPIC) and to which this
# change adds three further values. Its 5/5 is the evidence that settlement did not regress.
#
# THE ALLOCATION RULES WERE PROVEN BEFORE ANY DATABASE WAS INVOLVED, deliberately — the same order
# that made Phase 6 pass on its first real run, and the opposite of the Phase 4 mistake of asserting
# a tier against uncontrolled database contents. DailyPlanAllocationTest needs no Spring context and
# runs in 31 milliseconds, so every band and every share was already settled against counts the test
# itself controls before a single integration fixture existed.
#
# AN EARLIER ATTEMPT AT THIS RUN WAS KILLED DELIBERATELY on 2026-09-21 at ~15:00 so the machine could
# be shut down. It produced no surefire report and is not recorded as a failure, because it tested
# nothing. It did leave one partial fixture behind (exam PLAN_NEWMAX_3EBBFD76, its subject, six
# topics, six exam_topics rows and two questions, all named for run id 3ebbfd76) — its @AfterEach
# never ran. NO ORPHANED ACCOUNTS SURVIVED, which was the more likely worry and turned out not to
# have happened; verified by direct read-only query, not assumed. The exam is is_active = false, so
# it was never reachable by a student.
#
# TC-DAILYPLAN-031 (the five sections on a real device) is ManualOnly and remains Not Executed. It
# is deliberately absent from this file rather than recorded as a pass.

