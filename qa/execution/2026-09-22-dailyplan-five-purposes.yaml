    WorkloadEstimator.minutes held across 7 seconds-per-question values times 40 allowances.
  status: Pass
  defect_id: ""
  evidence: "surefire output for service.DailyPlanAllocationTest (12 methods)"
  remarks: >
    Asserts the split and the ladder behave as DECIDED, never that 25/20/20/15/10 and 1/2/3 are the
    right numbers for this product. Those remain declared product judgements.

