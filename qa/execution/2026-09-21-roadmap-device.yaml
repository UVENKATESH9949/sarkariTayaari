# ROADMAP — execution records, 2026-09-21: the device pass for the Study Roadmap screen.
#
# Emulator `emulator-5554` (Pixel_7) against a real dev backend and the real Neon dev database.
# A physical device was attached to this machine throughout and was never touched; every adb call
# was pinned to emulator-5554.
#
# Run on a DISPOSABLE account created for this pass (roadmap.check.7706@example.com), rather than
# reusing the account owner's credentials a second time. That turned out to be the better subject
# anyway: a fresh account has no personal timings, so the estimate line had to claim none, and 36
# of its 61 topics were prerequisite-blocked, which exercised a branch a practised account might
# not have shown at all.
#
# TWO MEMORY NOTES, because this keeps costing time. The AVD is configured with hw.ramSize=6144,
# which gave qemu a 4.9 GB host footprint and left 298 MB available — the level that hung the
# emulator's system_server the day before. Relaunching with `-memory 3072` cut it to 3.1 GB and
# left ~1.5 GB free, which ran cleanly start to finish. And the LogBox warning toast overlaps the
# bottom tab bar and silently eats taps on it — already on record in this project, hit again here.

