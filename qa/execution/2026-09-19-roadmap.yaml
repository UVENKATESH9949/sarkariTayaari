# ROADMAP — execution records, 2026-09-19 (TASK-3101, Phase 4)
#
# All thirteen are automated runs against the real Neon dev database, from one invocation of
# `mvn test -Dtest='StudyRoadmapTest,RevisionPlanTest,WorkloadEstimatorTest,RevisionLadderTest'` —
# 32 tests, 0 failures, BUILD SUCCESS. StudyRoadmapTest alone took 857.7s; WorkloadEstimatorTest,
# which needs no Spring context and no database, took 0.010s.
#
# Worth recording, because the first run of this suite did NOT pass: 4 of 12 failed, and in every
# case the service was right and the test was wrong.
#
#   - Two ERRORs came from a fixture saving a RecruitmentCycle straight through its repository and
#     hitting NOT NULL on created_at. That entity has no @PrePersist; the real write path stamps it
#     in ExamGuideService. Fixed in the fixture.
#   - TC-ROADMAP-007 expected DEFAULT for a fresh topic and got COHORT_DIFFICULTY (17s, n=53). The
#     shared dev database genuinely holds cohort timings, so the ladder had correctly found a real
#     tier. The case was reframed to assert tier/sample-size consistency, and the tier rules moved
#     to TC-ROADMAP-013 with constructed samples.
#   - TC-ROADMAP-005 asserted "never more than 2 topics in a row from one subject" and failed at
#     position 9 on a legitimate tail: with five topics per subject, once one is exhausted the
#     remainder must run consecutively. Relaxed to the real contract.
#
# None is logged as a defect: no fault in shipped behaviour, and all were found and fixed in the
# same session by the tests written to cover the change.

