  status: Pass
  defect_id: ""
  evidence: "dialog2.png (light), dialog-dark.png (dark, pre-fix), dialog-dark2.png (dark, fixed)"
  remarks: >
    THE DARK-MODE PASS FOUND A THIRD PROBLEM, fixed in the same round rather than recorded as a
    defect because it never left this session: as a floating centred card the dialog barely
    separated from the page. `colors.surface` is #0F131C against a #0A0D14 background, and the
    0.38 backdrop wash that works in light mode changes almost nothing on a near-black page, so
    the card read as a faint outline. Fixed the way this palette says to (see the note in
    packages/core/src/design/palettes.ts - in dark, a surface lifts by being BRIGHTER than its
    ground): the card moved to the `elevated` Card variant's own tokens, `surfaceElevated` plus
    `border`, and the backdrop is now theme-aware, rgba(2,4,8,0.66) in dark against
    rgba(13,21,36,0.38) in light. A single wash for both themes is the trap here.

