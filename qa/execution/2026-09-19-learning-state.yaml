# LEARNING-STATE — execution records, 2026-09-19 (TASK-3001, Phase 3)
#
# All eight are automated runs: each corresponds to a test method written for this change and
# executed against the real Neon dev database via `mvn test -Dtest=LearningStateTest` —
# 8 tests, 0 failures, 473.5s.
#
# Worth recording, because the first run of this same suite did NOT pass: 5 of 8 failed with
# 500s, and the cause was a real defect in this session's own service rather than a fixture
# problem. LearningStateService was annotated @Transactional(readOnly = true), which looked
# correct for a GET — but TopicHealthService recomputes lazily and DELETEs the student's health
# rows when its cache is stale, so the read-only transaction propagated into that recompute and
# blocked it ("cannot execute DELETE in a read-only transaction"). The endpoint therefore worked
# for a student with no practice history and returned 500 for one with any, which is exactly the
# case a fixture-light test would have missed. Fixed by dropping readOnly, with the reason
# written into the service's own doc comment. Not logged as a defect: it never reached a build
# anyone could run, and was found and fixed in the same session by the test written to cover it.

