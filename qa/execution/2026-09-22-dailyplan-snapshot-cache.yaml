- execution_id: EXEC-CATALOG-0050
  test_case_id: TC-CATALOG-050
  test_case_version: 1
  environment: "Android emulator-5554, dev client on Metro, backend on the host via 10.0.2.2"
  build_version: "feature/on-device-llm-spike, uncommitted working tree"
  tester: "Claude Opus 5 (device pass, driven via adb)"
  executed_at: "2026-09-22T19:44:00+05:30"
  actual_result: >
    Steps 1-3 pass. First open showed "Loading exams..." then the catalogue, as expected with no
    snapshot yet. A second sort was loaded to cache its key. Airplane mode was then enabled and the
    sort switched back to the already-cached one: the full catalogue rendered - Applications Open
    with SSC CGL, Recommended For You with IBPS PO and IBPS Clerk, the filter and sort chips, the
    follow stars - with the note "Saved list, last updated 7:44 PM. Deadlines are counted for
    today." Before this change that situation produced "Couldn't load exams".
  status: Blocked
  defect_id: ""
  evidence: "exams-offline-final.png; three earlier invalid attempts kept as exams-cached2.png, exams-offline.png, exams-coldstart-offline.png"
  remarks: >
    BLOCKED, not Pass: step 4 (check a countdown against the real date) and step 5 (refresh after
    reconnecting) were not run. The re-derivation is pure and mirrors ExamDiscoveryService's rule
    including the 14-day threshold, but no card's countdown was actually checked against a calendar.
    THREE EARLIER ATTEMPTS AT THIS WERE INVALID AND ARE WORTH RECORDING, because both causes are
    environmental traps rather than product bugs:
    (1) TAB SCREENS STAY MOUNTED - switching Home -> Exams does not re-run the load effect, so what
    looked like a cache hit was in-memory state from an earlier online load. Changing SORT is what
    forces a genuine re-read.
    (2) 10.0.2.2 BYPASSES adb reverse - this dev build targets the emulator's host-loopback alias,
    so removing the tcp:8080 tunnel did NOT make the backend unreachable; the app reached the host
    directly and the "offline" test was really an online one. This project's own notes already
    record this trap once. Airplane mode does block it, but ALSO blocks Metro, so a dev build
    cannot be cold-started offline - go offline after the app is running.
