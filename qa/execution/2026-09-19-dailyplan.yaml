# DAILYPLAN — execution records, 2026-09-19 (TASK-3301, Phase 5)
#
# All nine are automated runs against the real Neon dev database:
# `mvn clean test -Dtest=DailyPlanTest` — 9 tests, 0 failures, BUILD SUCCESS, 670.4s.
# Migrations V48 and V49 applied cleanly to that database on the first of these runs (3.868s).
#
# IT TOOK THREE RUNS, and the failures are worth recording because only one was a product bug:
#
#   RUN 1 — 5 of 9 failed, all 500s, one cause. UserPreparationProfile was first mapped with
#   @MapsId onto a @OneToOne User, which makes Hibernate treat the user as part of this row's
#   identity and cascade a persist into it. The User handed in by AuthService was loaded in an
#   earlier transaction and is therefore detached, so every write died with "detached entity passed
#   to persist: User". Fixed by storing a bare userId on both new entities — neither needs to
#   navigate to the user, and the database still enforces the foreign key. A REAL defect in this
#   session's own code, found by the tests written to cover it, fixed before any build existed that
#   anyone could run — so not logged in qa/defects/.
#
#   RUN 2 — 3 of 9 failed, none of them the planner. Two were SocketTimeoutException while the
#   fixtures were still creating topics (the remote database being slow). The third was
#   NoClassDefFoundError on WeaknessRadarService$1 — the synthetic class javac generates for a
#   switch over an enum — missing from target/classes because an earlier `mvn test-compile` in this
#   same session had been run while a test suite was still executing, corrupting the build output.
#   That is the concurrent-Maven trap this project's own STATUS.md already documents; `mvn clean` resolved
#   it. An environment fault, not a code fault.
#
#   RUN 3 — 9 of 9, clean.
#
# Also fixed between runs 1 and 2: the suite took 3652s (61 minutes) because its fixtures created
# 305 questions one API call at a time, at roughly 14 seconds each, none of which anything asserted
# on. Cut to 33; the run is now 670s and exercises exactly the same paths.

