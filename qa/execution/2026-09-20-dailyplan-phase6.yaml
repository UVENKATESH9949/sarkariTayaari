# DAILYPLAN — execution records, 2026-09-20 (TASK-3401, Phase 6)
#
# Four automated runs against the real Neon dev database:
# `mvn -f backend/pom.xml test -Dtest=AdaptiveReplanningTest,DailyPlanTest,TaskOutcomeRuleTest` —
# 20 tests, 0 failures, 0 errors, BUILD SUCCESS. AdaptiveReplanningTest 5/5 (526.5s),
# TaskOutcomeRuleTest 6/6 (0.011s), and DailyPlanTest 9/9 (559.6s) re-run as a regression because
# Phase 6 changed that endpoint's response shape — Phase 5 did not regress. Those nine are already
# recorded as EXEC-DAILYPLAN-0001..0009 and are not duplicated here.
#
# Migration V50 applied cleanly to the same database at 2026-09-19T22:16:59 (schema 49 -> 50).
#
# PHASE 6 PASSED ON ITS FIRST REAL RUN — unusual for this program, and worth saying plainly rather
# than leaving the reader to infer it from the absence of a failure note. The likely reason is that
# the phase's own rules were pulled into a plain-JUnit test (TaskOutcomeRuleTest) before any
# integration test ran, so the thresholds were already proven against controlled counts.
#
# ONE EARLIER RUN FAILED AND TESTED NOTHING, which is worth recording so nobody reads it as a
# product problem: on 2026-09-19 at 23:56 all 14 integration tests errored in ~0.001s each, because
# the DATABASE CONNECTION DROPPED while Flyway was acquiring its startup advisory lock
# (SocketException: Connection reset -> "Unable to acquire PostgreSQL advisory lock" -> the Spring
# context never came up). TaskOutcomeRuleTest, which needs no database, passed 6/6 in that same run
# — which is what made the diagnosis immediate. An environment fault; this project's STATUS.md
# already records an overnight network drop causing the same class of failure once before.

