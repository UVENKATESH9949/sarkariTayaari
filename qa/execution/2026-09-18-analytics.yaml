# ANALYTICS + USER-PROGRESS — execution records, 2026-09-18 (TASK-2801)
#
# Two groups. EXEC-ANALYTICS-000x are automated runs: each corresponds to a test method
# written for this change and executed against the real Neon dev database via
# `mvn test -Dtest=BehavioralAnalyticsTest` — 13 tests, 0 failures. EXEC-USERPROGRESS-000x at
# the end are the Gate 1 device pass, run by hand on emulator-5554.
#
# Nothing here is backfilled, and one record is a Fail: EXEC-USERPROGRESS-0002 records that the
# four new practice-session fields reached the device's own database correctly but arrived NULL
# at the server. It is KEPT as a Fail rather than rewritten -- it genuinely failed when it ran --
# and EXEC-USERPROGRESS-0003 is its passing re-run, which also identifies the cause: the device
# had been uploading to a STALE pre-V47 backend, because the app targets 10.0.2.2:8080 (the
# emulator's host-loopback alias) and so bypasses `adb reverse` entirely. A test-environment
# fault, not product code, which is why neither record carries a defect id.
#
# TC-ANALYTICS-005 is absent: it is PartiallyAutomated and its step 3 (the /trends empty-week
# assertion) was not exercised, so recording it as a pass would overstate what was checked.

