- execution_id: EXEC-USERPROGRESS-0001
  test_case_id: TC-USERPROGRESS-007
  test_case_version: 1
  environment: "Android emulator-5554 (Pixel_7), Metro dev client, isolated backend on :8090"
  build_version: "feature/on-device-llm-spike @ 3a89856 + uncommitted TASK-2801 work"
  tester: "venkatesh.undekod@innovapptive.com (via Claude Code session)"
  executed_at: "2026-09-18T17:52:00+05:30"
  actual_result: >
    All 4 steps passed. A real SSC CGL Tier 1 mock attempt was started, 3 questions answered
    across the Reasoning section and 97 left unattempted, then submitted (the app's own
    confirmation read "97 questions unanswered"). The stored attempt recorded 1 correct,
    2 wrong, 97 unattempted, 100 total. topic_progress then held three NEW rows written by
    recordMockTopicPractice - Matrix (1 attempted, 0 correct), Seating Arrangement (1, 0) and
    Syllogism (1, 1) - i.e. exactly the 3 ANSWERED questions and not the 97 skipped ones, with
    correctness matching the attempt's 1-correct/2-wrong split. Per-topic total_time_ms came
    from the per-question timings (69285 / 7551 / 72082ms), not from dividing the attempt's
    duration. Pipes & Cisterns, a topic from an earlier practice session that this mock did not
    cover, was untouched at 2 attempts.
  status: Pass
  defect_id: ""
  evidence: "Device SQLite pulled via adb exec-out run-as; screenshots of the engine (3/100 answered) and the submit confirmation"
  remarks: >
    Before this change a mock attempt updated no topic mastery at all. Note the attempt id is a
    UUID (mocktest-828d01aa-...), confirming the TASK-2801 id change is live on device too.

- execution_id: EXEC-USERPROGRESS-0002
  test_case_id: TC-USERPROGRESS-005
  test_case_version: 1
  environment: "Android emulator-5554 (Pixel_7), Metro dev client"
  build_version: "feature/on-device-llm-spike @ 3a89856 + uncommitted TASK-2801 work"
  tester: "venkatesh.undekod@innovapptive.com (via Claude Code session)"
  executed_at: "2026-09-18T17:35:00+05:30"
  actual_result: >
    PARTIAL - device capture verified, server round trip NOT verified from the device.
    A real practice session (Pipes & Cisterns, Easy, 2 of 42 answered) stored started_at
    1789732625754, completed_at 1789732854339 and duration_ms 228585 - the duration exactly
    equal to completed minus started - plus available_count 42, total_count 2, exam_code
    SSC_CGL, and per-question time_ms of 103361 and 125053. The Summary screen independently
    read "Finished early - 2 of 42 answered, 40 left". The session id was a UUID.
    HOWEVER, after signing in, GET /api/progress returned that session with startedAt,
    durationMs, availableCount and examCode all NULL, while timeMs on both results arrived
    correctly. The server itself round-trips all four correctly when sent the same payload by
    curl, and the client's only upload path builds them - so this is unexplained rather than
    diagnosed. See the report for the two candidate causes.
  status: Fail
  defect_id: ""
  evidence: "Device SQLite before/after; GET /api/progress response; curl round-trip against the same backend"
  remarks: >
    Recorded as Fail rather than Pass because the acceptance criterion is a round trip, and it
    did not happen. Deliberately NOT logged as a defect: the cause is unidentified and may be a
    stale Metro transform rather than product code. Re-run with `expo start --clear` first.

- execution_id: EXEC-USERPROGRESS-0003
  test_case_id: TC-USERPROGRESS-005
  test_case_version: 1
  environment: "Android emulator-5554 (Pixel_7), Metro dev client, V47 backend on host port 8080"
  build_version: "feature/on-device-llm-spike @ 3a89856 + uncommitted TASK-2801 work"
  tester: "venkatesh.undekod@innovapptive.com (via Claude Code session)"
  executed_at: "2026-09-18T20:59:00+05:30"
  actual_result: >
    PASS - the re-run of EXEC-USERPROGRESS-0002, and it identifies that failure's cause as a
    test-environment fault rather than product code. A real practice session (Pipes & Cisterns,
    Easy, 2 of 42 answered) stored started_at 1789744511576, duration_ms 149511, available_count
    42 and exam_code SSC_CGL locally, then uploaded on account creation. GET /api/progress
    returned startedAt "2026-09-18T15:15:11.576Z" - the exact same instant as the local
    1789744511576 - plus durationMs 149511, availableCount 42, examCode SSC_CGL, and per-result
    timeMs [76751, 72305]. GET /api/me/analytics/overview then reported totalStudyTimeMs 149511
    with practiceSessionsWithoutDuration 0 and currentStreakDays 1 in Asia/Kolkata, and
    /topics reported averageTimeMs 74528 - exactly the mean of the two recorded times - with
    mockAccuracy null and trend INSUFFICIENT_DATA.
  status: Pass
  defect_id: ""
  evidence: "Device SQLite; GET /api/progress; GET /api/me/analytics/{overview,topics}"
  remarks: >
    ROOT CAUSE of EXEC-USERPROGRESS-0002, confirmed: the app's baked-in base URL is
    http://10.0.2.2:8080/api - the emulator's HOST-loopback alias - which goes straight to the
    host's port 8080 and completely bypasses `adb reverse`. The previous run had mapped
    `adb reverse tcp:8080 tcp:8090` and assumed that pointed the app at the V47 backend; it did
    not. The device was in fact uploading to a STALE backend left running on host:8080 from
    2026-09-17, built before V47. That build's ProgressDtos had no startedAt/durationMs/
    availableCount/examCode, and Spring's Jackson silently ignores unknown JSON properties, so
    those four were dropped while timeMs - which existed in that older build - came through.
    NOT logged as a defect: no product code was at fault. The earlier "stale Metro transform"
    hypothesis was wrong and is corrected in the report and in memory/STATUS.md.
