- execution_id: EXEC-CATALOG-0003
  test_case_id: TC-CATALOG-055
  test_case_version: 1
  environment: "Android emulator-5554 (Pixel_7), Metro dev client, real dev backend on localhost:8080"
  build_version: "feature/on-device-llm-spike @ 3a89856 + uncommitted active-exam work"
  tester: "venkatesh.undekod@innovapptive.com (via Claude Code session)"
  executed_at: "2026-09-16T17:05:00+05:30"
  actual_result: >
    Steps 1-4 passed. (1) With IBPS PO active (deliberately NOT the first-followed exam, so the
    result could not be a false pass), force-stop and relaunch came back on IBPS PO; migration 0026
    had already applied against this device's real populated database and the existing preferences
    row survived. (2) In airplane mode, switching IBPS PO -> RRB NTPC completed in 586ms and Home
    updated; no network was required. (3) Switching to an exam with no cached guide completed and
    Home rendered without the deadline card rather than blocking. (4) Unfollowing the active exam
    promoted the most recently followed remaining exam every time, down to "(none left)".
    STEP 5 FAILED. Unfollowing everything and pulling to refresh did NOT auto-follow an exam
    (ensureExamFollowed only runs at app start, not on a delta sync). On the next cold start it
    DID auto-follow SSC CGL - but active_exam_code stayed NULL and Home rendered a blank
    "Preparing for" card with no exam name, no Focus next and no deadline, and stayed that way.
  status: Fail
  defect_id: DEF-CATALOG-001
  evidence: "device SQLite: active_exam_code NULL with followed_exams = [SSC_CGL]; screenshot empty.png"
  remarks: >
    Two separate findings. The step's own expectation was wrong about the trigger (app start, not
    pull-to-refresh) and has been corrected in the test-case definition. The blank-card state that
    followed is a genuine defect and is recorded as DEF-CATALOG-001.

