- id: TC-USERPROGRESS-006
  requirement_ids: [REQ-USERPROGRESS-004]
  scenario_id: SCN-USERPROGRESS-006
  system: Backend
  module: USER-PROGRESS
  feature: Each answer records the classification the question had when it was answered
  title: Retagging a question leaves history already recorded unchanged
  objective: >
    Confirm the classification snapshot is what analytics groups by, so a later content edit
    cannot retroactively rewrite what a student did.
  preconditions:
    - "An admin token; a question tagged easy"
  test_data: "One question, one disposable student account"
  test_environment: "Backend against the real dev database"
  priority: High
  severity: Major
  test_type: Integration
  steps:
    - step: 1
      action: "As a student, answer the easy question and upload the session"
      expected: "200"
    - step: 2
      action: "GET /api/me/analytics/difficulty"
      expected: "One row, difficultyCode easy, attempts 1"
    - step: 3
      action: "As an admin, PUT the question with difficulty hard"
      expected: "200, the question now reports difficulty hard"
    - step: 4
      action: "GET /api/me/analytics/difficulty again"
      expected: >
        STILL one row, difficultyCode easy, attempts 1 — the student's history did not move.
        Before the snapshot existed this would have flipped to hard.
  expected_result: >
    Retagging a question does not move any figure derived from earlier answers.
    (REQ-USERPROGRESS-004 acceptance_criteria)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: "Step 4 is the whole reason the snapshot columns exist — treat it as the regression guard."
  automation_status: Automated
  automation_reference: "BehavioralAnalyticsTest.retaggingAQuestionDoesNotRewriteHistoryAlreadyRecorded"

