- id: TC-USERPROGRESS-008
  requirement_ids: [REQ-USERPROGRESS-006]
  scenario_id: SCN-USERPROGRESS-008
  system: Web
  module: USER-PROGRESS
  feature: The web client measures per-question time, as mobile already did
  title: Web practice and mock uploads carry a per-question timeMs, including the last question
  objective: >
    Confirm the browser now measures what mobile has measured since V24, that revisiting a
    question accumulates rather than restarting, and that the question on screen at submit is
    not silently lost.
  preconditions:
    - "Signed in as a disposable test account; a topic with at least 3 real questions; a mockable paper"
  test_data: "One disposable account; one practice topic; one mock paper"
  test_environment: "web/ dev build against a running backend"
  priority: Medium
  severity: Major
  test_type: Functional
  steps:
    - step: 1
      action: "Start a practice session. Spend an obviously different amount of time on each of three questions (e.g. ~5s, ~20s, ~40s), answering each"
      expected: "Each question reveals normally; nothing about timing is visible to the student"
    - step: 2
      action: "Navigate back to the first question, wait ~10 more seconds, then return forward"
      expected: "No state is lost; the answer and reveal are unchanged"
    - step: 3
      action: "Press Finish while the last question is still on screen, then GET /api/progress for this account"
      expected: >
        Every result carries a non-null timeMs. The first question's value reflects BOTH visits
        (roughly 15s, not 5s). The LAST question has a non-null value — not null, which is what a
        missing commit-on-finish would produce
    - step: 4
      action: "GET /api/me/analytics/topics"
      expected: "averageTimeMs for that topic is non-null and in the right order of magnitude"
    - step: 5
      action: "Start a mock attempt, answer two questions, leave one untouched, and submit"
      expected: >
        The answered questions carry non-null timeMs; the untouched one carries null, not 0 —
        never displayed means never measured
    - step: 6
      action: "Open a question, switch to another browser tab for several minutes, return, and finish"
      expected: "That question's timeMs is capped at 300000 (5 minutes), not the full wall-clock gap"
  expected_result: >
    Web-recorded answers carry honest per-question times that mean the same thing as mobile's.
    (REQ-USERPROGRESS-006 acceptance_criteria)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: >
    Step 3's last-question assertion is the explicit regression guard — the effect that banks a
    period only runs on navigation or unmount, so without the explicit commit at submit the final
    question's time is always lost. Step 6 exercises the cap.
  automation_status: ManualOnly
  automation_reference: ""
