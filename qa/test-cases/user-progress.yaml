- id: TC-USERPROGRESS-003
  requirement_ids: [REQ-USERPROGRESS-002]
  scenario_id: SCN-USERPROGRESS-003
  system: Backend
  module: USER-PROGRESS
  feature: Upload ownership — a session id owned by another account is refused, never merged
  title: Uploading another account's session id neither overwrites it nor transfers it
  objective: >
    Confirm the ownership invariant holds on the write path: a client can only create or
    update progress belonging to the authenticated user.
  preconditions:
    - "Two distinct signed-up accounts, A and B"
  test_data: "Two disposable accounts; one shared session id string"
  test_environment: "Backend against the real dev database"
  priority: Critical
  severity: Critical
  test_type: Security
  steps:
    - step: 1
      action: "As account A, POST /api/progress/sync with a session id S and correctCount 9"
      expected: "200, practiceSessionsStored = 1"
    - step: 2
      action: "As account B, POST /api/progress/sync with the SAME id S and correctCount 1"
      expected: "200, practiceSessionsStored = 0, rejectedPracticeSessionIds contains S"
    - step: 3
      action: "GET /api/progress as account A"
      expected: "Session S is present and still has correctCount 9 — not overwritten with B's 1"
    - step: 4
      action: "GET /api/progress as account B"
      expected: "Empty — B did not acquire A's session"
  expected_result: >
    One account cannot overwrite or acquire another's history by naming its id.
    (REQ-USERPROGRESS-002 acceptance_criteria)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: "Regression guard for the defect TASK-2801's audit found in ProgressService.upload."
  automation_status: Automated
  automation_reference: "BehavioralAnalyticsTest.anotherAccountsSessionIdIsRejected_notMergedOverTheirs"

- id: TC-USERPROGRESS-004
