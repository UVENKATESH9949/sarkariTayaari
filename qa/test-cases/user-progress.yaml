  feature: Upload ownership — a session id owned by another account is refused, never merged
  title: A contested id in a batch does not prevent the rest of the batch from being stored
  objective: >
    Confirm rejection is per-row, so one bad id cannot strand a device's entire queue.
  preconditions:
    - "Account A has already uploaded a session under id S"
  test_data: "Two disposable accounts"
  test_environment: "Backend against the real dev database"
  priority: High
  severity: Major
  test_type: ErrorHandling
  steps:
    - step: 1
      action: "As account B, upload a batch containing BOTH id S (owned by A) and B's own new id T"
      expected: "200, practiceSessionsStored = 1, rejectedPracticeSessionIds = [S]"
    - step: 2
      action: "GET /api/progress as account B"
      expected: "Exactly one session, id T — S is absent"
  expected_result: >
    A rejected id is skipped, not fatal to the request. (REQ-USERPROGRESS-002 error_conditions)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
  automation_status: Automated
  automation_reference: "BehavioralAnalyticsTest.aRejectedIdDoesNotBlockTheRestOfTheBatch"

