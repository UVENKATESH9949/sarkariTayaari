# QUESTIONS module — manual test cases (Phase 3)
#
# Every test case links to one scenario id and one or more requirement ids. A test case is a
# reusable DEFINITION — never overwritten by an execution (qa/execution/*.yaml, not yet
# created). Expected results are derived strictly from the linked requirement's
# acceptance_criteria/error_conditions/edge_conditions — never from current controller/
# mobile/admin/database implementation. Every case below is freshly generated and
# UNEXECUTED: actual_result is empty, status is Not Executed, defect_id is empty. No tester
# name, date, build, credential, or result has been invented.
#
# REVIEWER-related cases (REQ-QUESTIONS-019 / SCN-QUESTIONS-043): the documented
# ADMIN/STUDENT/anonymous authorization matrix is tested normally (TC-QUESTIONS-042). The
# REVIEWER-role path itself (TC-QUESTIONS-043) is preserved as execution-blocked — no
# provisioning path is invented, and the case must never be marked passed on the strength of
# the endpoint merely existing.
#
# Documented-deviation cases (Cloudinary-failure 500, sectional... n/a to this module) assert
# the actual documented behavior. Genuinely-ambiguous cases (soft-delete idempotency, empty
# bulk-delete array, malformed supportedTypes) do not pre-assert an outcome.

