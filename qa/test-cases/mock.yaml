- id: TC-MOCK-001
  requirement_ids: [REQ-MOCK-001]
  scenario_id: SCN-MOCK-001
  system: Mobile
  module: MOCK
  feature: Mock Test Hub — pick a format after choosing an exam
  title: All 9 cards render and route correctly; each chip narrows the visible set
  objective: Confirm the Hub screen's navigation contract holds for every format and every chip.
  preconditions:
    - "An exam with at least one official mockable paper and a real syllabus is chosen"
  test_data: "Any real, active exam with a synced syllabus"
  test_environment: "Android emulator, dev build, signed in or out"
  priority: High
  severity: Major
  test_type: Functional
  steps:
    - step: 1
      action: "From Exam Selection, tap an exam"
      expected: "The Hub screen opens, showing the exam's name and 9 cards under 'All Mock Tests'"
    - step: 2
      action: "Tap each chip (Topic, Subject, Speed, PYQ, Full Mock, Personalized) in turn"
      expected: "Only cards whose category matches the chip remain visible; the count next to the section label updates to match"
    - step: 3
      action: "Tap Full Length Mock"
      expected: "The existing papers.tsx screen opens, listing official papers exactly as before this change"
    - step: 4
      action: "Go back, tap Topic Wise Mock"
      expected: "The builder screen opens, starting with a subject picker"
  expected_result: "Every card is reachable and every chip filters correctly (REQ-MOCK-001 acceptance_criteria)."
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
  automation_status: ManualOnly
  automation_reference: ""

