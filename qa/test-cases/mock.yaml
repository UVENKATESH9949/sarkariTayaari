  system: Backend
  module: MOCK
  feature: Ad-hoc mock formats narrow the same question pool the Full Length Mock samples from
  title: mock-count/mock-sample narrow correctly by topicIds
  objective: Confirm a topicIds param excludes questions from a sibling topic in the same subject.
  preconditions: []
  test_data: "Two questions in the same subject, different topics, created by the test itself"
  test_environment: "Backend integration test, real Neon dev database"
  priority: High
  severity: Major
  test_type: Integration
  steps:
    - step: 1
      action: "Create one question in the fixture topic and one in a second topic of the same subject"
      expected: "Both exist and are published"
    - step: 2
      action: "GET /api/questions/mock-count and /mock-sample with subjectIds set to the shared subject and topicIds set to only the fixture topic"
      expected: "count is 1; the sample contains only the fixture-topic question, never the second topic's"
  expected_result: "topicIds narrows correctly without affecting the un-narrowed call shape."
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: "See EXEC-MOCK-0001 for the real, already-passing execution of this case."
  automation_status: Automated
