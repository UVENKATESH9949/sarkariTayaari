  scenario_id: SCN-WEB-003
  system: Backend
  module: WEB
  feature: Evaluator agreement between Java and TypeScript
  title: All shared fixture cases score identically on both sides
  objective: >
    Confirm the two deliberate evaluator implementations agree on every shared case.
  preconditions:
    - "sample-data/question-evaluator-fixtures.json is unmodified"
  test_data: "sample-data/question-evaluator-fixtures.json"
  test_environment: "Developer machine; backend test suite and packages/core both runnable"
  priority: Critical
  severity: Critical
  test_type: Functional
  steps:
    - step: 1
      action: "Run the Java fixture test (QuestionEvaluatorsTest)"
      expected: "All cases pass"
    - step: 2
      action: "Run `npm run test --workspace @sarkaritaiyaari/core`"
      expected: "All fixture cases pass, including the null-answerKey and null-response cases"
    - step: 3
      action: "Invert one comparison in the TypeScript evaluator and re-run the TypeScript test"
      expected: >
