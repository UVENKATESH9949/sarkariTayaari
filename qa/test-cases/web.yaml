- id: TC-WEB-011
  requirement_ids: [REQ-WEB-007]
  scenario_id: SCN-WEB-010
  system: Web
  module: WEB
  feature: Browser session
  title: A revoked token signs the student out; an unreachable backend does not
  objective: >
    Confirm startup validation distinguishes server rejection from server unavailability.
  preconditions:
    - "A signed-in session exists in the browser"
  test_data: "n/a"
  test_environment: "Browser against a controllable backend"
  priority: High
  severity: Critical
  test_type: ErrorHandling
  steps:
    - step: 1
      action: "Sign out on another device/session so the stored token is revoked server-side, then reload this browser"
      expected: "The app treats the session as ended and shows the signed-out state"
    - step: 2
      action: "Sign in again, then stop the backend entirely and reload"
      expected: >
        The student is NOT signed out — an unreachable backend is not evidence the token is
        invalid. The app may show an error for data it cannot load.
    - step: 3
      action: "Start the backend and reload"
      expected: "The session is intact and data loads"
  expected_result: >
    Only an explicit rejection discards the session. (REQ-WEB-007 error_conditions)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: >
    Getting this backwards would sign every student out whenever the backend hiccuped, which
    would read as a login bug rather than an availability one.
  automation_status: ManualOnly
  automation_reference: ""

- id: TC-WEB-012
  requirement_ids: [REQ-WEB-008]
  scenario_id: SCN-WEB-011
  system: Backend
  module: WEB
  feature: Cross-origin access
  title: The CORS allowlist admits listed origins and refuses near-misses
  objective: >
    Confirm origin matching is exact, including the two near-miss pairs that have caused or
    would cause a total client outage.
  preconditions:
    - "A backend is running with a known allowed-origins value"
  test_data: "The configured allowlist for the target environment"
  test_environment: "Any HTTP client (no browser required)"
  priority: Critical
  severity: Critical
  test_type: Security
  steps:
    - step: 1
      action: "Send an OPTIONS preflight to /api/exams with Origin set to an allowlisted origin and Access-Control-Request-Method: GET"
      expected: "200 with Access-Control-Allow-Origin echoing that exact origin, and Authorization among the allowed headers"
    - step: 2
      action: "Repeat with Origin set to the same host and port but the other loopback spelling (127.0.0.1 vs localhost)"
      expected: "403 'Invalid CORS request' — these are different origins"
    - step: 3
      action: "Repeat with http:// where the allowlist has https:// (or vice versa)"
      expected: "403 — scheme is part of the origin"
    - step: 4
      action: "On a Firebase-hosted deployment, repeat for both the .web.app and .firebaseapp.com origins"
      expected: "Both succeed only if both are listed; Firebase serves both by default"
  expected_result: >
    Exactly the configured origins are admitted. (REQ-WEB-008 acceptance_criteria)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: >
    Changing the allowlist needs a backend restart locally, or a new Cloud Run revision in
    production. APP_CORS_ALLOWED_ORIGINS replaces rather than appends.
  automation_status: CandidateForAutomation
  automation_reference: ""

