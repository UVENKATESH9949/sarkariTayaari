    Manually verified this phase via a one-off Playwright script against the real dev
    backend (SSC CGL Tier 1, 100 questions): scorecard read -2.5 for 0 correct/5 wrong under
    a +2/-0.5 scheme, matching the answers actually clicked. Writing the case is the
    deliverable per AI_RULES.md §3.21; this remark is evidence, not an executed result.
