- id: TC-WEB-015
  requirement_ids: [REQ-WEB-010]
  scenario_id: SCN-WEB-014
  system: Web
  module: WEB
  feature: Mock Test engine
  title: A full timed attempt runs blind and scores correctly against real marking
  objective: >
    Confirm a real Mock Test attempt shows no reveal styling before submit, and that the
    scorecard's marks and per-question review are correct once submitted.
  preconditions:
    - "At least one exam has a mockable paper with sections that have available live questions"
  test_data: "A real mockable paper (e.g. SSC CGL Tier 1)"
  test_environment: "Chromium, desktop viewport, against the real backend"
  priority: Critical
  severity: Critical
  test_type: Functional
  steps:
    - step: 1
      action: "Open Mock Test, pick an exam, pick its paper, read the pre-test briefing, and start"
      expected: "The briefing shows honest per-section availability and the correct marking scheme; Start begins the countdown"
    - step: 2
      action: "Answer several questions of different types without submitting"
      expected: "No option/answer anywhere shows correct/incorrect styling — the engine stays blind throughout"
    - step: 3
      action: "Mark one question for review, then open Submit test"
      expected: "The confirmation dialog names the number of questions actually answered"
    - step: 4
      action: "Confirm Submit"
      expected: >
        The Result screen shows a scorecard whose total matches
