        the test is wired to the logic rather than passing vacuously
    - step: 4
      action: "Revert and re-run"
      expected: "All cases pass again"
  expected_result: >
    A student's answer scores the same wherever it is graded. (REQ-WEB-002 acceptance_criteria)
