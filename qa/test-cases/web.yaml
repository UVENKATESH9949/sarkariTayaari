# WEB module — manual test cases
#
# Every case links to one scenario id and one or more requirement ids. A test case is a
# reusable DEFINITION — it is never overwritten by an execution (qa/execution/*.yaml). Expected
# results derive from the linked requirement, never from observed implementation behaviour.
#
# Every case below is UNEXECUTED: actual_result empty, status Not Executed, defect_id empty.
# Some of these behaviours WERE checked by hand while Phase 0 was built, and that account lives
# in tasks/TASK-2601-student-web-application.md — but an execution record needs a real tester,
# date and build, and none of those is invented here.
#
# automation_status is evidence-based. `Automated` appears only where the named test genuinely
# asserts the case. web/ has no browser-test runner configured, so its UI cases are ManualOnly,
# the same standing as mobile/ and admin/.

- id: TC-WEB-001
  requirement_ids: [REQ-WEB-001]
  scenario_id: SCN-WEB-001
  system: Mobile
  module: WEB
  feature: Shared logic has exactly one implementation
  title: Mobile typechecks, lints at baseline and bundles after the shared extraction
  objective: >
    Confirm moving shared logic into packages/core leaves the shipped phone app building
    exactly as before.
  preconditions:
    - "packages/core installed; mobile/ has its @sarkaritaiyaari/core dependency"
  test_data: "n/a"
  test_environment: "Developer machine with mobile/ dependencies installed"
  priority: Critical
  severity: Critical
  test_type: Regression
  steps:
    - step: 1
      action: "Run `npx tsc --noEmit` in mobile/"
      expected: "Exit code 0, no errors"
    - step: 2
      action: "Run `npx expo lint` in mobile/"
      expected: "The documented baseline of 9 problems (8 errors, 1 warning), with no new entries"
    - step: 3
      action: "Run `npx expo export --platform android`"
      expected: "A bundle is produced with no resolution errors"
    - step: 4
      action: "Search the produced .hbc for markers of each shared module (e.g. PENDING_REVIEW, TOPIC_HEALTH_V1, a palette hex, an English catalogue string)"
      expected: >
        All markers present. Non-ASCII strings (the Telugu catalogue) are stored UTF-16LE in
        Hermes bytecode — a plain UTF-8 search reports them missing when they are present.
  expected_result: >
    Mobile is functionally unchanged by the extraction, and the shared modules are genuinely
    bundled rather than silently dropped. (REQ-WEB-001 acceptance_criteria)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: "Step 4's encoding trap cost real time once; it is written into the step deliberately."
  automation_status: ManualOnly
  automation_reference: ""

- id: TC-WEB-002
  requirement_ids: [REQ-WEB-001]
  scenario_id: SCN-WEB-002
  system: Web
  module: WEB
  feature: Shared logic has exactly one implementation
  title: A platform-specific global in shared source fails the purity test
  objective: >
    Confirm the guard that keeps packages/core consumable by both Metro and Vite actually
    fails, rather than merely being configured.
  preconditions:
    - "packages/core tests pass before the change"
  test_data: "n/a"
  test_environment: "Developer machine, packages/core installed"
  priority: High
  severity: Major
  test_type: Negative
  steps:
    - step: 1
      action: "Add a reference to a browser-only global (for example `localStorage.getItem`) to any non-test file under packages/core/src"
      expected: "`npm run test --workspace @sarkaritaiyaari/core` fails, naming that file"
    - step: 2
      action: "Revert the change and re-run"
      expected: "All tests pass again"
    - step: 3
      action: "Add a reference to a Node-only global (for example `process.env`) and run `npm run typecheck --workspace @sarkaritaiyaari/core`"
      expected: "The library typecheck fails — no `types` are declared, so Node globals are unavailable"
  expected_result: >
    Both classes of platform leak are caught before they can reach a runtime on the platform
    that lacks them. (REQ-WEB-001 error_conditions)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
  automation_status: Automated
  automation_reference: "packages/core/src/platformPurity.test.ts (describe 'platform purity')"

- id: TC-WEB-003
