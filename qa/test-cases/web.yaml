- id: TC-WEB-016
  requirement_ids: [REQ-WEB-010]
  scenario_id: SCN-WEB-015
  system: Web
  module: WEB
  feature: Mock Test engine — question navigator
  title: The navigator stays usable on a real 100+ question paper, at both viewport widths
  objective: >
    Confirm the question-navigator dialog's Close button and every cell remain reachable and
    clickable when a real paper has far more questions than fit in the dialog at once, and
    that answered/marked cell states match reality.
  preconditions:
    - "A mockable paper with at least ~100 questions (e.g. SSC CGL Tier 1)"
  test_data: "Same paper as TC-WEB-015"
  test_environment: "Chromium, both a desktop (1280px) and a phone (390px) viewport"
  priority: High
  severity: Major
  test_type: Regression
  steps:
    - step: 1
      action: "Start the attempt, answer a few questions, mark one for review, then open Questions"
      expected: "The navigator dialog opens showing every question as a numbered cell, scrollable within a capped-height panel"
    - step: 2
      action: "Scroll the grid to the bottom cell"
      expected: "The dialog's own Close button is visible and clickable without it, or any cell, being cut off by the viewport"
    - step: 3
      action: "Compare the grid's answered/marked cell colours against the actions just taken"
      expected: "Exactly the answered questions show the answered colour, the marked one shows the marked colour (marked takes precedence over answered), and unvisited questions are visually distinct from both"
    - step: 4
      action: "Repeat at a 390px-wide viewport"
      expected: "Identical behaviour; no horizontal overflow"
  expected_result: >
    The navigator is fully usable regardless of paper size or viewport width.
    (REQ-WEB-010 validations)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: >
    This is a regression guard: a real bug was found and fixed this phase — the grid's
    scroll wrapper (`.navigator-scroll`, already defined in index.css with a comment
    describing exactly this failure) was never actually applied in MockTestEngine.tsx's
    JSX, so the Close button was unreachable on a real 100-question paper. Confirmed fixed
    via a one-off Playwright script at both 1280px and 390px before this case was written.
  automation_status: ManualOnly
  automation_reference: ""

- id: TC-WEB-017
  requirement_ids: [REQ-WEB-010]
  scenario_id: SCN-WEB-016
  system: Web
  module: WEB
  feature: Mock Test engine — unload guard
  title: Leaving an active attempt is guarded; a finished one is not
  objective: >
    Confirm in-app navigation away from an active attempt is intercepted with a styled
    confirmation, a tab close/refresh during an active attempt arms the native beforeunload
    prompt, and neither fires once the attempt is submitted.
  preconditions:
    - "An attempt is in progress (started, not yet submitted)"
  test_data: "Any mockable paper"
  test_environment: "A real browser, not headless automation (beforeunload cannot be exercised under automation)"
  priority: High
  severity: Major
  test_type: Functional
  steps:
    - step: 1
      action: "While an attempt is in progress, click a sidebar/nav link (e.g. Home)"
      expected: "This app's own styled confirmation dialog appears; navigation does not happen until confirmed"
    - step: 2
      action: "While an attempt is in progress, attempt to close the tab or reload"
      expected: "The browser's own native 'leave site?' prompt appears"
    - step: 3
      action: "Submit the attempt, then repeat steps 1 and 2"
      expected: "Neither guard fires — navigation and reload both proceed immediately"
  expected_result: >
    An in-progress attempt cannot be lost to an accidental click or reload without a warning,
    and a finished attempt never nags. (REQ-WEB-010 edge_conditions)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: >
    The in-app half is straightforward to automate; the beforeunload half is not — browsers
    deliberately suppress the native prompt under automated control, so this case is
    manual-only by nature, not by omission.
  automation_status: ManualOnly
  automation_reference: ""
