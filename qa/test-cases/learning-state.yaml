# LEARNING-STATE module — manual test cases
#
# Every case below is Automated with a real, verified test method behind it (LearningStateTest,
# 8/8 green against the real dev database on 2026-09-19). They are recorded here as UNEXECUTED
# manual cases in the register's own convention; the automated runs that actually happened are
# recorded in qa/execution/.

- id: TC-LEARNINGSTATE-001
  requirement_ids: [REQ-LEARNINGSTATE-001]
  scenario_id: SCN-LEARNINGSTATE-001
  system: Backend
  module: LEARNING-STATE
  feature: One student's canonical learning state is readable, and only their own
  title: The learning-state endpoint rejects an unauthenticated caller
  objective: "Confirm the new endpoint is token-gated, like the radar and unlike the public topic-intelligence read."
  preconditions:
    - "A running backend"
    - "An exam with at least one mapped topic"
  test_data: "One disposable exam"
  test_environment: "Backend against the real dev database"
  priority: High
  severity: Critical
  test_type: Security
  steps:
    - step: 1
      action: "GET /api/me/learning-state?examCode={code} with no Authorization header"
      expected: "401"
    - step: 2
      action: "Inspect the controller's route definition"
      expected: "examCode is the only parameter — nothing names a user"
  expected_result: "The endpoint is unreachable unauthenticated and cannot be pointed at another account. (REQ-LEARNINGSTATE-001 acceptance_criteria)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
  automation_status: Automated
  automation_reference: "LearningStateTest.requiresASignedInUser"

