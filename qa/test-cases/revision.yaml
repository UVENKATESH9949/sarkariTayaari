  automation_reference: "RevisionPlanTest.anUntouchedTopicIsNotScheduledAndSaysWhy"

- id: TC-REVISION-008
  requirement_ids: [REQ-REVISION-003, REQ-REVISION-004]
  scenario_id: SCN-REVISION-008
  system: Backend
  module: REVISION
  feature: The rung is scaled by how well the student currently knows the topic
  title: An unrecognised or unmeasured state produces no rung at all
  objective: >
    Confirm INSUFFICIENT_DATA, a null verdict, and a state this service does not recognise all
    yield no due date rather than silently defaulting onto one.
  preconditions:
    - "None — constructed states, no database"
  test_data: "Composites with null, INSUFFICIENT_DATA and an unknown performance state"
  test_environment: "Plain JUnit, no Spring context"
  priority: Medium
  severity: Major
  test_type: Boundary
  steps:
    - step: 1
      action: "Resolve the rung for a null and an INSUFFICIENT_DATA performance state"
      expected: "No rung in both cases"
    - step: 2
      action: "Resolve the rung for a state string the service does not know"
      expected: "No rung — not the shortest or longest interval"
  expected_result: "A verdict the service cannot interpret never acquires a due date. (REQ-REVISION-003 edge_conditions)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: "Guards a future health-model state from silently inheriting someone else's spacing."
  automation_status: Automated
  automation_reference: "RevisionLadderTest.aTopicWithNothingMeasuredIsNotScheduledAtAll, .anUnrecognisedStateIsLeftUnscheduledRatherThanDefaulted"

- id: TC-REVISION-009
  requirement_ids: [REQ-REVISION-005]
  scenario_id: SCN-REVISION-009
  system: Backend
  module: REVISION
  feature: Due work leads the plan, and re-testing resolves to something the app can open
  title: The re-test is timed practice, capped at the questions that exist
  objective: "Confirm the instrument and its sizing, and that minutes use the shared estimate ladder."
  preconditions:
    - "A practised topic carrying only two questions — fewer than any recommended step would ask for"
    - "Enough attempts for the health model to assert a verdict at all"
  test_data: "Three practice sessions over the same two questions, 62/61/60 days ago"
  test_environment: "Backend against the real dev database"
  priority: High
  severity: Major
  test_type: Functional
  steps:
    - step: 1
      action: "Read retest.action"
      expected: "TIMED_PRACTICE"
    - step: 2
      action: "Read retest.questionCount"
      expected: "Positive and no greater than 2 — capped by what the bank holds"
    - step: 3
      action: "Read retest.questionCountBasis and retest.estimate.source"
      expected: "RECOMMENDED_STEP or DEFAULT; the estimate source one of the four declared tiers"
  expected_result: "A re-test opens a screen the app can actually fill. (REQ-REVISION-005 acceptance_criteria)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: "Step 2 is the regression guard: an uncapped count would send a student to a screen it cannot fill."
  automation_status: Automated
  automation_reference: "RevisionPlanTest.theRetestIsTimedPracticeAndNeverExceedsTheQuestionsAvailable"

