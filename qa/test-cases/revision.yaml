- id: TC-REVISION-005
  requirement_ids: [REQ-REVISION-002, REQ-REVISION-005]
  scenario_id: SCN-REVISION-005
  system: Backend
  module: REVISION
  feature: A due date comes from a versioned, declared interval model
  title: A topic practised 90 days ago is due, and leads the plan over a fresher higher-priority topic
  objective: >
    Confirm a real attempt timestamp produces a real due date, and that urgency of forgetting
    outranks exam weight in this plan's ordering.
  preconditions:
    - "Two topics with questions; one practised 90 days ago at priority 40, one practised today at priority 90"
  test_data: "Two practice sessions, dated 90 days ago and today"
  test_environment: "Backend against the real dev database"
  priority: High
  severity: Critical
  test_type: Functional
  steps:
    - step: 1
      action: "Read the stale topic's status, daysOverdue, daysUntilDue and intervalDays"
      expected: "DUE; daysOverdue positive; daysUntilDue null; intervalDays one of 3, 7, 21, 45"
    - step: 2
      action: "Read the fresh topic's status"
      expected: "NOT_DUE with daysUntilDue populated and daysOverdue null"
    - step: 3
      action: "Read topics[0]"
      expected: "The stale topic, despite the fresh one carrying more than twice the exam priority"
    - step: 4
      action: "Read dueCount and totalDueMinutes"
      expected: "1 and a positive figure"
  expected_result: "Due dates derive from real recency, and due work leads. (REQ-REVISION-005 acceptance_criteria)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: >
    Step 1 asserts the interval is one of the four rungs rather than a specific one — which rung
    applies depends on the health model's verdict, which is that service's business, not this one's.
  automation_status: Automated
  automation_reference: "RevisionPlanTest.aTopicLastPractisedLongAgoIsDueAndLeadsThePlan"

- id: TC-REVISION-006
  requirement_ids: [REQ-REVISION-003]
  scenario_id: SCN-REVISION-006
  system: Backend
  module: REVISION
  feature: The rung is scaled by how well the student currently knows the topic
  title: All four rungs are reachable and the ladder is monotonic
  objective: >
    Confirm the decision table behaves as decided — 3 days for shaky, 7 for moving, 21 for strong,
    45 for strong and mastered — and that a weaker topic never waits longer than a stronger one.
  preconditions:
    - "None — constructed states, no database"
  test_data: "Composites covering NEEDS_ATTENTION, NEEDS_REVISION, DEVELOPING, IMPROVING, STRONG, STRONG+MASTERED"
  test_environment: "Plain JUnit, no Spring context"
  priority: High
  severity: Major
  test_type: Functional
  steps:
    - step: 1
      action: "Resolve the rung for each state combination"
      expected: "3 / 3 / 7 / 7 / 21 / 45 days respectively, each with a rungReason naming its state"
    - step: 2
      action: "Compare intervals across increasing strength"
      expected: "Strictly increasing — rung 1 < 2 < 3 < 4"
  expected_result: "The ladder is complete and ordered. (REQ-REVISION-003 acceptance_criteria)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: >
    Asserts the ladder behaves as DECIDED, not that 3/7/21/45 are correct for this product — those
    intervals are borrowed from published research and are not measured here.
  automation_status: Automated
  automation_reference: "RevisionLadderTest.aShakyTopicComesBackInThreeDays, .aTopicThatIsMovingButNotSettledComesBackInAWeek, .strongClimbsHigherOnceTheCurriculumAgreesItIsMastered, .theLadderIsMonotonic"

- id: TC-REVISION-007
  requirement_ids: [REQ-REVISION-004]
  scenario_id: SCN-REVISION-007
  system: Backend
  module: REVISION
  feature: A topic with nothing to revise is said to be unscheduled, not given a due date
  title: An untouched topic is unscheduled, with the reason stated and no re-test
