      expected: "All null — there is nothing to schedule and nothing to re-test"
  expected_result: "Unscheduled is an answer, not a gap. (REQ-REVISION-004 acceptance_criteria)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
