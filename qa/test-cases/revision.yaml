# REVISION module — manual test cases
#
# Every case below has a real test method behind it (RevisionPlanTest for the round trip,
# RevisionLadderTest for the decision table). They are recorded here as UNEXECUTED manual cases in
# the register's own convention; the automated runs that actually happened are in qa/execution/.

- id: TC-REVISION-001
  requirement_ids: [REQ-REVISION-001]
  scenario_id: SCN-REVISION-001
  system: Backend
  module: REVISION
  feature: A student's revision schedule is readable, scoped to them, and only covers testable topics
  title: The revision-plan endpoint rejects an unauthenticated caller
  objective: "Confirm the endpoint is token-gated, like the two personalization endpoints before it."
  preconditions:
    - "A running backend"
    - "An exam with at least one mapped topic"
  test_data: "One disposable exam"
  test_environment: "Backend against the real dev database"
  priority: High
  severity: Critical
  test_type: Security
  steps:
    - step: 1
      action: "GET /api/me/revision-plan?examCode={code} with no Authorization header"
      expected: "401"
    - step: 2
      action: "Inspect the controller's route definition"
      expected: "examCode is the only parameter — nothing names a user"
  expected_result: "Unreachable unauthenticated, and cannot be pointed at another account. (REQ-REVISION-001 acceptance_criteria)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
  automation_status: Automated
  automation_reference: "RevisionPlanTest.requiresASignedInUser"

