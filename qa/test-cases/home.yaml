- id: TC-HOME-005
  requirement_ids: [REQ-HOME-003]
  scenario_id: SCN-HOME-003
  system: Mobile
  module: HOME
  feature: Today's Plan starts preparing before the student asks for it
  title: Today's Plan opens instantly on a normal, warm app session
  objective: "Confirm the background prefetch results in a fast-feeling open, not a visible generation wait."
  preconditions:
    - "Signed in, with an active exam, app freshly launched"
  test_data: "None"
  test_environment: "Android emulator against a real backend"
  priority: High
  severity: Major
  test_type: Functional
  steps:
    - step: 1
      action: "Launch the app fresh and wait a few seconds on Home before tapping anything"
      expected: "No visible loading indicator for the plan yet - this is background work"
    - step: 2
      action: "Tap Today's Plan"
      expected: "The plan renders with no multi-second generation wait, in the common case where a snapshot already existed or the background prefetch had time to complete"
  expected_result: "Opening Today's Plan feels instant on a normal session. (REQ-HOME-003)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: >
    Genuinely first-ever open for a brand-new account/exam pair (no snapshot exists anywhere
    yet) is excluded - that case still waits on real server generation, as documented, and is
    not what this case is testing.
  automation_status: ManualOnly
  automation_reference: ""

