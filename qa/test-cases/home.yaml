# HOME module — manual test cases
#
# Every case here is ManualOnly and Not Executed — mobile has no automated runner, and this is
# newly built, unseen-on-a-device work. Writing the case is the deliverable; running it is next.

- id: TC-HOME-001
  requirement_ids: [REQ-HOME-001]
  scenario_id: SCN-HOME-001
  system: Mobile
  module: HOME
  feature: Practice and Mock Tests are one tap away, for the currently selected exam
  title: The two quick-action cards open the active exam's Practice/Mock Test screens
  objective: "Confirm both cards route correctly and show the real active exam name, never a hardcoded one."
  preconditions:
    - "Signed in, with an exam followed and active"
  test_data: "Any followed exam"
  test_environment: "Android emulator against a real backend"
  priority: Critical
  severity: Critical
  test_type: Functional
  steps:
    - step: 1
      action: "Note the active exam shown in the Preparing For card"
      expected: "Recorded for comparison"
    - step: 2
      action: "Tap the Practice card"
      expected: "Opens the subject/topic browse screen for that same exam, with no exam-list step"
    - step: 3
      action: "Go back, then tap the Mock Tests card"
      expected: "Opens the mock paper list for that same exam, with no exam-list step"
    - step: 4
      action: "Switch the active exam (via Change Exam), return Home, repeat steps 2-3"
      expected: "Both cards now open the newly active exam instead"
  expected_result: "Both cards are always scoped to whichever exam is currently active. (REQ-HOME-001)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
  automation_status: ManualOnly
  automation_reference: ""

