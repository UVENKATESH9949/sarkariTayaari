- id: TC-HOME-003
  requirement_ids: [REQ-HOME-002]
  scenario_id: SCN-HOME-002
  system: Mobile
  module: HOME
  feature: Readiness Score is real, not a fixed 62%
  title: Readiness matches a manual calculation from real session history
  objective: "Confirm the shown percentage is genuinely computed, not the old fixed 62%."
  preconditions:
    - "An account with at least one completed practice session for the active exam"
  test_data: "A completed session with a known correct/total split"
  test_environment: "Android emulator"
  priority: Critical
  severity: Critical
  test_type: Functional
  steps:
    - step: 1
      action: "Note the correct/total counts from a just-completed session's summary"
      expected: "Recorded for comparison"
    - step: 2
      action: "Open Home and read the Readiness card's percentage"
      expected: "Matches round(totalCorrect/totalQuestions*100) across all of this exam's sessions - never a fixed 62%"
    - step: 3
      action: "Open Progress and compare its own readiness figure"
      expected: "Progress's app-wide figure and Home's exam-scoped figure both come from the same formula and agree when only one exam has history"
  expected_result: "Readiness is real and consistent with Progress. (REQ-HOME-002)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
  automation_status: ManualOnly
  automation_reference: ""

