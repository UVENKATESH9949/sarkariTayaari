- id: TC-PRACTICE-009
  requirement_ids: [REQ-PRACTICE-005]
  scenario_id: SCN-PRACTICE-009
  system: Mobile
  module: PRACTICE
  feature: The screen renders in Inter and follows the theme in both modes
  title: Inter loads, and both themes stay legible
  objective: "Confirm the typeface is really applied on a device and dark mode was not broken."
  preconditions:
    - "A dev or release build containing the bundled Inter faces"
  test_data: "None"
  test_environment: "Android emulator, both theme modes"
  priority: Medium
  severity: Major
  test_type: Compatibility
  steps:
    - step: 1
      action: "Open the Practice screen in light mode and compare its headings with a screen that has not been converted, e.g. Progress"
      expected: "The letterforms visibly differ — Inter is rendering, not the platform default"
    - step: 2
      action: "Toggle dark mode from the header"
      expected: "Page, cards, borders, dropdown and topic rows all repaint; every label stays readable and the hierarchy is unchanged"
    - step: 3
      action: "Open the difficulty dialog in dark mode"
      expected: "The card separates clearly from the dimmed page behind it, and the level rows and pastel icon circles are all legible"
