- id: TC-PRACTICE-006
  requirement_ids: [REQ-PRACTICE-003]
  scenario_id: SCN-PRACTICE-006
  system: Mobile
  module: PRACTICE
  feature: Difficulty options are synced data, and an empty one cannot be started
  title: A second topic's dialog never shows the first topic's counts
  objective: "Confirm the counts are keyed to the topic, so a stale number cannot appear under a new name."
  preconditions:
    - "Two topics in the same subject with clearly different question counts"
  test_data: "e.g. one topic with ~400 questions and one with ~40"
  test_environment: "Android emulator"
  priority: High
  severity: Major
  test_type: StateTransition
  steps:
    - step: 1
      action: "Open the dialog for the large topic, note the counts, and close it"
      expected: "Counts matching the large topic"
    - step: 2
      action: "Immediately open the dialog for the small topic"
      expected: "A loading skeleton first — the large topic's counts are never visible under the small topic's name"
    - step: 3
      action: "Wait for it to settle"
      expected: "Counts matching the small topic"
  expected_result: "Availability figures always belong to the topic named above them. (REQ-PRACTICE-003 acceptance_criteria)"
  actual_result: ""
  status: Pass
  defect_id: ""
  remarks: "Regression guard for the keyed-loaded-state rule in DifficultyPickerDialog. Remove the key comparison and this case fails silently."
  automation_status: ManualOnly
  automation_reference: ""

