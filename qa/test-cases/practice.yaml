# PRACTICE module — manual test cases
#
# All ManualOnly: this project has no automated test runner for mobile (confirmed, per
# qa/README.md's standing rule).
#
# A real device pass was run on 2026-09-22 against emulator-5554 — see
# qa/execution/2026-09-22-practice-navigation.yaml for what actually happened, including the
# two defects it found. The statuses below reflect that run and nothing else: TC-003, TC-008
# and TC-010 are still Not Executed because they genuinely were not run, and TC-004 and
# TC-007 are Blocked rather than Pass because each had steps this account's data could not
# reach. Nothing here was marked Pass on the strength of a nearby step passing.

- id: TC-PRACTICE-001
  requirement_ids: [REQ-PRACTICE-001, REQ-PRACTICE-002]
  scenario_id: SCN-PRACTICE-001
  system: Mobile
  module: PRACTICE
  feature: Subject, topic and difficulty are chosen without leaving one screen
  title: A student reaches a running quiz in three taps from the Practice screen
  objective: "Confirm the redesigned flow works end to end and pushes only the quiz."
  preconditions:
    - "The app is installed on emulator-5554 and has synced"
    - "An exam with at least one subject carrying questions is available"
  test_data: "Any synced exam, e.g. SSC CGL"
  test_environment: "Android emulator (AVD Pixel_7), dev build against a local backend"
  priority: Critical
  severity: Critical
  test_type: Functional
  steps:
    - step: 1
      action: "Open the Practice tab and tap an exam"
      expected: "A screen titled with the exam name, showing a search field, a Practice heading, a subject dropdown already carrying a subject, and that subject's topics below"
    - step: 2
      action: "Tap the subject dropdown"
      expected: "The subject list expands in place, directly under the trigger; the current subject is highlighted and carries a checkmark"
    - step: 3
      action: "Tap a different subject"
      expected: "The list collapses and the topics below become that subject's, with no screen transition and no back button appearing"
    - step: 4
      action: "Tap a topic that has questions"
      expected: "A centred dialog fades in naming that topic, with a Choose difficulty prompt, over a still-visible topic list. It does not slide, and there is no drag handle"
    - step: 5
      action: "Tap a difficulty"
      expected: "The dialog closes and the existing practice quiz opens for that topic and difficulty"
    - step: 6
      action: "Press back from the quiz"
      expected: "The student returns to the Practice screen — one back press, not three"
  expected_result: "Subject, topic and difficulty are all chosen on one screen, and the quiz is the only route pushed. (REQ-PRACTICE-001 acceptance_criteria)"
  actual_result: ""
  status: Pass
  defect_id: ""
  remarks: "Step 6 is the measure of the whole change: the old flow needed three back presses to get here."
  automation_status: ManualOnly
  automation_reference: ""

- id: TC-PRACTICE-002
  requirement_ids: [REQ-PRACTICE-001]
  scenario_id: SCN-PRACTICE-002
  system: Mobile
  module: PRACTICE
  feature: Subject, topic and difficulty are chosen without leaving one screen
  title: The subject heading and the topic list can never disagree
  objective: >
    Confirm the keyed-loaded-state guard is real — switching subject must show a loading
    skeleton, never the previous subject's topics under the new subject's name.
  preconditions:
    - "The Practice screen is open for an exam with at least two subjects"
  test_data: "An exam whose subjects have visibly different topic names"
  test_environment: "Android emulator, ideally in live mode (before first sync) where the read is slow enough to watch"
  priority: High
  severity: Major
  test_type: StateTransition
  steps:
    - step: 1
      action: "Note the topic names under subject A"
      expected: "Topics clearly belonging to subject A"
    - step: 2
      action: "Switch to subject B and watch the moment of the switch"
      expected: "A skeleton appears while B's topics load — at no point are A's topics visible under B's name"
    - step: 3
      action: "Switch back and forth quickly several times"
      expected: "The list always settles on the subject named in the dropdown; no interleaving or flicker of the wrong list"
  expected_result: "The topic list is only ever rendered for the subject currently named. (REQ-PRACTICE-001 edge_conditions)"
  actual_result: ""
  status: Pass
  defect_id: ""
  remarks: >
    Regression guard for the pattern this codebase has hit before (see PreparationPlanCard).
    Live mode makes the window wide enough to observe; on a synced device the read may be too
    fast to see, which is a weaker but still valid pass.
  automation_status: ManualOnly
  automation_reference: ""

