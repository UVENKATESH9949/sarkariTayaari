- id: TC-PRACTICE-010
  requirement_ids: [REQ-PRACTICE-001]
  scenario_id: SCN-PRACTICE-010
  system: Mobile
  module: PRACTICE
  feature: Subject, topic and difficulty are chosen without leaving one screen
  title: Search filters topics and subjects, and says so when it finds nothing
  objective: "Confirm the search box genuinely filters both lists and fails legibly."
  preconditions:
    - "The Practice screen is open for an exam with several subjects"
  test_data: "A topic name known to exist in the selected subject"
  test_environment: "Android emulator"
  priority: Medium
  severity: Minor
  test_type: Functional
  steps:
    - step: 1
      action: "Type part of a topic name that exists in the selected subject"
      expected: "The topic list narrows; the section count updates to the number shown"
    - step: 2
      action: "Open the subject dropdown with that query still typed"
      expected: "The subject options are filtered by the same query"
    - step: 3
      action: "Type a topic name that belongs to a different subject"
      expected: "A clear no-match message naming the query — not a blank list"
    - step: 4
      action: "Tap the clear button"
      expected: "The full topic list returns"
  expected_result: "Search filters both lists and degrades legibly. (REQ-PRACTICE-001 acceptance_criteria)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: >
    Step 3 documents a deliberate limitation rather than a defect: search is scoped to the
    selected subject's topics, because searching every subject would cost one read per
    subject — a round trip each in live mode.
  automation_status: ManualOnly
  automation_reference: ""

- id: TC-PRACTICE-011
  requirement_ids: [REQ-PRACTICE-006]
  scenario_id: SCN-PRACTICE-011
  system: Mobile
  module: PRACTICE
  feature: A topic card carries what it is worth practising, not just what it is called
  title: Topic cards show their insight chips, and the sort toggle changes both order and hierarchy
  objective: "Confirm Epic L's per-topic surface is on the Practice screen and the toggle works."
  preconditions:
    - "An exam with a curated topic map synced locally, e.g. SSC CGL"
  test_data: "SSC CGL, Quantitative Aptitude"
  test_environment: "Android emulator (AVD Pixel_7)"
  priority: High
  severity: Major
  test_type: Functional
  steps:
    - step: 1
      action: "Open Practice for the exam and look at the topic list"
      expected: "Each topic is its own card: icon, name, question count, and a wrapped row of chips — priority, mastery, trend, weightage — with a Best after line where prerequisites are unmet"
    - step: 2
      action: "Confirm By priority is selected and read the first two cards"
      expected: "Ranked highest-priority first, each showing its parent topic inline above the name"
    - step: 3
      action: "Tap Syllabus order"
      expected: "The list regroups under folder headings with children indented, and the inline parent disappears — the heading now carries the hierarchy"
    - step: 4
      action: "Tap a topic card"
      expected: "The difficulty dialog opens for that topic, exactly as from a plain row"
    - step: 5
      action: "Open an exam with no curated topic map, if one is available"
      expected: "Topics still list, with no chips and no sort toggle — never empty chips or a toggle that reorders nothing"
  expected_result: "The topic card carries Epic L's signal, and both orderings work. (REQ-PRACTICE-006 acceptance_criteria)"
  actual_result: ""
  status: Pass
  defect_id: ""
  remarks: >
    Step 5 is the honest gap: every exam on the test device has a curated map, so the
    no-intelligence fallback is verified by reading the render guards rather than by seeing it.
  automation_status: ManualOnly
  automation_reference: ""

- id: TC-PRACTICE-012
  requirement_ids: [REQ-PRACTICE-007]
  scenario_id: SCN-PRACTICE-012
  system: Mobile
  module: PRACTICE
  feature: A practice session is a fixed twenty questions, drawn fresh each time
  title: A session is twenty questions, and the next one starts differently
  objective: "Confirm the banner's promise matches what the engine actually delivers."
  preconditions:
    - "A synced device, and a topic holding well over twenty questions"
  test_data: "SSC CGL > Quantitative Aptitude > Pipes & Cisterns (117 questions)"
  test_environment: "Android emulator (AVD Pixel_7), local SQLite"
  priority: High
  severity: Major
  test_type: Functional
  steps:
    - step: 1
      action: "Open the difficulty dialog for that topic"
      expected: "A banner reading '20 questions each session · new questions every time', and no per-level question counts under Easy/Medium/Hard"
    - step: 2
      action: "Choose a difficulty and read the quiz header"
      expected: "'Question 1 of 20', regardless of how many questions the topic holds"
    - step: 3
      action: "Note the first question, go back, and start the same topic and difficulty again"
      expected: "A different first question — the set is redrawn, not re-shuffled"
    - step: 4
      action: "Open a topic with fewer than twenty questions at some level, if one exists"
      expected: "A shorter session, not an error"
  expected_result: "Sessions are twenty questions and freshly drawn. (REQ-PRACTICE-007 acceptance_criteria)"
  actual_result: ""
  status: Pass
  defect_id: ""
  remarks: >
    Step 3 checks a claim printed on screen. Worth re-running on the LIVE path too (before a first
    sync), where the app deliberately drops the fresh-set half of the banner because it cannot
    keep that promise.
  automation_status: ManualOnly
  automation_reference: ""

- id: TC-PRACTICE-013
  requirement_ids: [REQ-PRACTICE-008]
  scenario_id: SCN-PRACTICE-013
  system: Mobile
  module: PRACTICE
  feature: A topic card shows how much of that topic has been practised
  title: The coverage bar counts distinct questions and never exceeds full
  objective: "Confirm the bar measures coverage rather than volume of practice."
  preconditions:
    - "A device with real practice history"
  test_data: "A topic already partly practised"
  test_environment: "Android emulator, local SQLite"
  priority: Medium
  severity: Major
  test_type: DataIntegrity
  steps:
    - step: 1
      action: "Read the bar on a partly-practised topic card"
      expected: "A filled bar and a 'practised/total · percent' label, with practised < total"
    - step: 2
      action: "Finish a session on that topic, return, and read the bar again"
      expected: "The numerator has risen by the number of questions in that session that were NEW to the student — not necessarily by the full session length"
    - step: 3
      action: "Keep practising the same topic well past its question count"
      expected: "The bar approaches but never passes 100%, and the numerator never exceeds the denominator"
    - step: 4
      action: "Find a topic with zero questions for this exam"
      expected: "No bar at all — not a 0% bar, which would be a statement about the student rather than the content"
  expected_result: "The bar is honest coverage, bounded at full. (REQ-PRACTICE-008 acceptance_criteria)"
  actual_result: ""
  status: Blocked
  defect_id: ""
  remarks: >
    Step 3 is the regression guard: swap the numerator for `user_topic_progress.attemptedCount`
    and it fails, because that figure is cumulative. Step 2's wording is deliberate — a session
    that re-serves already-seen questions correctly moves the bar less than twenty.
  automation_status: ManualOnly
  automation_reference: ""

