- id: TC-DAILYPLAN-003
  requirement_ids: [REQ-DAILYPLAN-002]
  scenario_id: SCN-DAILYPLAN-003
  system: Backend
  module: DAILYPLAN
  feature: Two devices disagreeing resolve on when the edit happened, not on who synced last
  title: An older edit loses, and the loser is told what won
  objective: >
    Confirm last-write-wins uses the device's own timestamp, so an edit made offline and uploaded
    later cannot overwrite a newer one simply by arriving second.
  preconditions:
    - "A profile stored with an updatedAt of one minute ago"
  test_data: "A second upload dated three days ago"
  test_environment: "Backend against the real dev database"
  priority: High
  severity: Critical
  test_type: Functional
  steps:
    - step: 1
      action: "POST the older profile"
      expected: "200 with stored false"
    - step: 2
      action: "Read the profile returned in that same response"
      expected: "The winning values, so the losing device can correct itself without another round trip"
    - step: 3
      action: "GET the profile afterwards"
      expected: "Still the newer values — the stale edit changed nothing"
  expected_result: "Arrival order never decides the winner. (REQ-DAILYPLAN-002 acceptance_criteria)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
  automation_status: Automated
  automation_reference: "DailyPlanTest.anOlderEditDoesNotOverwriteANewerOneAndTheLoserIsToldWhatWon"

