# DAILYPLAN module — manual test cases
#
# Every case has a real test method behind it (DailyPlanTest, 9/9 green on 2026-09-19 against the
# real Neon dev database). Recorded here as UNEXECUTED manual cases in the register's own
# convention; the runs that actually happened are in qa/execution/.

- id: TC-DAILYPLAN-001
  requirement_ids: [REQ-DAILYPLAN-001]
  scenario_id: SCN-DAILYPLAN-001
  system: Backend
  module: DAILYPLAN
  feature: The preparation profile reaches the server and stays scoped to its owner
  title: A profile round-trips, and another account sees only its own
  objective: "Confirm the profile now reaches the server at all, and cannot leak between accounts."
  preconditions:
    - "Two registered students"
  test_data: "A profile stating ONE_TO_TWO and PRACTICING"
  test_environment: "Backend against the real dev database"
  priority: High
  severity: Critical
  test_type: Functional
  steps:
    - step: 1
      action: "POST the profile, then GET it back as the same student"
      expected: "stored true; dailyStudyTime ONE_TO_TWO and preparationLevel PRACTICING returned"
    - step: 2
      action: "GET the profile as a second student"
      expected: "profile is null — their own empty profile, never the first student's"
  expected_result: "The profile is stored per account and readable only by its owner. (REQ-DAILYPLAN-001 acceptance_criteria)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
  automation_status: Automated
  automation_reference: "DailyPlanTest.theProfileRoundTripsAndIsScopedToItsOwner"

