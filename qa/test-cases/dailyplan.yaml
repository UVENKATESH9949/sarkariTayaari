  feature: A student can change the study time the planner budgets from
  title: Changing the study time reaches the server and the next plan
  objective: >
    Confirm a student shown an assumed budget can correct it, and that the correction travels all
    the way to the planner.
  preconditions:
    - "Signed in, an active exam, and a profile whose dailyStudyTime is null"
  test_data: "A change from no answer to 2-4 hours"
  test_environment: "emulator-5554 against a real dev backend"
  priority: High
  severity: Critical
  test_type: Functional
  steps:
    - step: 1
      action: "Open More > Study preferences"
      expected: "The screen shows the student's current answers - no band selected, their real level selected"
    - step: 2
      action: "Tap 2-4 hours, then read the profile from the server"
      expected: "dailyStudyTime TWO_TO_FOUR, with updatedAt at the moment of the edit"
    - step: 3
      action: "Reopen Today's Plan"
      expected: "The budget reads 180m and names the 2-4 hours the student gave; today's tasks are unchanged"
  expected_result: "The assumption the app named is now correctable. (REQ-DAILYPLAN-009 acceptance_criteria)"
  actual_result: >
    Executed 2026-09-21 on emulator-5554. Step 1: no band selected (the account's band was null)
    and "Practising questions" selected, matching the synced profile. Step 2: the server showed
    TWO_TO_FOUR with updatedAt bumped to the edit moment, within seconds and with no Save button.
    Step 3: the plan read 180m / 58m / 22 tasks with "Based on the 2-4 hours a day you told us you
    study", and the 22 tasks were unchanged.
