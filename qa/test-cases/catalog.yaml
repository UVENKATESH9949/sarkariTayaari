# CATALOG module — manual test cases (Phase 3)
#
# Every test case links to one scenario id and one or more requirement ids. A test case is a
# reusable DEFINITION — never overwritten by an execution (qa/execution/*.yaml, not yet
# created). Expected results are derived strictly from the linked requirement's
# acceptance_criteria/error_conditions/edge_conditions — never from current controller/
# admin-UI/database implementation. Every case below is freshly generated and UNEXECUTED:
# actual_result is empty, status is Not Executed, defect_id is empty. No tester name, date,
# build, credential, or result has been invented.
#
# Ambiguous-status test cases (deleting an exam with structure; badge/difficulty fallback)
# deliberately do NOT pre-assert a specific expected status/behavior — they exist to
# establish what actually happens, per qa/requirements/_conflicts.md and the approved Phase 2
# scenarios. Documented-deviation cases (category free-text, sectional-timer display) DO
# assert a concrete expected result, since the intended behavior there is known, not
# undetermined — see the Phase 2/3 report's classification discussion.

- id: TC-CATALOG-001
  requirement_ids: [REQ-CATALOG-001]
  scenario_id: SCN-CATALOG-001
  system: Backend
  module: CATALOG
  feature: Exam CRUD
  title: Full create-read-update-delete lifecycle for an exam with a unique code
  objective: >
    Confirm an exam can be created, retrieved, updated, and deleted in sequence, with `code`
    acting as the stable identity throughout.
  preconditions:
    - "TESTDATA-CATALOG-NEW-EXAM-CODE-01 is not currently in use"
  test_data: "TESTDATA-CATALOG-NEW-EXAM-CODE-01, a unique display name"
  test_environment: "Backend (dev), admin token"
  priority: Critical
  severity: Critical
  test_type: Functional
  steps:
    - step: 1
      action: "POST /api/exams with code=TESTDATA-CATALOG-NEW-EXAM-CODE-01 and a valid name/displayOrder"
      expected: "201 Created; response echoes the submitted code"
    - step: 2
      action: "GET /api/exams/{code} for that code (admin token)"
      expected: "200 OK; fields match what was created"
    - step: 3
      action: "PUT /api/exams/{code} changing the name"
      expected: "200 OK; response reflects the new name, code unchanged"
    - step: 4
      action: "DELETE /api/exams/{code}"
      expected: "204 No Content; a subsequent GET for that code returns 404"
  expected_result: >
    Create/read/update/delete all succeed, and the exam's code remains its stable identity
    throughout. (REQ-CATALOG-001 acceptance_criteria)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
  automation_status: Automated
  automation_reference: >
    ExamCrudTest.createThenGet_returnsSameData, update_changesFields, delete_removesExam

