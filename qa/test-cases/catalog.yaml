- id: TC-CATALOG-004
  requirement_ids: [REQ-CATALOG-001]
  scenario_id: SCN-CATALOG-003
  system: Backend
  module: CATALOG
  feature: Exam CRUD
  title: "Single-get, all-list, and writes are admin-gated (anonymous/student/admin matrix)"
  objective: >
    Confirm GET /api/exams/{code} (single), GET /api/exams/all, and every write reject
    anonymous (401) and student (403) callers, and succeed for an admin — split from
    TC-CATALOG-003's public-read check since these are gated endpoints with a materially
    different (three-state) authorization outcome.
  preconditions:
    - "A STUDENT token and an ADMIN token are both available"
    - "TESTDATA-CATALOG-EXISTING-EXAM-CODE-01 exists"
  test_data: "TESTDATA-CATALOG-EXISTING-EXAM-CODE-01"
  test_environment: "Backend (dev)"
  priority: Critical
  severity: Critical
  test_type: Authorization
  steps:
    - step: 1
      action: "GET /api/exams/{code} with no Authorization header"
      expected: "401"
    - step: 2
      action: "GET /api/exams/{code} with a valid STUDENT token"
      expected: "403"
    - step: 3
      action: "GET /api/exams/{code} with a valid ADMIN token"
      expected: "200 OK"
    - step: 4
      action: "GET /api/exams/all with no Authorization header, then with a STUDENT token"
      expected: "401, then 403 respectively"
    - step: 5
      action: "POST /api/exams with a STUDENT token"
      expected: "403; no exam created"
  expected_result: >
    requireAdmin on create/update/delete/get-single/get-all; no auth on active list.
    (REQ-CATALOG-001 permissions, acceptance_criteria)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
  automation_status: PartiallyAutomated
  automation_reference: >
    ExamCrudTest fixtures exercise admin-token writes; explicit 401/403-on-anonymous/student
    for get-single and all-list not independently confirmed by a cited method name.

