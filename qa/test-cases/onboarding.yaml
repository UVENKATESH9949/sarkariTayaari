- id: TC-ONBOARDING-015
  requirement_ids: [REQ-ONBOARDING-009]
  scenario_id: SCN-ONBOARDING-015
  system: Mobile
  module: ONBOARDING
  feature: Personalised preparation and welcome
  title: The preparation checklist reflects real work and the welcome uses the entered name
  objective: >
    Confirm each line ticks as its step genuinely completes, that a step which cannot run is
    omitted rather than ticked, and that the welcome greets the student by the name they typed.
  preconditions:
