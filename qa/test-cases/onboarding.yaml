- id: TC-ONBOARDING-004
  requirement_ids: [REQ-ONBOARDING-002]
  scenario_id: SCN-ONBOARDING-004
  system: Mobile
  module: ONBOARDING
  feature: Existing-install adoption
  title: An existing student upgrading to this build is never shown onboarding and loses nothing
  objective: >
    Confirm a device with real practice history, bookmarks, a followed exam and non-default
    settings opens straight to the app, and that every one of those is unchanged afterwards.
  preconditions:
    - A device already carrying practice sessions, mock attempts, bookmarks, a followed exam and a changed theme/zoom/language
    - That device upgraded to a build containing migration 0027
  test_data: "The device's own existing data — never a fresh fixture"
  test_environment: "Android emulator-5554 with a populated pre-0027 database"
  priority: Critical
  severity: Critical
  test_type: Regression
  steps:
    - step: 1
      action: "Note the existing state before upgrading: session count, bookmark count, followed exam(s), active exam, theme, zoom, language"
      expected: "Values recorded"
    - step: 2
      action: "Install the new build over it and launch"
      expected: "Migration 0027 applies; the app opens on the normal startup path with NO onboarding question"
    - step: 3
      action: "Re-check every value noted in step 1"
      expected: "All identical — history, bookmarks, followed exams, active exam, theme, zoom and language unchanged"
    - step: 4
      action: "Open Home"
      expected: "The greeting is the app's existing generic one, since no onboarding name exists"
  expected_result: >
    An install predating onboarding is adopted silently with zero data change.
    (REQ-ONBOARDING-002 acceptance_criteria)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: >
    The single most important case in this module: its failure mode is indistinguishable, to a
    real user, from the app having lost their data.
  automation_status: PartiallyAutomated
  automation_reference: >
    packages/core src/onboarding/status.test.ts, the "an install that predates onboarding"
    block. The data-preservation half needs a real populated device.

- id: TC-ONBOARDING-005
