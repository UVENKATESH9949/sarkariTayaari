# ONBOARDING module — manual test cases
#
# Every case links to one scenario and one or more requirements. A test case is a reusable
# DEFINITION and is never edited by an execution. Every case below is freshly written:
# actual_result empty, status Not Executed, defect_id empty — except where a real execution has
# since been recorded in qa/execution/, which lives in that file and not here.
#
# `automation_status: Automated` appears only where a named test in
# packages/core/src/onboarding/*.test.ts genuinely covers the assertion. Those tests were
# written and run as part of this change (278 passing in packages/core). Everything that needs
# a screen, a real database migration or an app kill is ManualOnly: this project has no
# automated runner for mobile, which is a confirmed absence rather than an unused capability.

- id: TC-ONBOARDING-001
  requirement_ids: [REQ-ONBOARDING-001]
  scenario_id: SCN-ONBOARDING-001
  system: Mobile
  module: ONBOARDING
  feature: First-launch detection
  title: A fresh install opens onboarding, and the app is unreachable behind it
  objective: >
    Confirm a device with no prior local data shows step 1 of the onboarding flow instead of the
    app, and that neither Home nor the tab bar can be reached until the flow is finished.
  preconditions:
    - App uninstalled and reinstalled, or its data cleared, so no local SQLite exists
  test_data: "None"
  test_environment: "Android emulator-5554 (Pixel_7), dev client, real dev backend"
  priority: Critical
  severity: Critical
  test_type: Functional
  steps:
    - step: 1
      action: "Install and launch the app on a device with no existing app data"
      expected: "After the brief database-setup frame, step 1 of onboarding is shown: \"What should we call you?\" with a name field and Continue"
    - step: 2
      action: "Observe the screen for any tab bar or Home content"
      expected: "No tab bar, no Home, no navigator chrome — only the flow's own header, body and footer"
    - step: 3
      action: "Press the Android Back button"
      expected: "A \"Leave setup?\" confirmation appears; the app does not navigate into Home"
  expected_result: >
    Onboarding is shown before the navigator mounts on a genuinely first launch, and the app
    proper cannot be reached while it is incomplete. (REQ-ONBOARDING-001 acceptance_criteria)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
  automation_status: ManualOnly
  automation_reference: ""

- id: TC-ONBOARDING-002
  requirement_ids: [REQ-ONBOARDING-001, REQ-ONBOARDING-008]
  scenario_id: SCN-ONBOARDING-002
  system: Mobile
  module: ONBOARDING
  feature: Interrupted onboarding
  title: Killing the app mid-flow, after the first sync has landed, resumes the flow with answers intact
  objective: >
    Confirm the started stamp survives a kill and that the usage signals — all of which turn
    true while the flow is on screen — do not cause the student to be adopted as an existing
    install and skipped past onboarding.
  preconditions:
    - A genuinely fresh install
    - Network available, so the first reference sync completes while the flow is open
  test_data: "A name, a language, and an exam"
  test_environment: "Android emulator-5554, dev client, real dev backend"
  priority: Critical
  severity: Critical
  test_type: Functional
  steps:
    - step: 1
      action: "Start onboarding, enter a name, choose a language, and reach the exam step"
      expected: "The exam list renders from the catalogue that has synced behind the flow"
    - step: 2
      action: "Select an exam, then force-stop the app (adb shell am force-stop <pkg>)"
      expected: "App closes"
    - step: 3
      action: "Relaunch the app"
      expected: "Onboarding is shown again — NOT Home"
    - step: 4
      action: "Navigate to step 1 (or observe the resumed step) and inspect the name field"
      expected: "The name entered in step 1 is still there, as is the chosen language and exam"
  expected_result: >
    An interrupted flow resumes rather than being skipped or restarted; the completed first sync
    does not make the install look pre-existing. (REQ-ONBOARDING-001, REQ-ONBOARDING-008)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: >
    The timing in step 2 is the point of the case — killing the app before the sync finishes
    would not exercise the signal race this guards.
  automation_status: PartiallyAutomated
  automation_reference: >
    packages/core src/onboarding/status.test.ts, "onboarding interrupted halfway > is still
    required after a restart, even though the first sync has since completed" covers the
    decision; the resume-with-answers half is manual.

