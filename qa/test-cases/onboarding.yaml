- id: TC-ONBOARDING-010
  requirement_ids: [REQ-ONBOARDING-005, REQ-ONBOARDING-009]
  scenario_id: SCN-ONBOARDING-010
  system: Mobile
  module: ONBOARDING
  feature: Offline onboarding
  title: A first launch with no network completes onboarding without a dead end
  objective: >
    Confirm every step can be answered offline, the exam step explains itself rather than
    hanging or blocking, and the profile is saved and reaches Home.
  preconditions:
    - A genuinely fresh install
    - Airplane mode enabled before first launch
  test_data: "A name; the default language"
  test_environment: "Android emulator-5554 in airplane mode, dev client"
  priority: Critical
  severity: High
  test_type: Offline
  steps:
    - step: 1
      action: "Launch the app with no network"
      expected: "Onboarding step 1 appears — it is not blocked behind a sync"
    - step: 2
      action: "Enter a name, choose a language, reach the exam step"
      expected: "\"We couldn't load the exam list\" with an explanation that the exam can be chosen from the Exams tab once connected; Continue is available"
