- id: TC-ONBOARDING-006
  requirement_ids: [REQ-ONBOARDING-003]
  scenario_id: SCN-ONBOARDING-006
  system: Mobile
  module: ONBOARDING
  feature: Name validation
  title: An empty name blocks Continue and shows a reason
  objective: >
    Confirm the student cannot advance past step 1 without a name, is told why, and that the
    message clears as soon as they start correcting it.
