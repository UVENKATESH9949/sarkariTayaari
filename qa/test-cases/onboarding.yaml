- id: TC-ONBOARDING-007
  requirement_ids: [REQ-ONBOARDING-003]
  scenario_id: SCN-ONBOARDING-007
  system: Mobile
  module: ONBOARDING
  feature: Name normalisation
  title: Names are normalised and bounded correctly, including invisible characters
  objective: >
    Confirm whitespace is trimmed and collapsed, invisible characters are stripped, the 40
    code-point limit is enforced on the normalised value, and astral characters count as one.
  preconditions:
    - None (logic-level)
  test_data: "\"  Priya  \"; \"Rahul    Kumar\"; a zero-width space alone; a non-breaking space between two words; 40 and 41 character names; an emoji name"
  test_environment: "packages/core vitest"
  priority: High
  severity: Medium
  test_type: Boundary
  steps:
    - step: 1
      action: "Validate \"  Priya  \""
      expected: "Accepted, stored as \"Priya\""
    - step: 2
      action: "Validate \"Rahul    Kumar\""
      expected: "Accepted, stored as \"Rahul Kumar\""
    - step: 3
      action: "Validate a value consisting only of a zero-width space, a BOM, an LRM, a non-breaking space or an ideographic space"
      expected: "Rejected as EMPTY in every case"
    - step: 4
      action: "Validate a 40-code-point name, then a 41-code-point name"
      expected: "Accepted, then rejected as TOO_LONG"
    - step: 5
      action: "Validate a 40-emoji name, and a 40-character name padded with leading/trailing spaces"
      expected: "Both accepted — counted in code points, measured after normalisation"
  expected_result: >
    Normalisation happens before measurement and invisible characters cannot produce a blank
    stored name. (REQ-ONBOARDING-003 validations/edge_conditions)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
  automation_status: Automated
  automation_reference: >
    packages/core src/onboarding/validation.test.ts — the whole "display name" describe block
    (16 cases), including "rejects a name made only of %s" across six whitespace/invisible
    classes, "counts an astral character as one", and "measures after normalising, not before".

