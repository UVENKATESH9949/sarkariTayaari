- id: TC-LESSONVIDEO-021
  requirement_ids: [REQ-LESSONVIDEO-010]
  scenario_id: SCN-LESSONVIDEO-018
  system: Backend
  module: LESSONVIDEO
  feature: Accepting a video is what uploads it to the object store
  title: An attached video is staged with no storage key, and publishing stores it
  objective: "Confirm the object store is untouched until a human accepts the video."
  preconditions:
    - "An admin token and a topic to attach to"
  test_data: "A minimal valid MP4 (ftyp marker at offset 4)"
  test_environment: "Backend integration suite against the real dev database"
  priority: Critical
  severity: Critical
  test_type: Functional
  steps:
    - step: 1
      action: "POST the MP4 to /api/admin/lesson-videos with a topicId"
      expected: "200, status PENDING_UPLOAD, contentStatus DRAFT, hasStagedFile true, uploadAttempts 0"
    - step: 2
      action: "Read the lesson_videos row directly"
      expected: "storageKey is null - nothing reached the object store"
    - step: 3
      action: "Read the student-facing topic availability"
      expected: "available false"
    - step: 4
      action: "PUT /publish"
      expected: "200, status READY, contentStatus PUBLISHED, uploadAttempts 1, hasStagedFile false"
    - step: 5
      action: "Open the row storage key through VideoStorage"
      expected: "The file is present in the store"
  expected_result: "Attaching stages; publishing stores then publishes. (REQ-LESSONVIDEO-010)"
  actual_result: >
    Automated and passing: LessonVideoTest.uploadIsStagedNotStored and
    LessonVideoTest.publishUploadsToStorage, run against the real dev database.
  status: Pass
  defect_id: ""
  remarks: >
    Step 2 reads the entity rather than the API response on purpose - the response is produced by
    the code under test, so trusting it would not prove the store was untouched.
  automation_status: Automated
  automation_reference: "LessonVideoTest.uploadIsStagedNotStored, LessonVideoTest.publishUploadsToStorage"

- id: TC-LESSONVIDEO-022
  requirement_ids: [REQ-LESSONVIDEO-011]
  scenario_id: SCN-LESSONVIDEO-019
  system: Backend
  module: LESSONVIDEO
  feature: A failed upload is recorded and can be retried without duplicating
  title: A refused upload records the failure, keeps the file, and a retry recovers it
  objective: "Confirm a storage failure survives as a visible, retryable state instead of being rolled back."
  preconditions:
    - "A video with a staged file, and an object store that can be made to fail"
  test_data: "A minimal valid MP4; an in-memory store with a fail switch"
  test_environment: "Backend integration suite with a Primary failing VideoStorage bean"
  priority: Critical
  severity: Critical
  test_type: Negative
  steps:
    - step: 1
      action: "Make the store refuse uploads, then PUT /publish"
      expected: "400 - not 500; nothing is broken, the upload simply did not go through"
    - step: 2
      action: "Read the lesson_videos row"
      expected: "status UPLOAD_FAILED, errorMessage set, uploadAttempts 1, lastUploadAttemptAt set, contentStatus still DRAFT, storageKey null"
    - step: 3
      action: "Check the staging table"
      expected: "The staged file is still present - it is the only copy and it is what a retry uploads"
    - step: 4
      action: "Stop the store failing, then POST /retry-upload"
      expected: "200, status READY, uploadAttempts 2, hasStagedFile false"
    - step: 5
      action: "List the objects the store holds for this video"
      expected: "Exactly one key, the v1 object for this video id, despite two upload calls"
    - step: 6
      action: "Read contentStatus after the retry"
      expected: "Still DRAFT - retry moves the file, it does not decide the content is good"
  expected_result: "A failure is recorded and recoverable, and a retry leaves no duplicate. (REQ-LESSONVIDEO-011)"
  actual_result: >
    Automated and passing: LessonVideoUploadFailureTest.failedUploadIsRecordedAndRetryable and
    retrySucceedsWithoutDuplicating.
  status: Pass
  defect_id: ""
  remarks: >
    This is the regression guard for the original defect: the upload used to run inside the same
    transaction as the row write, so a storage failure marked it rollback-only and destroyed the
    failure record along with it.
  automation_status: Automated
  automation_reference: "LessonVideoUploadFailureTest.failedUploadIsRecordedAndRetryable, LessonVideoUploadFailureTest.retrySucceedsWithoutDuplicating"

