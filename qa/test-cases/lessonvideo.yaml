- id: TC-LESSONVIDEO-018
  requirement_ids: [REQ-LESSONVIDEO-008]
  scenario_id: SCN-LESSONVIDEO-015
  system: Backend
  module: LESSONVIDEO
  feature: Where video files live is a configuration choice
  title: A storage key maps to a Cloudinary public id without drifting
  objective: >
    Confirm the asset name is derived from the key rather than stored separately, so a row and
    its file cannot disagree about where the video lives.
  preconditions:
    - "None - a pure function"
  test_data: "lesson-videos/<id>/v1.mp4, the same key the service generates"
  test_environment: "Plain JUnit, no Spring context, no database"
  priority: High
  severity: Major
  test_type: Validation
  steps:
    - step: 1
      action: "Derive the public id for a key ending in .mp4"
      expected: "The extension is dropped - Cloudinary carries format separately, so keeping it would name the asset ...mp4.mp4"
    - step: 2
      action: "Derive it for a key with no extension"
      expected: "Unchanged"
    - step: 3
      action: "Derive it for v1 and v2 of the same video"
      expected: "Different ids, so a re-upload is a separate asset rather than an overwrite"
    - step: 4
      action: "Derive it for a blank and a null key"
      expected: "IllegalArgumentException in both cases"
  expected_result: "Key-to-asset mapping is total and collision-free. (REQ-LESSONVIDEO-008)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
  automation_status: Automated
  automation_reference: >
    LessonVideoRulesTest.publicIdDropsTheExtension, .publicIdLeavesAnExtensionlessKeyAlone,
    .publicIdIsDerivedNotStored, .publicIdRefusesBlank

