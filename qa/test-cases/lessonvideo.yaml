# LESSONVIDEO module — manual test cases
#
# Backend cases are Automated with a real, verified test method behind each one (LessonVideoTest
# 14/14 and LessonVideoRulesTest 9/9, both run green). They are recorded here as UNEXECUTED
# manual cases in the register's own convention.
#
# Mobile and Admin cases are ManualOnly: neither system has an automated test runner in this
# project. They are Not Executed - no device or browser pass has happened for this work.

- id: TC-LESSONVIDEO-001
  requirement_ids: [REQ-LESSONVIDEO-001]
  scenario_id: SCN-LESSONVIDEO-001
  system: Backend
  module: LESSONVIDEO
  feature: A video reaches students only after a human approves it
  title: An uploaded video is READY but invisible to students
  objective: "Confirm an upload cannot reach a learner before anyone has reviewed it."
  preconditions:
    - "A running backend and a topic to attach the video to"
  test_data: "A synthetic MP4 header (ftyp at offset 4)"
  test_environment: "Backend against the real dev database"
  priority: Critical
  severity: Critical
  test_type: Functional
  steps:
    - step: 1
      action: "POST an MP4 to /api/admin/lesson-videos with a topicId, as an admin"
      expected: "200 with status READY, contentStatus DRAFT, contentVersion 1 and a checksum"
    - step: 2
      action: "GET /api/topics/{topicId}/lesson-video as a signed-in student"
      expected: "200 with available:false"
  expected_result: "An unpublished upload is invisible to students. (REQ-LESSONVIDEO-001)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
  automation_status: Automated
  automation_reference: "LessonVideoTest.uploadIsReadyButUnpublished"

