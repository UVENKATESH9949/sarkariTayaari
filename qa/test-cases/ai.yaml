- id: TC-AI-042
  requirement_ids: [REQ-AI-010, REQ-AI-012, REQ-AI-013, REQ-AI-014]
  scenario_id: SCN-AI-042
  system: Admin
  module: AI
  feature: AI Content Review admin page
  title: Generate, submit for review, publish, and unpublish a real explanation through the admin UI
  objective: >
    Confirm the full content lifecycle works correctly when driven entirely through the admin
    console page, against a real backend and a real AI provider -- not just through direct API
    calls (which REQ-AI-010/012/013/014's own backend integration tests already cover).
  preconditions:
    - Signed in as an admin (or a minted admin-fixture token)
    - A real, non-deleted question id to generate an explanation for
    - The active AI provider is configured and reachable (Groq, in this project's current setup)
  test_data: "Any real question id from GET /api/questions/live; no fixture required"
  test_environment: "Real dev backend + admin dev server (browser), real Groq API call"
  priority: Medium
  severity: Low
  test_type: Functional
  steps:
    - step: 1
      action: "On AI Content Review, fill Task=QUESTION_EXPLANATION, Language=en, paste a real question id, click Generate"
      expected: "A result summary shows Generated 1; no console errors"
    - step: 2
      action: "Switch the Status filter to DRAFT"
      expected: "A card for that question appears with a DRAFT badge, the full payload table, and Submit for review / Publish buttons"
    - step: 3
      action: "Click Submit for review, then switch the Status filter to REVIEW"
      expected: "The card now appears under REVIEW with Publish / Reject buttons; it no longer appears under DRAFT"
    - step: 4
      action: "Click Publish, then switch the Status filter to PUBLISHED"
      expected: "The card now appears under PUBLISHED with an Unpublish button, and a Reviewed by/at line"
    - step: 5
      action: "Click Unpublish, then switch the Status filter to DRAFT"
      expected: "The card is back under DRAFT with its Reviewed-by note preserved"
  expected_result: >
    Every transition (generate, submit-for-review, publish, unpublish) is reachable and correctly
    reflected in the filtered list through the admin UI alone, matching what REQ-AI-010/012/013/
    014's own backend tests already prove works at the API layer.
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: >
    Manually walked through this exact sequence on 2026-09-14 via a scripted (Playwright)
    browser session against a real backend and a real Groq call -- not a substitute for a human
    running this case, but real evidence the path is reachable and correct. Found and fixed one
    real bug: a stale-response race in the review-queue filter (see SCN-AI-042's own notes).
  automation_status: ManualOnly
  automation_reference: null
