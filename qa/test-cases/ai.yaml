  objective: >
    Confirm that with PROFILE_SUMMARY enabled and a provider returning a well-formed response,
    POST /api/exams/{examCode}/profile-summary returns a narrative grounded in the given coverage
    numbers (topicsInSyllabus/topicsWithEvidence) and at least one given strength/weakness topic
    name.
  preconditions:
    - Student is signed in
    - ai_task_flags row for PROFILE_SUMMARY set to enabled=true
    - Active AI provider is a test fixture returning a grounded, well-formed JSON response
  test_data: "n/a (sampleRequestBody: 61 in syllabus, 23 with evidence, one STRONG strength (Geometry), one NEEDS_ATTENTION weakness (Percentages))"
  test_environment: "Backend (dev, real Neon database)"
  priority: Medium
  severity: Low
  test_type: Functional
  steps:
    - step: 1
      action: "POST /api/exams/{examCode}/profile-summary as a signed-in student, with the flag and fixture provider enabled"
      expected: "200 OK; narrative is non-null and contains the given topicsWithEvidence (23) and a given topic name"
  expected_result: >
    A grounded narrative is generated over the exam-wide profile, not a specific session/attempt.
    (REQ-AI-020 acceptance_criteria)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: >
    Doubles as the regression guard for a real defect found on 2026-09-14: with the wire-level
    max_tokens set to 300, this exact 3-strength/3-weakness payload made the reasoning model spend
    its whole output budget thinking and get cut off mid-JSON (finishReason=length), surfacing as
    a silent null narrative on the most realistic payload shape there is. Keep this case at 3+3 or
    larger -- a smaller profile would not have caught it.
  automation_status: Automated
  automation_reference: "ProfileSummaryControllerTest.generatesAGroundedNarrativeWhenEnabled"

