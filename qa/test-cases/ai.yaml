- id: TC-AI-014
  requirement_ids: [REQ-AI-005]
  scenario_id: SCN-AI-014
  system: Mobile
  module: AI
  feature: Structured output validation
  title: A hint revealing the answer is rejected, without false positives
  objective: >
    Confirm the hint check catches genuine leakage while leaving legitimate hints alone.
  preconditions: []
  test_data: "A method-based hint, a hint naming the answer, and a numeric-answer question"
  test_environment: "Developer machine"
  priority: Medium
  severity: Medium
  test_type: Validation
  steps:
    - step: 1
      action: "Validate a hint that points at the method without naming the answer"
      expected: "Validation succeeds"
    - step: 2
      action: "Validate a hint that names the answer outright"
      expected: "Failure with code HINT_REVEALS_ANSWER"
    - step: 3
      action: "For a question whose answer is a short number, validate a hint that mentions that number incidentally"
      expected: "Validation succeeds — short tokens are deliberately not checked"
    - step: 4
      action: "Validate a hint containing the answer as part of a longer word"
      expected: "Validation succeeds — matching is on whole words only"
  expected_result: >
    Genuine leakage is caught and legitimate hints are not obstructed.
    (REQ-AI-005 edge_conditions)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: >
