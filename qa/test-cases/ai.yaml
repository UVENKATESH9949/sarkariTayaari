- id: TC-AI-002
  requirement_ids: [REQ-AI-001]
  scenario_id: SCN-AI-002
  system: Mobile
  module: AI
  feature: AI task registry
  title: The registry self-check fails when an invariant is deliberately broken
  objective: >
    Confirm the consistency check is real rather than merely configured, by violating each
    invariant in turn and observing a specific complaint.
  preconditions:
    - "The suite passes before the change"
  test_data: "n/a"
  test_environment: "Developer machine"
  priority: High
  severity: Major
  test_type: Negative
  steps:
    - step: 1
      action: "Mark any cacheable task `personalized: true` without removing `cacheable: true`"
      expected: "The suite fails, naming 'personalized tasks can never be cacheable'"
    - step: 2
      action: "Add a language code with no question content (for example `te`) to any task"
      expected: "The suite fails, naming that language as having no question content"
    - step: 3
      action: "Reorder a task's tiers so they no longer follow resolution order"
      expected: "The suite fails, naming the expected order"
    - step: 4
      action: "Revert every change and re-run"
      expected: "All tests pass again"
  expected_result: >
    Each invariant is genuinely enforced, not merely declared. (REQ-AI-001 acceptance_criteria)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: >
    A guard nobody has watched fail is not known to work — the same discipline used to prove
    scripts/check-topic-health-parity.js.
  automation_status: Automated
  automation_reference: "packages/core/src/ai/tasks.test.ts (describe 'registryViolations detects drift')"

