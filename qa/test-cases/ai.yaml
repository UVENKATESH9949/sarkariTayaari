# AI module — manual test cases
#
# Every test case links to one scenario id and one or more requirement ids. A test case is a
# reusable DEFINITION — it is never overwritten by an execution. Expected results are derived from
# the linked requirement's acceptance_criteria/error_conditions/edge_conditions, never from current
# implementation behaviour. Every case below is freshly generated and UNEXECUTED: actual_result is
# empty, status is Not Executed, defect_id is empty. No tester, date, build or result is invented.
#
# `system` is recorded as Mobile because the mobile app is the first and primary consumer of this
# shared layer (AI_ARCHITECTURE.md §12 ships it there in Phase 3); the code itself lives in
# packages/core and is consumed by web/ identically, which is why the requirements declare both.
#
# TC-AI-001 through TC-AI-022 cover Phase 1 (packages/core, `npm run test --workspace
# @sarkaritaiyaari/core`). TC-AI-023 onward cover Phase 2 (the backend generation + review
# pipeline) and cite real backend test classes run against the actual dev database
# (`mvn -f backend/pom.xml test -Dtest=...`), confirmed passing in this change: 12/12 in
# AiContentIntegrationTest, 2/2 in AiAnswerGroundingTest, 10/10 in AiContentValidationTest.
#
# automation_status is evidence-based. Every Automated reference below names a test that was
# actually written and run in this change. Phase 1's layer is pure logic with no I/O, no UI and
# no database, which is why it is unusually automatable; Phase 2's backend tests are real
# integration tests against the shared dev database. Sync (Phase 3) and any on-device runtime
# (Phase 6) will need manual coverage of their own once built.

