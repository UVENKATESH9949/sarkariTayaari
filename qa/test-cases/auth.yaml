- id: TC-AUTH-010
  requirement_ids: [REQ-AUTH-003, REQ-AUTH-006]
  scenario_id: SCN-AUTH-008
  system: Backend
  module: AUTH
  feature: Multi-device sessions
  title: Logging in on a second device does not revoke the first; revoking one leaves the other valid
  objective: >
    Confirm two concurrent logins for the same account produce two independently valid
    tokens, and that logging out one device's token has no effect on the other's — a single
    combined case because both requirements describe one underlying multi-session mechanism
    (per SCN-AUTH-008's merge note; splitting would duplicate the same setup/assertions
    across two cases with no added coverage).
  preconditions:
    - "TESTDATA-AUTH-STUDENT-01 is a registered account with no active session"
  test_data: "TESTDATA-AUTH-STUDENT-01"
  test_environment: "Backend (dev), two independent HTTP clients simulating two devices"
  priority: High
  severity: Medium
  test_type: StateTransition
  steps:
    - step: 1
      action: "POST /api/auth/login for TESTDATA-AUTH-STUDENT-01 (\"device A\")"
      expected: "200 OK; token A issued"
    - step: 2
      action: "POST /api/auth/login again for the same account (\"device B\")"
      expected: "200 OK; token B issued, distinct from token A"
    - step: 3
      action: "GET /api/auth/me using token A"
      expected: "200 OK — token A is still valid after device B's login"
    - step: 4
      action: "POST /api/auth/logout using token A"
      expected: "204 No Content"
    - step: 5
      action: "GET /api/auth/me using token B"
      expected: "200 OK — token B remains valid; revoking token A did not affect it"
  expected_result: >
    A user can be signed in on multiple devices simultaneously, and revoking one session does
    not affect another. (REQ-AUTH-003 edge_conditions, REQ-AUTH-006 acceptance_criteria)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
  automation_status: PartiallyAutomated
  automation_reference: "AuthTest.logout_revokesOnlyTheDeviceThatCalledIt covers this only as an incidental side effect, not a dedicated multi-session assertion."

