- id: TC-AUTH-018
  requirement_ids: [REQ-AUTH-008]
  scenario_id: SCN-AUTH-015
  system: Backend
  module: AUTH
  feature: Authorization primitives
  title: A demoted admin's existing token is rejected on the very next admin-gated call
  objective: >
    Confirm role is read fresh on every request, not cached on the token — an account
    demoted from ADMIN to STUDENT must lose admin access immediately, without needing to
    sign out and back in.
  preconditions:
    - "TESTDATA-AUTH-ADMIN-02 is a dedicated throwaway admin account (do not use TESTDATA-AUTH-ADMIN-01, which other cases may depend on staying an admin), currently signed in with a valid token"
  test_data: "TESTDATA-AUTH-ADMIN-02"
  test_environment: "Backend (dev), plus a way to change the account's role server-side (admin console or a direct, scoped data change) between steps 1 and 2"
  priority: High
  severity: High
  test_type: Security
  steps:
    - step: 1
      action: "Call a requireAdmin-gated endpoint with TESTDATA-AUTH-ADMIN-02's token"
      expected: "2xx — succeeds, confirming the token is currently valid for admin access"
    - step: 2
      action: "Demote TESTDATA-AUTH-ADMIN-02's role from ADMIN to STUDENT (without revoking its token)"
      expected: "Role change succeeds"
