    mark, "Only Gmail addresses for now", and Send greyed out. Step 2: the code step said "This
    build isn't set up to send email yet - the code is in the server log. It expires in 10
    minutes", which is the honest emailed=false path rather than claiming an email. Step 3: the
    code from the log signed in and landed on Home; the backend logged
    "otp.verified email=signin.check.72692@gmail.com newAccount=true". Step 4: relaunch went
    straight to Home.
  status: Pass
  defect_id: ""
  remarks: >
    Onboarding did not run in step 3 because this install had already completed it - onboarding is
    per-install, sign-in is per-account, and the gate orders them correctly. A genuinely fresh
    install showing sign-in THEN onboarding has not been observed and is worth a look.
  automation_status: ManualOnly
  automation_reference: ""

