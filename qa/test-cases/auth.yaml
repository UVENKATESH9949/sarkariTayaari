    - step: 1
      action: "Launch the app with nobody signed in"
      expected: "The sign-in screen, before onboarding and before the app; Send is disabled until a valid Gmail is typed"
    - step: 2
      action: "Type a Gmail address and tap Send me a code"
      expected: "The code step, stating where the code went and when it expires"
    - step: 3
