    exercising this exact message path (see REQ-AUTH-004's automation_hint).
  preconditions:
    - "A token exists whose expiresAt is in the past (either wait out a short-TTL test token, or use an environment/fixture capable of minting an already-expired one — see remarks)"
  test_data: "An expired session token for TESTDATA-AUTH-STUDENT-01"
