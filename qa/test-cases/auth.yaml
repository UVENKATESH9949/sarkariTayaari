  preconditions:
    - "A freshly issued code"
  test_data: "Five deliberately wrong codes, then the correct one"
  test_environment: "Backend against the real dev database"
  priority: High
  severity: Critical
  test_type: Security
  steps:
    - step: 1
      action: "Submit five wrong codes"
      expected: "401 each time"
    - step: 2
      action: "Submit the CORRECT code"
      expected: "401 - the code is dead, attempts exhausted"
    - step: 3
      action: "Request a fresh code and submit it"
      expected: "Signs in normally - the cap kills a code, not the address"
  expected_result: "Guessing is bounded. (REQ-AUTH-015 acceptance_criteria)"
  actual_result: >
    Executed 2026-09-21. FAILED FIRST: after five 401s the correct code still signed in, because
    the attempt increment was rolled back with the UnauthorizedException that reports the failure.
    Fixed with noRollbackFor and re-run: five 401s, then the correct code 401, then a fresh code
    signed in normally.
  status: Pass
  defect_id: DEF-AUTH-001
  remarks: >
    The single most important case in this module. Without the cap a six-digit code is guessable
    in minutes, and the failure mode is silent - nothing errors, guesses are simply free.
  automation_status: ManualOnly
  automation_reference: ""

