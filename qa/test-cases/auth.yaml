# AUTH module — manual test cases (Phase 3, validation slice)
#
# Every test case links to one scenario id and one or more requirement ids. A test case is a
# reusable DEFINITION — it is never overwritten by an execution (qa/execution/*.yaml, not yet
# created). Expected results are derived from the linked requirement's acceptance_criteria/
# error_conditions/edge_conditions — never from current implementation behavior. Every case
# below is freshly generated and UNEXECUTED: actual_result is empty, status is Not Executed,
# defect_id is empty. No tester name, date, build, credential, or result has been invented.
#
# Test data referenced here uses only logical identifiers (see qa/test-data/auth.yaml,
# not yet created) — never a real email/password. Placeholders like
# TESTDATA-AUTH-NEW-EMAIL-01 stand for "a syntactically valid, not-yet-registered email
# generated per execution," not a literal value to reuse across runs.

- id: TC-AUTH-001
  requirement_ids: [REQ-AUTH-001]
  scenario_id: SCN-AUTH-001
  system: Backend
  module: AUTH
  feature: Student self-registration
  title: Valid registration returns 201 with a working token and STUDENT role
  objective: >
    Confirm a fresh registration with a valid, unregistered email and an 8+ character
    password creates a STUDENT account and returns a usable token in the same response.
  preconditions:
    - "TESTDATA-AUTH-NEW-EMAIL-01 is not registered on the target environment"
  test_data: "TESTDATA-AUTH-NEW-EMAIL-01, TESTDATA-AUTH-VALID-PASSWORD-01 (>=8 chars)"
  test_environment: "Backend (dev), no prior session"
  priority: Critical
  severity: Critical
  test_type: Functional
  steps:
    - step: 1
      action: "POST /api/auth/register with email=TESTDATA-AUTH-NEW-EMAIL-01, password=TESTDATA-AUTH-VALID-PASSWORD-01"
      expected: >
        201 Created; response contains a non-blank token, a future expiresAt, and
        user.role == "STUDENT"
    - step: 2
      action: "GET /api/auth/me using the token returned in step 1"
      expected: "200 OK; returned email matches TESTDATA-AUTH-NEW-EMAIL-01 (case-insensitive)"
  expected_result: >
    Registration succeeds in one call and the issued token is immediately usable to fetch the
    new account's own profile. (REQ-AUTH-001 acceptance_criteria)
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
  automation_status: Automated
  automation_reference: "AuthTest.register_returnsATokenAndNormalisesTheEmail"

