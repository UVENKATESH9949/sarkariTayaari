- id: TC-ROADMAP-007
  requirement_ids: [REQ-ROADMAP-003]
  scenario_id: SCN-ROADMAP-007
  system: Backend
  module: ROADMAP
  feature: Every workload estimate declares where it came from
  title: Every estimate declares a tier with a sample size consistent with it
  objective: >
    Confirm the ladder always resolves to one of the four declared tiers, and that the sample size
    reported is consistent with the tier's own floor.
  preconditions:
    - "A fresh topic with no attempts by the calling student"
  test_data: "A disposable exam and topic with four questions"
  test_environment: "Backend against the real dev database"
  priority: High
  severity: Major
  test_type: Functional
  steps:
    - step: 1
      action: "GET the roadmap as a newly registered student and read estimate.source"
      expected: "One of PERSONAL_TOPIC, COHORT_TOPIC, COHORT_DIFFICULTY, DEFAULT"
    - step: 2
      action: "Compare estimate.sampleSize against the tier reported"
      expected: "Exactly 0 for DEFAULT; at or above that tier's floor otherwise"
    - step: 3
      action: "Read estimatedMinutes"
      expected: "Present and positive — whichever tier won, the student still gets real minutes"
  expected_result: "The tier that produced a number always travels with it, consistently. (REQ-ROADMAP-003 acceptance_criteria)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: >
    Reframed 2026-09-19 after its first run failed. It originally asserted DEFAULT for a fresh
    topic and got COHORT_DIFFICULTY, because the shared dev database genuinely holds 53 timed
    attempts at the easiest difficulty — the ladder working, not a bug. A tier-selection rule
    cannot be asserted against a database the test does not control, so the tiers themselves moved
    to TC-ROADMAP-013 with constructed samples.
  automation_status: Automated
  automation_reference: "StudyRoadmapTest.everyEstimateDeclaresATierWithASampleSizeConsistentWithIt"

- id: TC-ROADMAP-013
  requirement_ids: [REQ-ROADMAP-003]
  scenario_id: SCN-ROADMAP-007
  system: Backend
  module: ROADMAP
  feature: Every workload estimate declares where it came from
  title: Each tier of the estimate ladder is selected exactly when its own rule says so
  objective: >
    Confirm every branch of the ladder — including the ones the real database can no longer reach
    — with samples the test constructs itself.
  preconditions:
    - "None — plain JUnit, no Spring context, no database"
  test_data: "Constructed personal, cohort-topic and cohort-difficulty samples around each floor"
  test_environment: "Plain JUnit"
  priority: High
  severity: Major
  test_type: Functional
  steps:
    - step: 1
      action: "Resolve with a personal sample at the floor, beside a far larger cohort sample"
      expected: "PERSONAL_TOPIC — the student's own rate wins; the question is how long THEY take"
    - step: 2
      action: "Resolve with a personal sample one attempt below the floor"
      expected: "COHORT_TOPIC — below the floor an average is noise and is not trusted"
    - step: 3
      action: "Resolve for a topic nobody has practised, with cohort data at that difficulty"
      expected: "COHORT_DIFFICULTY"
    - step: 4
      action: "Resolve with nothing measured anywhere, and with a step naming no difficulty"
      expected: "DEFAULT with sampleSize 0 in both cases — no tier is guessed at"
    - step: 5
      action: "Convert question counts to minutes at a known rate"
      expected: "Rounded up, never zero, and no spurious rounding when it divides exactly"
  expected_result: "Every tier and both floors behave as documented. (REQ-ROADMAP-003 validations)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: "Added 2026-09-19 when TC-ROADMAP-007 was reframed — see its remarks."
  automation_status: Automated
  automation_reference: "WorkloadEstimatorTest (6 methods)"

