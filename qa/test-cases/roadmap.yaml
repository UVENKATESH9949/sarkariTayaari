# ROADMAP module — manual test cases
#
# Every case below has a real test method behind it (StudyRoadmapTest). They are recorded here as
# UNEXECUTED manual cases in the register's own convention; the automated runs that actually
# happened are recorded in qa/execution/.

- id: TC-ROADMAP-001
  requirement_ids: [REQ-ROADMAP-001]
  scenario_id: SCN-ROADMAP-001
  system: Backend
  module: ROADMAP
  feature: A student's roadmap is readable, scoped to them, and never plans the impossible
  title: The roadmap endpoint rejects an unauthenticated caller
  objective: "Confirm the new endpoint is token-gated, like the learning state it reads."
  preconditions:
    - "A running backend"
    - "An exam with at least one mapped topic"
  test_data: "One disposable exam"
  test_environment: "Backend against the real dev database"
  priority: High
  severity: Critical
  test_type: Security
  steps:
    - step: 1
      action: "GET /api/me/study-roadmap?examCode={code} with no Authorization header"
      expected: "401"
    - step: 2
      action: "Inspect the controller's route definition"
      expected: "examCode is the only parameter — nothing names a user"
  expected_result: "The endpoint is unreachable unauthenticated and cannot be pointed at another account. (REQ-ROADMAP-001 acceptance_criteria)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: null
  automation_status: Automated
  automation_reference: "StudyRoadmapTest.requiresASignedInUser"

