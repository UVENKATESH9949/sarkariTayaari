- id: TC-ROADMAP-005
  requirement_ids: [REQ-ROADMAP-002]
  scenario_id: SCN-ROADMAP-005
  system: Backend
  module: ROADMAP
  feature: The plan is ordered by exam priority, balanced across subjects, and the reordering is visible
  title: No subject runs longer than the cap, and nothing is lost in the reordering
  objective: >
    Confirm the interleave genuinely breaks a run rather than being a no-op, and that it reorders
    without dropping or renumbering anything.
  preconditions:
    - "Two subjects; the five highest priorities all belong to the first subject"
  test_data: "Ten topics, five per subject, priorities 99 down to 90"
  test_environment: "Backend against the real dev database"
  priority: High
  severity: Major
  test_type: Functional
  steps:
    - step: 1
      action: "Walk all ten topics and count consecutive ones sharing a subjectId"
      expected: >
        Never more than 2 in a row while both subjects still have topics left. A longer run is
        legitimate only once one subject is exhausted, since nothing remains to interleave with —
        asserted by requiring every topic from that point on to share one subject.
    - step: 2
      action: "Collect every priorityRank in the response"
      expected: "1..10, each exactly once"
    - step: 3
      action: "Read topics[2].priorityRank"
      expected: "Not 3 — proving a topic actually moved, so the assertion is not vacuous"
  expected_result: "Balance is enforced and remains inspectable. (REQ-ROADMAP-002 acceptance_criteria)"
  actual_result: ""
  status: Not Executed
  defect_id: ""
  remarks: >
    Step 3 exists so the test cannot pass on a plan the interleave never touched. Step 1 was
    relaxed on 2026-09-19 after failing on a legitimate tail: with five topics per subject and a
    cap of two, the last three necessarily come from whichever subject is left. The service was
    right and the assertion was too strong.
  automation_status: Automated
  automation_reference: "StudyRoadmapTest.noSubjectRunsLongerThanTheCapAndTheOriginalRankIsStillVisible"

