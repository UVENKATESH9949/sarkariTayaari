# WEB module — test scenarios
#
# Every scenario references one or more qa/requirements/web.yaml requirement_ids.
# categories used here: Positive, Negative, Boundary, Validation, Authentication,
# StateTransition, Compatibility, Integration, ErrorHandling, Recovery, Security.
#
# Scope note: these cover TASK-2601 Phase 0 — the shared package, the app shell, theming,
# language, the browser session and cross-origin access. Feature-area scenarios (Practice,
# Mock Test, Exam Guide and so on) belong to their own contract modules with `Web` added to the
# requirement's `system` list, not here.

- id: SCN-WEB-001
  requirement_ids: [REQ-WEB-001]
  category: Integration
  title: Mobile still builds and runs after shared logic moves out of it
  objective: >
    Verify extracting the evaluator, topic-health algorithm, catalogues, tokens and API client
    into packages/core leaves the shipped phone app functionally unchanged.
  systems: [Mobile]
  status: Ready
  notes: "Mobile is a shipped app; this is the regression gate for the whole extraction."

- id: SCN-WEB-002
  requirement_ids: [REQ-WEB-001]
  category: Negative
  title: Shared code cannot reference a platform-specific global
  objective: >
    Verify a browser-only or Node-only global introduced into packages/core fails a real check
    rather than compiling and breaking at runtime on one platform.
  systems: [Mobile, Web]
  status: Ready
  notes: "Both failure directions are silent until runtime, which is why this is enforced by test rather than review."

- id: SCN-WEB-003
  requirement_ids: [REQ-WEB-002]
  category: Positive
  title: Every shared fixture case scores identically in Java and TypeScript
  objective: >
    Verify the two deliberate implementations of the evaluator agree on all shared cases,
    including the null-answerKey and null-response cases.
  systems: [Backend, Mobile, Web]
  status: Ready
  notes: null

- id: SCN-WEB-004
  requirement_ids: [REQ-WEB-003]
  category: Compatibility
  title: Layout adapts between phone and desktop widths without horizontal scrolling
  objective: >
    Verify the navigation treatment switches at the breakpoint and no width produces
    horizontal page overflow.
  systems: [Web]
  status: Ready
  notes: null

- id: SCN-WEB-005
  requirement_ids: [REQ-WEB-004, REQ-WEB-003]
  category: Positive
  title: Account and Settings are reachable at phone width
  objective: >
    Verify the two destinations not among the top nav's five primary links remain reachable
    on a narrow screen (Settings as an icon button, Account inside the menu dropdown), and
    that activating them navigates.
  systems: [Web]
  status: Ready
  notes: >
    Regression guard for a real Phase 0 defect — both were unreachable below 1024px under
    the earlier sidebar/bottom-bar model, which is invisible unless specifically checked
    because every other screen still worked. Re-verified this session under the new
    top-nav-only model (2026-09-18) — both remain reachable.

- id: SCN-WEB-006
  requirement_ids: [REQ-WEB-005]
  category: StateTransition
  title: Theme choice applies immediately and survives a reload
  objective: >
    Verify switching to dark repaints from the shared palette, persists, and is applied before
    first paint on the next visit.
  systems: [Web]
  status: Ready
  notes: null

- id: SCN-WEB-007
  requirement_ids: [REQ-WEB-005]
  category: Recovery
  title: Unusable or corrupt stored preferences fall back to defaults
  objective: >
    Verify a corrupt stored appearance value, or storage that throws outright, renders the app
    with defaults instead of failing to start.
  systems: [Web]
  status: Ready
  notes: "Private browsing modes can make localStorage throw rather than return null."

- id: SCN-WEB-008
  requirement_ids: [REQ-WEB-006]
  category: StateTransition
  title: Interface language switches and persists
  objective: >
    Verify choosing Telugu changes visible strings without a reload and survives one, using the
    catalogues shared with the phone app.
  systems: [Web]
  status: Ready
  notes: null

- id: SCN-WEB-009
  requirement_ids: [REQ-WEB-007]
  category: Authentication
  title: Register, sign in, reload, sign out
  objective: >
    Verify the full browser session lifecycle against the same accounts the phone app uses,
    including that a session survives a reload.
  systems: [Backend, Web]
  status: Ready
  notes: null

- id: SCN-WEB-010
  requirement_ids: [REQ-WEB-007]
  category: ErrorHandling
  title: A revoked token is discarded, a transient failure is not
  objective: >
    Verify startup validation distinguishes "the server rejected this token" from "the server
    could not be reached" — only the former signs the student out.
  systems: [Backend, Web]
  status: Ready
  notes: >
    The distinction matters: treating an outage as a revocation would sign every student out
    whenever the backend hiccuped.

- id: SCN-WEB-011
  requirement_ids: [REQ-WEB-008]
  category: Security
  title: The CORS allowlist admits listed origins and refuses everything else
  objective: >
    Verify an allowlisted origin receives Access-Control-Allow-Origin and an unlisted one is
    refused, including the near-miss cases that look identical to a human.
  systems: [Backend, Web]
  status: Ready
  notes: >
    127.0.0.1 versus localhost, and *.web.app versus *.firebaseapp.com, are distinct origins.
    Both near-misses have caused or would cause a total outage of the client.

- id: SCN-WEB-012
  requirement_ids: [REQ-WEB-008]
  category: ErrorHandling
  title: A blocked origin surfaces as a readable message, not a blank screen
  objective: >
    Verify the app renders its shell and an explanatory banner when the backend refuses the
    origin, rather than appearing broken or empty.
  systems: [Web]
  status: Ready
  notes: null

- id: SCN-WEB-013
  requirement_ids: [REQ-WEB-009]
  category: Positive
  title: A non-root route survives a direct load or reload
  objective: >
    Verify deep-linking and reloading on an in-app route renders that screen rather than a host
    404.
  systems: [Web]
  status: Ready
  notes: "Passes trivially on the Vite dev server; the real risk is the deployed host's rewrite configuration."

- id: SCN-WEB-014
  requirement_ids: [REQ-WEB-010]
  category: Positive
  title: A full mock attempt runs blind, submits, and scores correctly
  objective: >
    Verify a real timed attempt shows no correct/incorrect styling before submit, the
    confirmation dialog names the answered count, and the resulting scorecard's marks match
    the paper's own +correct/-wrong scheme, with a per-question review afterward.
  systems: [Web]
  status: Ready
  notes: null

- id: SCN-WEB-015
  requirement_ids: [REQ-WEB-010]
  category: Regression
  title: The question navigator stays fully usable on a real 100+ question paper
  objective: >
    Verify the navigator's own Close button — and every cell — stays reachable and clickable
    when a real paper has far more questions than fit on screen, and that answered/marked
    counts in the grid match the student's actual actions.
  systems: [Web]
  status: Ready
  notes: >
    Regression guard: the grid was previously unscrollable, so on a real 100-question SSC CGL
    paper the panel overflowed both the top and bottom of the screen and its own Close button
    became unreachable at ordinary viewport heights, at both desktop and phone widths.

- id: SCN-WEB-016
  requirement_ids: [REQ-WEB-010]
  category: Negative
  title: Leaving an active attempt is guarded, finishing it is not
  objective: >
    Verify in-app navigation away from an active attempt shows this app's own styled
    confirmation dialog, a tab close/refresh during an active attempt arms the browser's
    native beforeunload prompt, and neither guard is armed once the attempt has been
    submitted.
  systems: [Web]
  status: Ready
  notes: >
    beforeunload cannot be driven end-to-end by an automated headless script — browsers
    intentionally suppress the native prompt under automation — so this scenario's
    beforeunload half is manual-only by nature, not by omission.

- id: SCN-WEB-017
  requirement_ids: [REQ-WEB-003]
  category: Compatibility
  title: The exam-card grid and footer adapt across tablet, laptop and desktop widths
  objective: >
    Verify the exam-card grid used by Practice and Mock Test renders the documented
    column count at each breakpoint (Home itself moved to its own hero+rows layout — see
    REQ-WEB-014), the footer switches between its compact and full multi-column forms at
    the same 1024px point the top nav's inline links appear, and none of it produces
    horizontal overflow.
  systems: [Web]
  status: Ready
  notes: >
    Distinct from SCN-WEB-004, which covers the primary navigation's own switch — this
    scenario covers page content (the grid and the footer) reflowing independently of that.

- id: SCN-WEB-018
  requirement_ids: [REQ-WEB-011]
  category: Positive
  title: Practice Quiz and Mock Test Engine show a desktop sidebar with no functional change
  objective: >
    Verify that at 1024px and above, Practice Quiz shows a session-context/progress sidebar
    and Mock Test's question navigator renders inline in a sidebar instead of only behind a
    modal button, while answering, marking, submitting and scoring all behave exactly as they
    do below 1024px.
  systems: [Web]
  status: Ready
  notes: "Verified this session against a real 100-question SSC CGL Tier 1 paper and a real 140-question practice topic, at 1024/1440/1920px."

- id: SCN-WEB-019
  requirement_ids: [REQ-WEB-011]
  category: Compatibility
  title: The sidebar layout holds up at the 1024px boundary and on a resize
  objective: >
    Verify the question column keeps a comfortable width (does not overflow or force
    horizontal scrolling) at exactly 1024px, the narrowest width the sidebar appears at, and
    that resizing across the 1024px boundary while the modal navigator is open doesn't break
    either the modal or the sidebar.
  systems: [Web]
  status: Ready
  notes: "The question column uses a CSS grid minmax(0, 42rem) track, so it shrinks below its 42rem cap rather than overflowing when the combined layout is wider than the available content area."

- id: SCN-WEB-020
  requirement_ids: [REQ-WEB-012]
  category: Positive
  title: Every practice/mock-test data fetch shows a content-shaped skeleton
  objective: >
    Verify Subjects, Topics, Levels, Mock Test's paper list, Mock Test Start, Practice Quiz
    and Mock Test Engine each show a skeleton shaped like their own content (rows, a card
    list, or a question card) during their first load, never a bare "Loading…" line.
  systems: [Web]
  status: Ready
  notes: "This project's shared dev database can genuinely take several real seconds for some of these fetches (documented in memory/STATUS.md) — the skeleton needs to hold up over a real, not simulated, delay."

- id: SCN-WEB-021
  requirement_ids: [REQ-WEB-013]
  category: Positive
  title: Progress, Exams and 404 each show the correct ComingSoon treatment
  objective: >
    Verify Progress and Exams show the phase-pill "arrives in Phase N" treatment naming the
    right phase, and an unknown URL shows the 404-specific copy with no phase pill.
  systems: [Web]
  status: Ready
  notes: null

- id: SCN-WEB-022
  requirement_ids: [REQ-WEB-014]
  category: Positive
  title: Home shows a real hero and correctly category-grouped rows
  objective: >
    Verify Home's hero reflects a real badged exam's own data (name, photo, cycle, vacancy,
    deadline, no duplicated demo label) and that every active exam appears in the correct
    horizontally-scrollable category row with a real photo or a monogram fallback.
  systems: [Web]
  status: Ready
  notes: "Verified this session against the real 11-exam active catalogue, both themes, at 390/820/1440px — zero console errors."
