# QUESTIONS module — test scenarios (Phase 2)
#
# Every scenario references one or more qa/requirements/questions.yaml requirement_ids.
# Scenarios flagged `status: Ambiguous` correspond to a requirement whose own `ambiguity`
# field is REQUIRES CLARIFICATION, or a gap recorded in qa/requirements/_conflicts.md — their
# expected result is deliberately NOT pre-asserted; execution establishes actual behavior.
#
# REQ-QUESTIONS-019 (content-status change, requireReviewer): per explicit instruction, the
# documented ADMIN/STUDENT/anonymous authorization matrix is scenario'd normally (it's fully
# specified), while the REVIEWER-role path is captured as its own Ambiguous scenario —
# execution-blocked pending account provisioning (qa/requirements/_conflicts.md §1), not
# invented or silently skipped.

- id: SCN-QUESTIONS-001
  requirement_ids: [REQ-QUESTIONS-001]
  category: Positive
  title: Valid question create returns correctly resolved metadata
  objective: >
    Verify POST /api/questions with a valid payload returns 201 with correctly populated
    subjectId/subjectName/topicId/topicName/examCodes (sorted) fields.
  systems: [Backend, Admin]
  status: Ready
  notes: null

- id: SCN-QUESTIONS-002
  requirement_ids: [REQ-QUESTIONS-001]
  category: Negative
  title: "Missing root-language (\"en\") translation rejected"
  objective: Verify a create payload with no "en" entry in translations is rejected 400.
  systems: [Backend]
  status: Ready
  notes: null

- id: SCN-QUESTIONS-003
  requirement_ids: [REQ-QUESTIONS-001]
  category: Negative
  title: Unknown topicId, difficulty, or exam code rejected
  objective: >
    Verify create is rejected 400 when topicId, difficulty, or any entry in examCodes doesn't
    resolve to an existing row.
  systems: [Backend]
