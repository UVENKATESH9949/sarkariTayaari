# DAILYPLAN module — test scenarios
#
# Scoped to the preparation profile and the daily plan it feeds (TASK-3301, Phase 5).
# Nothing here asserts that the band-to-minutes figures are right for real students — they are
# declared assumptions, and no test could establish them.

- id: SCN-DAILYPLAN-001
  requirement_ids: [REQ-DAILYPLAN-001]
  category: Functional
  title: The profile round-trips and one account cannot see another's
  objective: >
    Verify an uploaded profile reads back intact, and that a second account reading the same
    endpoint gets its own empty profile rather than the first account's.
  systems: [Backend]
  status: Ready
  notes: null

- id: SCN-DAILYPLAN-002
  requirement_ids: [REQ-DAILYPLAN-001]
  category: Negative
  title: A study-time value outside the app's own vocabulary is rejected
  objective: >
    Verify an unknown band is refused at the boundary rather than reaching the planner, which would
    then have to guess what it means.
  systems: [Backend]
  status: Ready
  notes: null

- id: SCN-DAILYPLAN-003
  requirement_ids: [REQ-DAILYPLAN-002]
  category: Functional
  title: An older edit does not overwrite a newer one
  objective: >
    Verify last-write-wins resolves on the timestamp the device recorded, not on which upload
    arrived last, and that the losing device is handed the winner.
  systems: [Backend]
  status: Ready
  notes: "The rule that makes an offline edit uploaded days later behave correctly."

- id: SCN-DAILYPLAN-004
  requirement_ids: [REQ-DAILYPLAN-003]
  category: Functional
  title: A student who said 1-2 hours gets a day that fits
  objective: >
    Verify Gate 3's own wording: a 90-minute budget from the stated band, tasks summing within it,
    each naming a practicable topic and carrying a declared estimate tier.
  systems: [Backend]
  status: Ready
  notes: "The exit criterion for the phase."

- id: SCN-DAILYPLAN-005
  requirement_ids: [REQ-DAILYPLAN-003]
  category: Boundary
  title: An account that never onboarded still gets a plan, labelled as a default
  objective: >
    Verify the budget falls back to a declared constant rather than refusing to plan — this is the
    account most in need of a plan — and that the payload says the figure is not the student's own.
  systems: [Backend]
  status: Ready
  notes: null

- id: SCN-DAILYPLAN-006
  requirement_ids: [REQ-DAILYPLAN-004]
  category: Functional
  title: A second read returns the same plan rather than re-planning
  objective: >
    Verify task ids and totals are stable across reads, so a student who has already started does
    not see a different list, and the record of what was assigned survives.
  systems: [Backend]
  status: Ready
  notes: "The property that makes the stored table worth having at all."

- id: SCN-DAILYPLAN-007
  requirement_ids: [REQ-DAILYPLAN-003]
  category: Negative
  title: An unknown time zone is rejected rather than silently becoming UTC
  objective: >
    Verify a bad zone is a 400. A silent fallback would plan a different calendar day than the
    student is living in, and the plan is assigned to a day.
  systems: [Backend]
  status: Ready
  notes: null

- id: SCN-DAILYPLAN-008
  requirement_ids: [REQ-DAILYPLAN-003]
  category: Boundary
  title: An exam with nothing practicable returns an empty plan, not an error
  objective: >
    Verify the planner degrades to an honest empty day when the bank holds no questions for any of
    the exam's topics.
  systems: [Backend]
  status: Ready
  notes: null

- id: SCN-DAILYPLAN-009
  requirement_ids: [REQ-DAILYPLAN-001]
  category: Security
  title: The daily plan requires a signed-in student
  objective: "Verify the endpoint is token-gated, like every other personalization endpoint."
  systems: [Backend]
  status: Ready
  notes: null

- id: SCN-DAILYPLAN-010
  requirement_ids: [REQ-DAILYPLAN-005]
  category: Functional
  title: Yesterday's tasks settle from what was actually practised
  objective: >
    Verify a task whose topic was genuinely practised settles COMPLETED while one never touched
    settles SKIPPED, so the record stops saying ASSIGNED forever.
  systems: [Backend]
  status: Ready
  notes: "The core of Phase 6 — the four-way distinction study_tasks exists for, finally recorded."

- id: SCN-DAILYPLAN-011
  requirement_ids: [REQ-DAILYPLAN-005]
  category: Boundary
  title: Settlement runs once, and never judges a day still open
  objective: >
    Verify a second read judges nothing, and that today's untouched tasks stay ASSIGNED rather than
    being marked skipped while the day is still running.
  systems: [Backend]
  status: Ready
  notes: null

- id: SCN-DAILYPLAN-012
  requirement_ids: [REQ-DAILYPLAN-005]
  category: Functional
  title: The outcome rule maps observed work to an outcome as decided
  objective: >
    Verify the thresholds with constructed counts — nothing answered, enough answered, real but
    insufficient, no planned count — and that correctness never affects the outcome.
  systems: [Backend]
  status: Ready
  notes: "Asserted without a database, since a real attempt cannot be made to land on a chosen count."

- id: SCN-DAILYPLAN-013
  requirement_ids: [REQ-DAILYPLAN-006]
  category: Functional
  title: Every task explains itself, and reports the work done against it
  objective: >
    Verify each task carries a non-blank reason naming its own topic, and that answeredToday and
    accuracyToday reflect real uploaded attempts.
  systems: [Backend]
  status: Ready
  notes: "Makes 'a bad session changed tomorrow' inspectable rather than something to take on trust."

- id: SCN-DAILYPLAN-014
  requirement_ids: [REQ-DAILYPLAN-007]
  category: Functional
  title: A real device's stated study time reaches the planner
  objective: >
    Verify that after signing in on a device whose onboarding chose a study-time band, the server
    holds that band and the daily plan budgets from it rather than the 60-minute default.
  systems: [Backend, Mobile]
  status: Ready
  notes: "The whole point of the change — until it passes, Phase 5's decision is only half-implemented."

- id: SCN-DAILYPLAN-015
  requirement_ids: [REQ-DAILYPLAN-007]
  category: Boundary
  title: An install that never completed onboarding uploads nothing
  objective: >
    Verify a device with no edit moment at all takes the server's copy if there is one and pushes
    nothing, rather than inventing a timestamp that would beat a genuine older edit.
  systems: [Mobile]
  status: Ready
  notes: >
    Reframed 2026-09-20: this used to say "a NULL profile_updated_at", which the device pass proved
    was the wrong boundary — see SCN-DAILYPLAN-016.

- id: SCN-DAILYPLAN-016
  requirement_ids: [REQ-DAILYPLAN-007]
  category: Regression
  title: An install predating migration 0030 still sends its band
  objective: >
    Verify a device whose profile_updated_at is NULL but which did complete onboarding uploads its
    band, carrying onboarding_completed_at as the edit moment rather than "now".
  systems: [Backend, Mobile]
  status: Ready
  notes: "Guards the defect found by the device pass; without it every existing install stays silent."

- id: SCN-DAILYPLAN-017
  requirement_ids: [REQ-DAILYPLAN-007]
  category: Functional
  title: Migration 0030 applies to a populated database
  objective: >
    Verify the one unguardable ADD COLUMN runs against a real 64MB database with real content and a
    real profile, losing nothing and leaving the new column NULL.
  systems: [Mobile]
  status: Ready
  notes: "A failed local migration is a hard gate that stops the app starting, so this is the riskiest statement in the change."

- id: SCN-DAILYPLAN-018
  requirement_ids: [REQ-DAILYPLAN-008]
  category: Functional
  title: Today's plan renders in the app for the active exam
  objective: >
    Verify the screen loads the server's plan for the active exam and shows the budget, the
    planned total and one card per task, each with its stored reason and its cost.
  systems: [Mobile]
  status: Ready
  notes: "The program's first student-facing surface — until this, six phases were invisible."

- id: SCN-DAILYPLAN-019
  requirement_ids: [REQ-DAILYPLAN-008]
  category: Functional
  title: A task opens Practice for its own topic
  objective: >
    Verify tapping a task navigates to the levels screen scoped to that task's topic, so the plan
    leads somewhere rather than only describing work.
  systems: [Mobile]
  status: Ready
  notes: "Every task already resolves to a screen that exists; this is the whole reason the daily plan was the first consumer built."

- id: SCN-DAILYPLAN-020
  requirement_ids: [REQ-DAILYPLAN-008]
  category: Boundary
  title: An assumed budget is never shown as the student's own answer
  objective: >
    Verify a plan with basis DEFAULT is described as an assumption, while basis STATED_BAND names
    the band the student chose.
  systems: [Mobile]
  status: Ready
  notes: "The declared-provenance rule this whole program follows, at the one place a student actually reads it."

- id: SCN-DAILYPLAN-021
  requirement_ids: [REQ-DAILYPLAN-008]
  category: Negative
  title: Signed out, no active exam, and offline each get their own answer
  objective: >
    Verify the three non-plan states are distinguishable: signed out invites signing in, no active
    exam invites choosing one, and an unreachable server offers a retry.
  systems: [Mobile]
  status: Ready
  notes: "Signed out is a real state, not a degraded one — the plan is stored server-side and has no local equivalent."
