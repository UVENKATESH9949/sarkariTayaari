- id: SCN-CATALOG-031
  requirement_ids: [REQ-CATALOG-016]
  category: Integration
  title: "Saving a section auto-adds its subjects to the exam syllabus (one-way)"
  objective: >
    Verify saving a section referencing a subject not currently in the exam's syllabus causes
    that subject to appear in a subsequent GET /api/exams/{code}/subjects call, and deleting
    that section afterward does NOT shrink the syllabus back down.
  systems: [Backend]
  status: Ready
  notes: null

- id: SCN-CATALOG-032
  requirement_ids: [REQ-CATALOG-017]
  category: Positive
  title: Deleting a stage cascades to its papers and sections with zero orphans
  objective: >
    Verify deleting a stage removes all its descendant papers and sections, with no orphaned
    rows left behind (confirmed via a direct API check after deletion).
  systems: [Backend, Admin]
  status: Ready
  notes: null

- id: SCN-CATALOG-033
  requirement_ids: [REQ-CATALOG-001, REQ-CATALOG-017]
  category: Ambiguous
  title: Deleting an exam that still has stages/structure — behavior undetermined
  objective: >
    Determine what actually happens when DELETE /api/exams/{code} is called on an exam that
    still has stages/papers/sections referencing it: a clean 400, a raw 500 from an
    unenforced FK violation, or silent success. No source documents the expected outcome.
  systems: [Backend]
  status: Ambiguous
  notes: >
    Per qa/requirements/_conflicts.md §3 — this is a genuine, previously-unresolved gap, not
    a guess. Do NOT pre-assert a specific status code as "expected"; record whatever
    execution actually observes and flag it for a product/engineering decision on the correct
    contract, not as a pass/fail against an invented expectation.

- id: SCN-CATALOG-034
  requirement_ids: [REQ-CATALOG-018]
  category: Positive
  title: Admin structure read returns every stage version with correct active flags
  objective: >
    Verify that for an exam with 2+ versions of the same stage, the admin-only
