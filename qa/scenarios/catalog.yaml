- id: SCN-CATALOG-035
  requirement_ids: [REQ-CATALOG-019]
  category: Positive
  title: Public structure sync excludes any superseded stage version
  objective: >
    Verify GET /api/exam-structures never includes a superseded (non-current) stage version
    for an exam whose pattern has changed — every returned stage's `active` is effectively
