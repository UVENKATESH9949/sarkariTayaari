# CATALOG module — test scenarios (Phase 2)
#
# Every scenario references one or more qa/requirements/catalog.yaml requirement_ids.
# Scenarios flagged `status: Ambiguous` correspond to a requirement whose own `ambiguity`
# field is REQUIRES CLARIFICATION, or a gap recorded in qa/requirements/_conflicts.md — their
# expected result is deliberately NOT pre-asserted; execution establishes actual behavior.

- id: SCN-CATALOG-001
  requirement_ids: [REQ-CATALOG-001]
  category: Positive
  title: Full CRUD round trip for an exam with a unique code
  objective: >
    Verify create -> get -> update -> delete all succeed for an exam with a unique code, and
    the code (once set) acts as the stable identity throughout.
  systems: [Backend, Admin]
  status: Ready
  notes: null

- id: SCN-CATALOG-002
  requirement_ids: [REQ-CATALOG-001]
  category: Negative
  title: Duplicate exam code rejected
  objective: Verify creating a second exam with an already-used code is rejected with 400.
  systems: [Backend]
  status: Ready
  notes: null

- id: SCN-CATALOG-003
  requirement_ids: [REQ-CATALOG-001, REQ-CATALOG-021]
  category: Authorization
  title: Exam read/write authorization split
  objective: >
    Verify GET /api/exams (active list) succeeds with no token; GET /api/exams/all, GET
    /api/exams/{code} (single), and all writes require a valid admin token, rejecting
    anonymous (401) and student (403) callers.
  systems: [Backend, Admin]
  status: Ready
  notes: null

- id: SCN-CATALOG-004
  requirement_ids: [REQ-CATALOG-002]
  category: Boundary
  title: Blank difficulty/badge normalizes to null; unknown code rejected
  objective: >
    Verify sending an empty string for difficulty or badge stores null (not an error), while
    a non-blank, unrecognized code is rejected with 400.
  systems: [Backend]
  status: Ready
  notes: null

- id: SCN-CATALOG-005
  requirement_ids: [REQ-CATALOG-003]
  category: Ambiguous
  title: Exam category accepts any string with no server-side enum enforcement
  objective: >
    Verify any string value for `category` (including one outside the admin UI's fixed
    dropdown) is accepted and persisted without validation via a direct API call.
  systems: [Backend]
  status: Ambiguous
  notes: >
    REQ-CATALOG-003's own ambiguity field asks whether the backend SHOULD enforce the admin
    dropdown's fixed list. This scenario documents current (accepted) behavior as-is; it is
    not asserting this is the intended long-term contract.

- id: SCN-CATALOG-006
  requirement_ids: [REQ-CATALOG-004]
  category: Positive
  title: Exam Discovery sort options produce correct ordering
  objective: >
    Verify each of the six documented sort values (DEADLINE, EXAM_DATE, NEWLY_ANNOUNCED,
    RECENTLY_UPDATED, POPULAR, ALPHABETICAL) returns results in the documented order.
  systems: [Backend, Mobile]
  status: Ready
  notes: null

- id: SCN-CATALOG-007
  requirement_ids: [REQ-CATALOG-004]
  category: Positive
  title: CLOSING_SOON status filter returns only open exams within the 14-day window
  objective: >
    Verify status=CLOSING_SOON returns exams whose status is APPLICATION_OPEN/
    APPLICATION_CLOSING_SOON AND whose deadline is within 14 days, and no others.
  systems: [Backend, Mobile]
  status: Ready
  notes: null

- id: SCN-CATALOG-008
  requirement_ids: [REQ-CATALOG-004]
  category: Validation
  title: Unknown sort value rejected
  objective: Verify an unrecognized `sort` query value returns 400.
  systems: [Backend]
  status: Ready
  notes: null

