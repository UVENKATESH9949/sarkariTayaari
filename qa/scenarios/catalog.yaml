  requirement_ids: [REQ-CATALOG-019]
  category: Boundary
  title: Active exam with zero defined structure still appears with an empty stages array
  objective: >
    Verify an active exam that has no stage/paper/section defined at all still appears in
    GET /api/exam-structures with stages: [], not omitted.
  systems: [Backend, Mobile]
  status: Ready
  notes: null

- id: SCN-CATALOG-037
  requirement_ids: [REQ-CATALOG-020]
  category: Positive
  title: Exam badge active/all split
  objective: >
    Verify an inactive badge appears in GET /api/exam-badges/all but not in the public
    active-only list.
  systems: [Backend, Admin, Mobile]
  status: Ready
  notes: null

- id: SCN-CATALOG-038
  requirement_ids: [REQ-CATALOG-021]
  category: Authorization
  title: Full catalog public-vs-admin auth sweep
  objective: >
    Verify every documented public catalog endpoint (exams, subjects, topics, difficulty
    levels, paper types, exam badges, exam structures, exam discovery) returns 200 with no
    Authorization header, and every write/admin-only-read endpoint returns 401 anonymous /
    403 non-admin — a single cross-cutting pass across the whole module rather than
    re-verifying auth per entity (already covered individually by SCN-CATALOG-003 and
    similar per-entity scenarios).
  systems: [Backend]
  status: Ready
  notes: >
    Deliberately broader/cross-cutting rather than duplicating each entity's own admin-gate
    check — see the Phase 2 report's duplication-avoidance notes.

- id: SCN-CATALOG-039
  requirement_ids: [REQ-CATALOG-022]
  category: Offline
  title: Full catalog sync enables complete offline Practice/Mock Test browsing
  objective: >
    Verify that after a full reference-data sync and going fully offline, Practice's subject
    list, the Levels screen, and Mock Test's paper list all render correctly using only local
    SQLite data, with no live network dependency.
  systems: [Mobile]
  status: Ready
  notes: null

- id: SCN-CATALOG-040
  requirement_ids: [REQ-CATALOG-023]
  category: Positive
  title: Sectionally-timed paper's Start screen shows accurate limits and correct total
  objective: >
    Verify the Mock Test Start screen displays each section's own time limit correctly and
    the total countdown equals their sum, for a paper with sectionally-timed sections.
  systems: [Mobile]
  status: Ready
  notes: >
    Do NOT write this scenario to assert per-section lock/auto-advance enforcement during the
    actual test — REQ-CATALOG-023 documents that as a confirmed, disclosed gap, not something
    to test as if it were built. This scenario only covers the documented display/total-
    duration correctness.

- id: SCN-CATALOG-041
  requirement_ids: [REQ-CATALOG-024]
  category: Positive
  title: Admin structure editor shows inherited values correctly, never a blank cell
  objective: >
    Verify a section left without its own duration/marks shows "shares paper"/"inherited" in
    the admin editor, not a blank field.
  systems: [Admin]
  status: Ready
  notes: null

- id: SCN-CATALOG-042
  requirement_ids: [REQ-CATALOG-024, REQ-CATALOG-017]
  category: Recovery
  title: Deleting a stage through the admin UI leaves zero orphaned papers/sections
  objective: >
    Verify the admin structure editor's delete-with-confirmation flow, when used on a stage,
    results in zero orphaned papers/sections — the UI-level confirmation of the backend
    cascade already covered by SCN-CATALOG-032.
  systems: [Admin]
  status: Ready
  notes: null

- id: SCN-CATALOG-043
  requirement_ids: [REQ-CATALOG-020]
  category: Ambiguous
  title: An exam's badge/difficulty code that no longer resolves — client fallback undetermined
  objective: >
    Determine what mobile/admin actually render for an exam whose `badge` (or `difficulty`)
    code was valid at assignment time but has since been deactivated/removed from the
    lookup table — no source documents an expected fallback (blank pill? hidden badge?
    a rendering error?).
  systems: [Backend, Mobile, Admin]
  status: Ambiguous
  notes: >
    Per REQ-CATALOG-020's ambiguity field — record the actual observed rendering rather than
    asserting a guessed expectation.

- id: SCN-CATALOG-044
  requirement_ids: [REQ-CATALOG-025]
  category: Positive
  title: Switching the active exam updates Home without a restart
  objective: >
    Confirm a switch made from any entry point persists, shows a blocking transition for only as
    long as the work takes, and leaves Home showing the new exam with no stale data from the old.
  systems: [Mobile]
  status: Ready
  notes: >
    This is the regression guard for the two original bugs: Home never heard about a change made
    on another screen, and the followed exam Home displayed was whichever row an unordered query
    happened to return.

- id: SCN-CATALOG-045
  requirement_ids: [REQ-CATALOG-025]
  category: Edge case
  title: My Exams survives switching, and the active exam survives removal and restart
  objective: >
    Confirm switching never removes an exam from My Exams, that removing the active exam promotes
    another deterministically, and that the choice is still in force after an app restart and
    while offline.
  systems: [Mobile]
  status: Ready
  notes: >
    Removing the last exam leaves no active exam until the next sync, because ensureExamFollowed
    auto-follows the first exam again -- existing behaviour, not a rule introduced here.

- id: SCN-CATALOG-049
  requirement_ids: [REQ-CATALOG-048]
  category: Offline
  title: The Exams tab renders a stored catalogue, with countdowns counted for today
  objective: >
    Verify the tab opens from the snapshot, survives having no connection, and that the deadline
    countdowns are recomputed rather than replayed stale.
  systems: [Mobile]
  status: Ready
  notes: >
    TESTING THIS CORRECTLY IS NOT OBVIOUS - three attempts were invalid before one was not. See the
    test case's remarks: tab screens stay mounted, and 10.0.2.2 bypasses adb reverse.

