# AUTH module — defects
#
# Empty by design. A defect record is created ONLY when a real test execution fails
# (qa/execution/*.yaml records status: Fail) and someone determines it represents a genuine
# product defect, not an environment issue or a known/documented deviation. Never fabricated
# ahead of a real execution.
#
# Schema (for when the first real defect is logged):
# - id: DEF-AUTH-NNN
#   title: <short summary>
#   severity: Critical|High|Medium|Low
#   status: Open|Fixed|WontFix|Duplicate
#   found_in_execution: EXEC-AUTH-NNNN
#   test_case_id: TC-AUTH-NNN
#   requirement_ids: [REQ-AUTH-NNN]
#   description: <what was observed vs. what the requirement expected>
#   external_ref: null   # e.g. a Jira key, if/when an external tracker is connected
#   remarks: null


- id: DEF-AUTH-001
  title: "The one-time code attempt cap did nothing - every wrong guess was free"
  severity: Critical
  status: Fixed
  found_in_execution: EXEC-AUTH-0001
  test_case_id: TC-AUTH-028
  requirement_ids: [REQ-AUTH-015]
  description: >
    EmailOtpService.verifyCode incremented attempt_count before comparing the code, then reported
    a wrong guess by throwing UnauthorizedException. That is a RuntimeException, so Spring rolled
    the transaction back and undid the increment. attempt_count never left 0, the five-attempt cap
    never engaged, and a six-digit code could be brute-forced without limit.
  external_ref: null
  remarks: >
    Nothing failed loudly - each wrong guess returned the correct 401, so from outside the
    behaviour looked right. It only shows if you guess wrongly five times and THEN submit the
    correct code. The code's own comment asserted the opposite, reasoning that the handler mapping
    the exception to a 401 meant no rollback; what an exception is later mapped to has nothing to
    do with whether the transaction commits. Fixed with
    @Transactional(noRollbackFor = UnauthorizedException.class) before the feature was ever
    committed or deployed. Removing that annotation silently disables the cap again.

- id: DEF-AUTH-002
  title: "Code input showed a grey strip and a speck of hidden text behind the six boxes"
  severity: Low
  status: Fixed
  found_in_execution: EXEC-AUTH-0008
  test_case_id: TC-AUTH-035
  requirement_ids: [REQ-AUTH-017]
  description: >
    After a wrong code was auto-submitted, a grey band appeared behind all six boxes and a tiny
    speck of the hidden field's text showed in the first box.
  external_ref: null
  remarks: >
    Found on the emulator the same day the input was written. Two causes: the tappable wrapper took
    keyboard focus and Android painted its default focus highlight (fixed with focusable={false}),
    and the hidden text field was fully opaque (now opacity 0.011, which still receives taps and
    long-press paste). Re-verified by screenshot and by a focus dump showing only the text field
    focused.
