# ROADMAP module — defects
#
# Empty by design. A defect here must trace to a real failed execution in qa/execution/, never to
# a bug found while writing the code — those are fixed in the same change and written up in the
# report. See qa/defects/auth.yaml for the schema.
#
# Two things found while building this phase are deliberately NOT recorded as defects, because
# neither was a fault in shipped behaviour:
#
#   1. A fixture saving a RecruitmentCycle straight through its repository hit a NOT NULL violation
#      on created_at — that entity has no @PrePersist, and the real write path stamps it in
#      ExamGuideService. A test-fixture bug, fixed in the fixture.
#   2. Two of this phase's own tests failed on their first real run, and in both cases the service
#      was right and the test was wrong: one assumed the shared dev database held no cohort timings
#      (it holds 53 timed attempts at the easiest difficulty), the other miscounted its own fixture.
#      Recorded in the execution file as the real Fail results they were, and in the report.

