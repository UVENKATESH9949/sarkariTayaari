- id: REQ-ONBOARDING-013
  feature: CONTENT languages -- one or two, chosen independently of the app language
  module: ONBOARDING
  system: [Mobile]
  source_doc: Supplied onboarding brief (revised)
  source_section: "§4-§7 Content/data languages; §13 content-language data model"
  description: >
    Step 3 asks which languages the student wants their QUESTIONS and study content in. The list
    comes from the synced `languages` table -- the app's real supported-content-language
    configuration -- and the student picks at least one and at most two, stored as an ordered
    list in `content_language_preferences` (one row per language), never as a delimited string.
    The first selection is the language screens default to. This is independent of the app
    language chosen in REQ-ONBOARDING-004; neither is derived from the other.
  business_rule: >
    The cap is a data-volume decision, not a preference: ~1 lakh questions across ~10 languages
    is ~10 lakh language-specific records, and every extra language a device opts into is another
    full translation set to sync and store. Two covers the realistic cases (English plus a mother
    tongue). The two language concepts must stay separate because their supported sets genuinely
    differ -- Hindi has question content and no UI catalogue at all, so a Hindi-studying student
    is unservable if the two are conflated.
  actor: "First-time student"
  preconditions:
    - Onboarding step 3 is on screen
  inputs:
    - "One or two codes from the synced `languages` table"
  expected_outputs:
    - "content_language_preferences holds one row per chosen language, ordered by choice"
    - "The first chosen language becomes the default question language"
  validations:
    - "Zero selected is rejected -- Continue stays disabled"
    - "A third selection is REFUSED with a message; the existing two are left untouched"
    - "An unsupported or duplicated code is rejected"
  permissions: "None"
  dependencies:
    - REQ-ONBOARDING-004
  error_conditions:
    - "EMPTY when none selected; TOO_MANY when more than two; UNSUPPORTED for an unknown or duplicate code"
  edge_conditions:
    - "Nothing is auto-deselected at the cap -- the student chooses which one to give up"
    - "Deselecting down to zero is allowed; Continue then blocks until one is chosen again"
    - "A device whose `languages` table has not synced shows an honest empty state and can continue"
  offline_behavior: >
    The stored selection is device-local and never synced. The offered list needs the reference
    sync; with no list the step says so rather than blocking onboarding.
  acceptance_criteria:
    - Selecting English alone is valid; English + Telugu is valid
    - Attempting a third shows "You can select up to 2 languages." and changes nothing
    - App language Telugu with content languages English + Telugu works, and so does app language English with content languages Hindi + Telugu
    - The chosen languages survive an app restart
  priority: Critical
  status: Active
  ambiguity: >
    SCOPE BOUNDARY, stated rather than left implicit. This requirement covers CAPTURING and
    STORING the preference only. The brief's §14 explicitly defers multilingual question sync,
    filtering, fallback and rendering, so none of that is implemented and none of it is asserted
    here. What is guaranteed is that the stored shape is directly queryable by that future system.
