- id: REQ-CATALOG-017
  feature: Exam structure cascade-delete semantics (asymmetric)
  module: CATALOG
  system: [Backend, Admin]
  source_doc: api/CONTENT-CATALOG.md
  source_section: "DELETE /api/exam-stages/{id}, /api/exam-papers/{id}, /api/exams/{code}"
  description: >
    Deleting a stage cascades to its papers and their sections (pure composition, meaningless
    alone). Deleting a paper cascades to its sections. Deleting an exam does NOT cascade into
    its stages/structure at all — the delete-exam endpoint has no explicit application-level
    guard and relies purely on the database's own FK behavior.
  business_rule: >
    Deliberate asymmetry — structure levels (stage->paper->section) are pure composition and
    safe to cascade; an exam with real structure/content underneath should not be silently
    destroyable in one call.
  actor: Admin
  preconditions:
    - Target row exists
  inputs:
    - "none (path id only)"
  expected_outputs:
    - "204 No Content on success; for stage/paper deletes, all descendant papers/sections are also gone"
  validations:
