- id: REQ-CATALOG-025
  feature: One active exam out of several followed, with every screen agreeing on which
  module: CATALOG
  system: [Mobile]
  source_doc: mobile/src/examsModule/activeExamContext.tsx
  source_section: "ActiveExamProvider / setActiveExam"
  description: >
    My Exams (the followed set, many) and the Active Exam (the one driving Home and every
    exam-scoped screen) are separate concepts. My Exams stays in the synced `followed_exams`
    table; the active exam is a device-local choice in `app_preferences.active_exam_code`,
    resolved against the live followed list on every read. One provider owns both, and every
    switching affordance in the app calls its single `setActiveExam` operation.
  business_rule: >
    Switching the active exam must never change My Exams. Changing it anywhere must be visible
    everywhere immediately, with no sync, no navigation trick and no app restart. The stored code
    is never trusted blindly: an exam that has been unfollowed, or has not synced to this device,
    falls back to the most recently followed exam and that resolution is written back.
  actor: Student (signed in or not)
  preconditions:
    - At least one exam is followed (a fresh install auto-follows one after its first sync)
  inputs:
    - "an exam code that is present in My Exams"
  expected_outputs:
    - "active_exam_code persisted; provider state updated; every exam-scoped screen re-rendered for the new exam"
  validations:
    - A code that is not in My Exams is refused and the active exam is unchanged
    - Switching to the already-active exam is a no-op with no overlay
    - Exactly one exam can be active, structurally (a single preferences row, not a flag per exam)
  permissions: none (device-local; no request is made to change the active exam)
  dependencies:
    - REQ-CATALOG-021
  error_conditions:
    - "A failed prefetch does not fail or revert the switch -- the exam is already followed locally"
  edge_conditions:
    - "Offline: the switch completes from local data; no network call is required"
    - "The active exam is unfollowed: the most recently followed remaining exam is promoted"
    - "The last exam is unfollowed: no active exam until the next sync auto-follows one again"
    - "An exam followed on another device arrives by sync: it joins My Exams and does not steal Active"
  offline_behavior: >
    Fully functional offline. The active exam is device-local, so changing it needs no request;
    only the best-effort warm-up of the new exam guide/plan data is skipped or fails silently.
  acceptance_criteria:
    - Home shows the new exam immediately after the switching transition, with no restart
    - My Exams is unchanged by a switch and marks exactly one exam Active
    - The active exam survives an app restart
    - Every switching entry point goes through the same operation
  priority: High
  status: Active
  ambiguity: >
    Deliberately device-local, so switching on one phone does not move the active exam on
    another; My Exams still syncs across both. Making it account-wide would need a backend column
    and an API change, which this work did not take on.
  automation_status: ManualOnly
  automation_hint: "No automated UI test runner exists for mobile in this project"

- id: REQ-CATALOG-048
  feature: The Exams tab keeps a snapshot of the catalogue the server returned
  module: CATALOG
  system: [Mobile]
  source_doc: reports/42-daily-plan-snapshot-cache/daily-plan-snapshot-cache.md
  source_section: "The same treatment for the Exams tab"
  description: >
    The first page of GET /api/exams/discover is stored in the local `remote_snapshots` table
    (migration 0031), keyed by sort and category. Opening the Exams tab renders any stored page
    immediately and refreshes in the background; a screen showing a snapshot says so with the time
    it was taken. Later pages ("load more") are always live and never cached.
  business_rule: >
    Same architecture as the daily plan and the same rule: the device stores and displays what the
    server decided, and never derives a catalogue itself. `daysUntilDeadline` and `closingSoon` are
    the exception and are RE-DERIVED on the device, because both are computed relative to the
    moment the server answered - replay them from a stale snapshot and a card reads
    "closes in 12 days" when it is really 8, and `closingSoon` files the exam under the wrong
    section heading entirely. The re-derivation mirrors ExamDiscoveryService exactly, including
    its fourteen-day threshold.
  actor: Any student, signed in or signed out
  preconditions:
    - "One successful discover fetch has happened for that sort and category"
  inputs:
    - "Opening the Exams tab, or changing sort or category"
  expected_outputs:
    - "A stored page renders without waiting on the network"
    - "Countdowns and the closing-soon flag are correct for today, not for when the snapshot was taken"
    - "The snapshot state is labelled with the time it was taken"
  validations:
    - "The key includes sort and category, so each filter keeps its own snapshot"
    - "Only page 0 is cached"
  permissions:
    - "None - discover is a public endpoint taking no token"
  dependencies: [REQ-DAILYPLAN-014]
  error_conditions:
    - "A failed refresh must not replace a usable catalogue with an error"
  edge_conditions:
    - >
      NO USER IN THE KEY, deliberately. The payload contains nothing personal - follow state lives
      in the local followed_exams table and never travels in it - so keying by user would fragment
      one shared answer per account for no benefit. This is why sign-out clears only the
      `daily-plan` namespace and leaves `exams-discover` alone.
    - "A card with no applicationEnd keeps the server's null/false, which do not decay"
  offline_behavior: "A stored page is readable and browsable with no connection"
  acceptance_criteria:
    - "A second open renders the catalogue without a loading state"
    - "Offline, a stored catalogue still renders, labelled"
    - "Countdowns shown from a snapshot are counted for today"
  priority: Medium
  status: Active
  ambiguity: null
  automation_status: ManualOnly
  automation_hint: "No mobile runner. The countdown re-derivation in examDiscoveryData.ts is pure and would be unit-testable."

