    note when the section doesn't override it. Delete actions cascade with a confirming
    dialog, and each entity form uses the parent's values as placeholders (e.g. "inherits 2")
    to make the fallback obvious while editing.
  business_rule: >
    Exam-domain data is fully admin-editable (nothing hardcoded); the editor's own
    structure/sidebar/routing stays in code, per the phase's explicit scope line.
  actor: Admin
  preconditions:
    - "Admin signed in, viewing /exams/:examCode/structure"
  inputs:
    - "UI form interactions (create/edit/delete at stage/paper/section level)"
  expected_outputs:
    - >
      Correct inherited-vs-overridden display; a derived "N Q in sections" count per paper so
      an author can see whether section question counts add up to the paper's intended total
  validations:
    - >
      Client-side MAX_LENGTHS enforcement (mirrors DB column widths, since the backend
      returns an unmapped 500, not a 400, when exceeded — a real gap, see _conflicts.md) plus
      whatever server-side validation is echoed back from REQ-CATALOG-013 through 017
  permissions: "Admin-console route, gated by the same admin auth as the underlying API (REQ-CATALOG-021)"
  dependencies:
