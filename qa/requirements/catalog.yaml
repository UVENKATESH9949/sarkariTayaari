  permissions: requireAdmin
  dependencies:
    - REQ-CATALOG-013
    - REQ-CATALOG-014
    - REQ-CATALOG-015
    - REQ-CATALOG-001
  error_conditions:
    - "404 \"Stage not found\" / \"Paper not found\" / \"Exam not found\""
    - >
      Deleting an exam with existing stages: behavior is untested/undocumented (see
      _conflicts.md) — likely a raw DB FK-violation 500 rather than a clean 400.
  edge_conditions:
    - >
      Deleting a section does not retract its earlier auto-add to the syllabus
      (REQ-CATALOG-016) — the one documented non-cascading direction that's intentional,
      distinct from the exam-delete gap which is undocumented.
  offline_behavior: "n/a (admin-only mutation; the effect is observable in the next mobile sync of REQ-CATALOG-019)."
  acceptance_criteria:
    - Deleting a stage removes its papers and sections with zero orphaned rows (confirmed
