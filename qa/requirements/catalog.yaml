# CATALOG module — requirement repository
#
# Scope: exams, subjects, topics, languages, difficulty levels, paper types, exam structure
# (stage -> paper -> section), exam<->subject syllabus, exam badges.
# Primary source: api/CONTENT-CATALOG.md. Secondary: reports/05-exam-structure-model/*,
# reports/04-content-model-redesign/*, ADR-004/005/009.
#
# Scoping note (Phase 1B decision, not left as an open ambiguity): REQ-CATALOG-006/008/009
# (exam topic weightage, topic hierarchy, topic prerequisites) originate from work internally
# labeled "Epic L topic model" (TICKET-2101-2103), but are INCLUDED here because
# api/CONTENT-CATALOG.md documents these endpoints directly as catalog contract, and they are
# structural/curation data (admin-curated weightage, hierarchy, prerequisite DAG), not computed
# intelligence (trend/priority/mastery/PYQ scoring, which lives in the separate
# api/EXAM-INTELLIGENCE.md and is correctly excluded). See qa/requirements/_conflicts.md.
#
# A requirement here represents the INTENDED/documented behavior, not necessarily whatever the
# code currently does if the two diverge — see the `ambiguity` field per requirement.

- id: REQ-CATALOG-001
  feature: Exam entity CRUD, code as immutable identity, active-only public read
  module: CATALOG
  system: [Backend, Admin, Mobile]
  source_doc: api/CONTENT-CATALOG.md
  source_section: "ExamController (POST/GET/GET-all/PUT/DELETE /api/exams)"
  description: >
    An exam is created/updated/deleted by an admin with `code` (e.g. SSC_CGL) as the
    human-chosen, immutable primary key — not a generated id. GET /api/exams returns only
    active==true exams ordered by displayOrder and is public; GET /api/exams/all returns
    every exam (incl. inactive) and requires admin; GET /api/exams/{code} (single) requires
    admin even though the full active list is public.
  business_rule: >
    `code` is chosen once and never changes identity. Public active-list exists specifically
    so a signed-out mobile client can sync exam content (ADR-009).
  actor: "Admin (writes, single-get, all-list); Anonymous/Student (active list)"
  preconditions:
    - Admin bearer token for writes/all-list/single-get
  inputs:
    - "{ code, name, imageUrl?, active, displayOrder, difficulty?, badge?, category? }"
  expected_outputs:
    - "201 with ExamResponse on create; 200 with list/single on reads; 200 ExamResponse on update; 204 on delete"
  validations:
    - "Blank code/name rejected (400)"
    - "Duplicate code rejected (400 \"Exam code already exists: <code>\")"
  permissions: "requireAdmin on create/update/delete/get-single/get-all; no auth on active list"
  dependencies:
    - REQ-AUTH-008
  error_conditions:
    - "400 blank fields"
    - "400 duplicate code"
    - "404 \"Exam not found: <code>\" on get/update/delete of unknown code"
    - "401/403 on admin endpoints without proper auth"
  edge_conditions:
    - "Deleting an exam that still has stages/subjects linked has no application-level guard — relies on the DB's own FK behavior, which is untested/undocumented (see _conflicts.md)"
  offline_behavior: >
    Active exam list is synced to mobile local SQLite for full offline browsing (Home screen
    cards). Single-exam get and all-exams list are admin-console-only, not synced.
  acceptance_criteria:
    - Given an admin token, creating an exam with a unique code succeeds and is retrievable
    - Given a duplicate code, creation is rejected with 400
    - The public list never includes an inactive exam
    - A non-admin/no-token request to any write or the all-list/single-get endpoint is rejected 401/403
  priority: Critical
  status: Active
  ambiguity: null
  automation_status: Automated
  automation_hint: >
    ExamCrudTest.createThenGet_returnsSameData, listActive_onlyIncludesActiveExams,
    listAll_includesInactiveExams, update_changesFields, delete_removesExam

- id: REQ-CATALOG-002
  feature: Exam optional difficulty/badge FK validation and null normalization
  module: CATALOG
  system: [Backend, Admin, Mobile]
  source_doc: api/CONTENT-CATALOG.md
  source_section: "POST/PUT /api/exams"
  description: >
    `difficulty` and `badge` on an exam are optional foreign keys into difficulty_levels /
    exam_badges. A blank string in either field is normalized to null (not a constraint
    violation); a non-blank value that doesn't match an existing row is rejected.
  business_rule: >
    Keeps exam styling data-driven (colors/icons resolved via the referenced lookup row)
    rather than hardcoded per exam.
  actor: Admin
  preconditions:
    - "Referenced difficulty_levels/exam_badges rows must exist if non-blank"
  inputs:
    - "difficulty?: string"
    - "badge?: string"
  expected_outputs:
    - "Round-trips the stored code; null when blank was sent"
  validations:
    - "Unknown code -> 400"
  permissions: "requireAdmin (part of exam create/update)"
  dependencies:
    - REQ-CATALOG-011
    - REQ-CATALOG-020
  error_conditions:
    - "400 \"Unknown difficulty: <value>\""
    - "400 \"Unknown badge: <value>\""
  edge_conditions:
    - Empty string vs omitted field both normalize to null
  offline_behavior: >
    Resolved codes sync as part of the exam record; mobile resolves badge/difficulty styling
    against its own synced badge/difficulty-level tables.
  acceptance_criteria:
    - "Creating/updating an exam with difficulty: \"\" stores null, not an error"
    - With an unknown code, returns 400 with the exact message format
  priority: High
  status: Active
  ambiguity: null
  automation_status: Automated
  automation_hint: >
    ExamCrudTest.difficultyAndBadge_defaultToNullAndRoundTrip,
    blankDifficultyOrBadge_clearsRatherThanFailing

- id: REQ-CATALOG-003
  feature: "Exam category facet (free string, not DB-enforced)"
  module: CATALOG
  system: [Backend, Admin, Mobile]
  source_doc: api/CONTENT-CATALOG.md
  source_section: "POST /api/exams business rules"
  description: >
    `category` is a plain string field on an exam (SSC/Banking/Railways/UPSC/State
    Government/Teaching/Defence/Police/Insurance/Other in the admin's fixed dropdown) used as
    a filter facet in Exam Discovery, but it is not a lookup table and not DB-enforced — no
    styling, no referential integrity.
  business_rule: "Deliberately lighter-weight than difficulty/badge since it carries no per-value visual styling."
  actor: Admin
  preconditions: []
  inputs:
    - "category?: string"
  expected_outputs:
    - Stored/echoed verbatim
  validations:
    - "None server-side (the fixed dropdown is admin-UI-only convention, not a backend constraint)"
  permissions: "requireAdmin (part of exam create/update)"
  dependencies:
    - REQ-CATALOG-004
  error_conditions: []
  edge_conditions:
    - A value outside the admin's fixed dropdown list can still be saved via direct API call
      (no server-side enum check) — could produce a category the discovery filter can't
      sensibly group
  offline_behavior: "Synced with the exam record."
  acceptance_criteria:
    - Any string value for category is accepted and persisted without validation
  priority: Low
  status: Active
  ambiguity: >
    REQUIRES CLARIFICATION: whether the backend should enforce the same fixed category list
    the admin UI dropdown offers, given a bypass via direct API call is currently possible.
  automation_status: CandidateForAutomation
  automation_hint: "none found"

- id: REQ-CATALOG-004
  feature: "Exam Discovery listing: pagination, sort, status/category filter, computed fields"
  module: CATALOG
  system: [Backend, Mobile]
  source_doc: api/CONTENT-CATALOG.md
  source_section: "GET /api/exams/discover"
  description: >
    A separate, richer public listing endpoint for the Exams tab — returns active exams as
    cards with pagination, six sort options, a status filter (including the synthetic
    CLOSING_SOON bucket), and a case-insensitive category filter. Each card carries
    recruitment-cycle-derived fields (status, closingSoon, deadline dates, vacancyCount,
    primaryAction) which are null when the exam has no current published cycle.
  business_rule: >
    closingSoon is true only when status is APPLICATION_OPEN/APPLICATION_CLOSING_SOON AND the
    deadline is within 14 days — a threshold deliberately duplicated (not shared) with
    mobile's own priorityTier() urgency logic so both sides independently agree on "urgent."
    Sort/filter/page currently happen in Java over the full active-exam set (not SQL) — a
    stated, scale-appropriate implementation detail for ~11 exams, not a contract guarantee.
  actor: Anonymous/Student
  preconditions: []
  inputs:
    - "page (default 0)"
    - "size (default 20)"
    - "sort (DEADLINE|EXAM_DATE|NEWLY_ANNOUNCED|RECENTLY_UPDATED|POPULAR|ALPHABETICAL, default ALPHABETICAL)"
    - "status (a RecruitmentCycleStatus name or CLOSING_SOON)"
    - category
  expected_outputs:
    - "PagedExamCards { content: ExamCardResponse[], page, size, totalElements, hasMore }; each card includes primaryAction (APPLY_NOW|PREPARE_NOW|VIEW_EXAM|VIEW_RESULT_INFO), computed server-side"
  validations:
    - sort must match a known enum value
  permissions: none (public)
  dependencies:
    - REQ-CATALOG-003
  error_conditions:
    - "400 IllegalArgumentException on an unrecognized sort value"
  edge_conditions:
    - An exam with no current published cycle still appears, with all cycle-derived fields null
  offline_behavior: >
    Not part of the offline-synced reference-data set — this is a live-fetch listing endpoint
    (mobile's Exams tab issues a fresh request per sort/category change; segmented
    tab/search filtering is client-side over one fetched page).
  acceptance_criteria:
    - Sorting by each of the six options produces the documented order
    - "Filtering by status=CLOSING_SOON returns only open-status exams within 14 days of deadline"
    - An unknown sort value returns 400
  priority: High
  status: Active
  ambiguity: null
  automation_status: CandidateForAutomation
  automation_hint: >
    ExamDiscoveryTest exists per memory/STATUS.md (sort orders, category filter,
    CLOSING_SOON bucket, pagination boundaries) — file not among the instructed test files
    for this extraction, not directly inspected; treat as CandidateForAutomation until
    verified, not Automated.

- id: REQ-CATALOG-005
  feature: "Exam syllabus (exam_subjects): get/replace, admin-only"
  module: CATALOG
  system: [Backend, Admin]
  source_doc: api/CONTENT-CATALOG.md
  source_section: "GET/PUT /api/exams/{code}/subjects"
  description: >
    Every exam has a syllabus — the set of subjects it covers — independent of whether a
    paper pattern (stage/paper/section) exists. Read returns the current syllabus; write does
    a full wholesale replace (an empty array clears it).
  business_rule: >
    ADR-004: the syllabus is a distinct concept from paper-layout subjects (section_subjects,
    REQ-CATALOG-015) and can be non-empty with zero stages/papers/sections defined. This is
    what allows a pattern-free exam to still have a syllabus for Practice browsing.
  actor: Admin
  preconditions:
    - Exam must exist
    - Supplied subjectIds must reference existing subjects
  inputs:
    - "GET: none. PUT: { subjectIds: uuid[] }"
  expected_outputs:
    - "SubjectResponse[] sorted by displayOrder then name, each including examCodes (reverse view)"
  validations:
    - "400 \"Unknown subjectId: <id>\" for any id that doesn't resolve"
  permissions: "requireAdmin on both GET and PUT (despite being non-sensitive data — see _conflicts.md)"
  dependencies:
    - REQ-CATALOG-007
  error_conditions:
    - 404 unknown exam code
    - 400 unknown subjectId
  edge_conditions:
    - An exam with a syllabus but zero paper structure is valid and expected
  offline_behavior: >
    Not directly synced via this endpoint — mobile instead receives the same data as
    syllabusSubjects embedded in GET /api/exam-structures (REQ-CATALOG-019).
  acceptance_criteria:
    - Setting an exam's syllabus to a list of subject ids and reading it back returns exactly those subjects
    - "Setting to [] clears it"
    - An unknown subject id in the payload is rejected wholesale (no partial apply)
  priority: High
  status: Active
  ambiguity: null
  automation_status: ManualOnly
  automation_hint: >
    none found (not covered by any instructed test file; verified only via manual/curl
    checks per exam-subject-syllabus.md)

- id: REQ-CATALOG-006
  feature: "Exam topic map / curated weightage (exam_topics): get/replace, admin-only"
  module: CATALOG
  system: [Backend, Admin]
  source_doc: api/CONTENT-CATALOG.md
  source_section: "GET/PUT /api/exams/{code}/topics"
  description: >
    Finer-grained than the syllabus (REQ-CATALOG-005) — which specific topics matter for an
    exam, with an admin-curated weightagePercent per topic. Full wholesale replace on write.
  business_rule: >
    weightagePercent is explicitly the admin's curated figure, distinct from any
    later-derived/computed weighting from PYQ data (which belongs to the separate Epic L /
    EXAM-INTELLIGENCE module, out of scope here). Admin-only "for now" per the controller's
    own comment — no mobile screen consumes it yet, so it's deliberately not exposed publicly.
  actor: Admin
  preconditions:
    - Exam and every referenced topicId must exist
  inputs:
    - "PUT: { topics: [{ topicId: uuid, weightagePercent?: decimal }] }"
  expected_outputs:
    - "ExamTopicResponse[]: { topicId, topicName, subjectId, subjectName, parentId, parentName, weightagePercent }"
  validations:
    - "400 \"Duplicate topicId in request\""
    - "400 \"Unknown topicId\""
  permissions: requireAdmin
  dependencies:
    - REQ-CATALOG-008
    - REQ-CATALOG-009
  error_conditions:
    - 404 unknown exam code (GET returns 404 rather than an empty list)
    - 400 duplicate/unknown topicId
  edge_conditions:
    - "weightagePercent omitted per entry means \"relevant, not yet weighted\" (not zero)"
  offline_behavior: "Not synced to mobile at all — admin-console-only surface today."
  acceptance_criteria:
    - Replacing the topic map with a duplicate topicId in the payload is rejected wholesale
    - A null-weightage entry round-trips as null, not 0
  priority: Medium
  status: Active
  ambiguity: >
    Boundary call with the Epic L topic-model work — see the module-level scoping note at the
    top of this file and qa/requirements/_conflicts.md item 1. Confirm this boundary if test-plan
    scoping is later revisited.
  automation_status: Automated
  automation_hint: >
    TopicModelTest.examTopics_replaceWholesaleAndCarryWeightage,
    examTopics_rejectDuplicateAndUnknownTopic

