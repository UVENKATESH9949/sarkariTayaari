    - REQ-CATALOG-014
    - REQ-CATALOG-015
    - REQ-CATALOG-017
    - REQ-CATALOG-018
  error_conditions:
    - >
      A raw 500 (not a friendly message) if a submitted field exceeds a DB column width the
      client-side MAX_LENGTHS list doesn't correctly mirror
  edge_conditions:
    - >
      Deleting a stage/paper through the UI must reflect the true cascade (REQ-CATALOG-017) —
      confirmed historically via a live create->delete->verify-zero-orphans pass
  offline_behavior: "n/a — Admin console has no offline mode."
  acceptance_criteria:
    - "A section left without its own duration/marks shows \"shares paper\"/\"inherited,\" not a blank"
    - Deleting a stage through the UI leaves zero orphaned papers/sections
