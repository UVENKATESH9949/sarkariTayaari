- id: REQ-CATALOG-008
  feature: Topic CRUD, per-subject scoping, and parent hierarchy with cycle prevention
  module: CATALOG
  system: [Backend, Admin, Mobile]
  source_doc: api/CONTENT-CATALOG.md
  source_section: "TopicController"
  description: >
    A topic belongs to exactly one subject and may optionally have a parent topic, forming a
    hierarchy. Name uniqueness is scoped per subject (case-insensitive), not global. Parent
    assignment is validated: a topic can't be its own parent, can't create a cycle, and must
    belong to the same subject as its parent.
  business_rule: >
    Hierarchy depth/cycles can't be expressed by a DB FK/CHECK constraint, so it's enforced
    server-side via DFS reachability.
  actor: "Admin (writes/single-get); Anonymous/Student (list)"
  preconditions:
    - Referenced subjectId must exist
    - "Referenced parentId (if any) must exist and belong to the same subject"
  inputs:
    - "{ subjectId, name, displayOrder, parentId?, prerequisiteTopicIds? }"
  expected_outputs:
    - "TopicResponse { id, subjectId, subjectName, name, displayOrder, parentId, parentName, prerequisiteTopicIds[] }; list ordered by displayOrder then name, optionally filtered by subjectId"
  validations:
    - Blank required fields
    - Unknown subjectId/parentId
    - Self-parent rejection
    - Hierarchy-cycle rejection
    - Cross-subject-parent rejection
    - Duplicate name-under-same-subject rejection
  permissions: "requireAdmin on create/get-single/update/delete; public on list"
  dependencies:
    - REQ-CATALOG-007
  error_conditions:
    - "400 \"Unknown subjectId\""
    - "400 \"Topic already exists under this subject\""
    - "400 \"Unknown parentId\""
    - "400 \"A topic cannot be its own parent\""
    - "400 \"That parent would create a cycle in the topic hierarchy\""
    - "400 \"A topic's parent must belong to the same subject\""
    - "404 \"Topic not found: <id>\""
  edge_conditions:
    - "Two topics with the same name under different subjects are both valid (uniqueness is per-subject)"
  offline_behavior: "Fully synced (optionally subject-scoped) for offline browsing."
  acceptance_criteria:
    - Assigning a parent from a different subject is rejected
    - Assigning a parent that would create even an indirect cycle is rejected
  priority: Critical
  status: Active
  ambiguity: >
    Boundary call with the Epic L topic-model work — see the module-level scoping note at the
    top of this file and qa/requirements/_conflicts.md item 1.
  automation_status: Automated
  automation_hint: >
    TopicCrudTest.createThenGet_returnsSameData, listBySubjectId_onlyReturnsThatSubjectsTopics,
    update_changesNameAndSubject; TopicModelTest.topicParent_roundTripsAndDefaultsToNull,
    topicCannotBeItsOwnParent, topicParentCycleIsRejected, parentFromAnotherSubjectIsRejected

- id: REQ-CATALOG-009
  feature: "Topic prerequisites (DAG) with \"null = unchanged, empty = clear\" semantics"
  module: CATALOG
  system: [Backend, Admin]
  source_doc: api/CONTENT-CATALOG.md
  source_section: "POST/PUT /api/topics business rules"
  description: >
    A topic can declare prerequisite topics (a DAG used for sequencing). prerequisiteTopicIds
    is a full-replacement list, but with a deliberate escape hatch: sending null leaves
    existing prerequisites untouched; sending [] clears them.
  business_rule: >
    The null-vs-empty distinction exists specifically so an older client that never sends the
    field can't silently wipe curated prerequisite edges. Cycles (direct or indirect) in the
    prerequisite graph are rejected via DFS reachability, same technique as REQ-CATALOG-008's
    hierarchy check but a separate graph.
  actor: Admin
  preconditions:
    - Every id in prerequisiteTopicIds must be an existing topic
  inputs:
    - "prerequisiteTopicIds?: uuid[]"
  expected_outputs:
    - "prerequisiteTopicIds[] on TopicResponse"
  validations:
    - Unknown prerequisite id
    - Self-prerequisite
    - Cycle (direct or indirect) in the prerequisite graph
  permissions: requireAdmin
  dependencies:
    - REQ-CATALOG-008
  error_conditions:
    - "400 \"Unknown prerequisiteTopicId\""
    - "400 \"A topic cannot be its own prerequisite\""
    - "400 cycle-rejection message"
  edge_conditions:
    - >
      Omitting the field entirely on an update must leave prerequisites unchanged — a client
      naively round-tripping a partial payload could otherwise wipe curated data
  offline_behavior: "Synced as part of the topic record (prerequisiteTopicIds)."
  acceptance_criteria:
    - Updating a topic without the prerequisiteTopicIds field preserves its existing prerequisites
    - "Sending [] explicitly clears them"
    - A request that would create even an indirect cycle across 3+ topics is rejected
  priority: High
  status: Active
  ambiguity: >
    Same Epic-L-boundary note as REQ-CATALOG-006/008 — see _conflicts.md item 1.
  automation_status: Automated
  automation_hint: >
    TopicModelTest.prerequisites_roundTripAndNullLeavesThemUnchanged,
    indirectPrerequisiteCycleIsRejected

