- id: REQ-CATALOG-013
  feature: Exam Stage CRUD with pattern versioning
  module: CATALOG
  system: [Backend, Admin]
  source_doc: api/CONTENT-CATALOG.md
  source_section: "POST/PUT/DELETE /api/exam-stages; TICKET-2108"
  description: >
    A stage (Prelims/Mains/Tier 1...) belongs to one exam. More than one stage row can share a
    name if they carry different versionLabels or different effectivity windows
    (effectiveFrom/effectiveTo) — this is how a pattern changes over time without losing
    history.
  business_rule: >
    effectiveFrom: null means "always applied" (true of every pre-versioning row); effectiveTo:
    null means "still current"; effectiveTo is inclusive. The response's active flag is
    server-resolved (whether today falls in the effectivity window) — no client computes this
    itself. Blank versionLabel normalizes to null (not ""), since the uniqueness constraint
    keys off coalesce(version_label,'').
  actor: Admin
  preconditions:
    - Referenced exam must exist
  inputs:
    - "{ examCode, name, displayOrder, effectiveFrom?, effectiveTo?, versionLabel? }"
  expected_outputs:
    - "ExamStageResponse { id, examCode, name, displayOrder, effectiveFrom, effectiveTo, versionLabel, active }"
  validations:
    - Unknown exam
    - "effectiveFrom after effectiveTo rejected"
    - Duplicate name+versionLabel combination on the same exam
  permissions: "requireAdmin (create/list/update/delete)"
  dependencies:
    - REQ-CATALOG-001
  error_conditions:
    - 404 unknown exam
    - "400 \"'Effective from' cannot be after 'effective to'.\""
    - "400 duplicate name/version message (varies by whether a version label was given)"
  edge_conditions:
    - Two stages with the same name are valid only if they differ in versionLabel or
      effectivity window
    - Blank vs null versionLabel must be treated identically for uniqueness
  offline_behavior: >
    The admin-only tree read (GET /api/exams/{examCode}/structure) returns every version; only
    the currently-effective stage syncs to mobile via GET /api/exam-structures
    (REQ-CATALOG-019).
  acceptance_criteria:
    - Creating a second stage with the same name but a different versionLabel succeeds
    - Creating one with an identical name+versionLabel (including both blank) fails 400
  priority: High
  status: Active
  ambiguity: null
  automation_status: PartiallyAutomated
  automation_hint: >
    ExamStructureTest covers general tree shape and cascade, not versioning specifics — no
    dedicated versioning test cited among the instructed test files.

