  expected_outputs:
    - "PaperSectionResponse { id, paperId, name, questionCount, durationMinutes, marksCorrect, marksWrong, displayOrder, subjects[] }; admin tree read additionally exposes effectiveMarksCorrect/effectiveMarksWrong/sectionallyTimed"
  validations:
    - Unknown paperId
    - Duplicate section name within paper (case-insensitive)
    - subjectIds must be non-empty
    - Every subjectId must resolve
