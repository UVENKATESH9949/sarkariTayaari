# QUESTIONS module — requirement repository
#
# Scope: exactly what api/QUESTIONS.md documents — question CRUD (with bilingual
# translations), the content-sync/live/counts/mock-sample endpoints, bulk import/delete,
# image upload, duplicate detection, question-type reference data.
# Explicitly NOT chased: api/QUESTION-GROUPS.md, api/QUESTION-INTELLIGENCE.md,
# api/EXAM-INTELLIGENCE.md, api/WEAKNESS-RADAR.md, api/AI-ADMIN.md — see _conflicts.md and
# the "Explicitly excluded" notes on individual requirements below for exactly where the
# line was drawn (e.g. PYQ provenance FIELDS are in scope since QUESTIONS.md documents them
# as core CRUD; what those fields feed into (Epic L trend/priority) is not).
#
# A requirement here represents the INTENDED/documented behavior, not necessarily whatever
# the code currently does if the two diverge — see the `ambiguity` field per requirement.

- id: REQ-QUESTIONS-001
  feature: Create a question (admin authoring)
  module: QUESTIONS
  system: [Backend, Admin]
  source_doc: api/QUESTIONS.md
  source_section: "POST /api/questions"
  description: >
    An admin can create a new question with its language-independent metadata (topic,
    difficulty, exam codes, premium flag, PYQ provenance) plus at least one language
    translation.
  business_rule: >
    topicId must reference an existing topic; difficulty must reference an existing
    difficulty_levels code; every entry in examCodes (at least one required) must already
    exist; translations must include at least one entry and must include the root language
    "en". A content fingerprint (MD5 of lowercased, alphanumeric-only English text) is
    computed before save and duplicate detection runs immediately after save.
  actor: Admin
  preconditions:
    - Caller holds a valid admin bearer token
    - "Referenced topic/difficulty/exam codes/language codes/sourcePaperId (if set) already exist"
  inputs:
    - "questionType (opt, default SINGLE_CHOICE)"
    - correctAnswer
    - answerKey
    - contentStructure
    - "questionGroupId (opt), groupOrder (opt)"
    - "topicId (req), difficulty (req), examCodes (req, >=1)"
    - "premium, pyq, pyqYear, pyqShift, sourcePaperId, questionNumber, sourceUrl"
    - "translations (req, >=1, must include \"en\")"
  expected_outputs:
    - >
      201 Created with a full QuestionResponse. If the fingerprint collides with an existing
      question, duplicateOfQuestionIds is populated with the colliding question's id, but the
      write still succeeds.
  validations:
    - Missing root-language translation -> 400
    - Unknown topicId/difficulty/exam code/language code/sourcePaperId -> 400
  permissions: "admin (requireAdmin)"
  dependencies:
    - REQ-CATALOG-007
    - REQ-CATALOG-008
    - REQ-CATALOG-011
    - REQ-CATALOG-001
    - REQ-CATALOG-010
  error_conditions:
    - 401 not signed in
    - 403 not admin
    - 400 for any of the validation failures above
  edge_conditions:
    - A fingerprint collision does not block creation, only annotates the response
  offline_behavior: "N/A — admin-only, requires network/admin session."
  acceptance_criteria:
    - >
      Creating with a valid payload returns 201 with correctly populated
      subjectId/subjectName/topicId/topicName/examCodes (sorted) fields
    - A payload missing an "en" translation is rejected with 400
  priority: Critical
  status: Active
  ambiguity: null
  automation_status: Automated
  automation_hint: >
    QuestionCrudTest.createThenGet_returnsSameData, QuestionCrudTest.create_missingRootLanguage_returns400,
    QuestionCrudTest.create_unknownLanguageCode_returns400, QuestionCrudTest.create_unknownExamCode_returns400

- id: REQ-QUESTIONS-002
  feature: "Multi-type answerKey/contentStructure validation per questionType"
  module: QUESTIONS
  system: [Backend, Admin]
  source_doc: api/QUESTIONS.md
  source_section: >
    POST /api/questions ("answerKey shape by type", "contentStructure shape by type",
    "translations[].content shape by type")
  description: >
    A question's questionType (one of 9 authorable codes: SINGLE_CHOICE, MULTIPLE_CHOICE,
    TRUE_FALSE, ASSERTION_REASON, STATEMENT_COMBINATION, NUMERIC, FILL_BLANK, MATCH,
    ORDERING) determines the required shape of answerKey, contentStructure, and each
    translation's options/content. questionType and contentStructure are immutable after
    creation.
  business_rule: >
    SINGLE_CHOICE/ASSERTION_REASON/STATEMENT_COMBINATION derive answerKey server-side from
    correctAnswer (a letter A-D or matching option text) — answerKey sent by the client is
    ignored for these three. MULTIPLE_CHOICE requires {correctOptions: number[]} (non-empty,
    0-based); TRUE_FALSE requires {correctBoolean}; NUMERIC requires {correctValue, tolerance}
    (tolerance defaults 0.0); FILL_BLANK requires {acceptedAnswers: string[]} (>=1,
    case-insensitive/trimmed match); MATCH requires contentStructure.{leftKeys,rightKeys}
    (>=2 distinct each) + answerKey.correctMapping covering every leftKey; ORDERING requires
    contentStructure.itemKeys (>=2 distinct) + answerKey.correctOrder (a permutation). Server
    always derives a display correctAnswer string for the 6 non-index types. options must be
    exactly 4 for the 4 option-set types and an empty array [] (not null/omitted) for the
    other 5. translations[].content is required/shape-validated only for ASSERTION_REASON,
    STATEMENT_COMBINATION, MATCH, ORDERING.
  actor: Admin
  preconditions:
    - "questionType is one of the 9 seeded, is_authoring_enabled=true types"
  inputs:
    - "as above, varying by questionType"
  expected_outputs:
    - >
      QuestionResponse with server-computed correctAnswer, answerKey, and contentStructure
      matching the type's rules
  validations:
    - "Blank correctAnswer, wrong option count/shape, missing/invalid answerKey for the type"
    - "Missing/invalid content for ASSERTION_REASON/STATEMENT_COMBINATION/MATCH/ORDERING"
    - "questionType not is_authoring_enabled -> all 400"
  permissions: admin
  dependencies:
    - REQ-QUESTIONS-001
    - REQ-QUESTIONS-025
  error_conditions:
    - 400 for any type/shape mismatch described above
  edge_conditions:
    - "questionType/contentStructure cannot be changed via PUT — no field exists on UpdateQuestionRequest"
  offline_behavior: "N/A (write path)."
  acceptance_criteria:
    - "Creating a MATCH question with correctMapping missing a leftKey is rejected 400"
    - "Creating a NUMERIC question with omitted tolerance defaults to 0.0 server-side"
  priority: High
  status: Active
  ambiguity: >
    null — QUESTIONS.md documents this as current, normal CRUD behavior; deliberately not
    chased further into the separate multi-type-architecture evaluator/rendering docs, per scope.
  automation_status: CandidateForAutomation
  automation_hint: >
    none found in the Questions-module CRUD/Bulk/Sync test classes read; type-specific
    evaluator tests live in WaveAOptionSetTypesTest/WaveBFreeInputTypesTest/
    QuestionTypeFoundationTest, which are explicitly out of this module's extraction scope.

- id: REQ-QUESTIONS-003
  feature: Bilingual/multi-language translation management
  module: QUESTIONS
  system: [Backend, Admin]
  source_doc: api/QUESTIONS.md
  source_section: "PUT /api/questions/{id}/translations/{lang}"
  description: >
    A question's text/options/explanation/content are managed per language via a dedicated
    endpoint, separate from metadata updates, so any number of languages (not just en/hi) can
    be added without a schema change.
  business_rule: >
    Editing the root language ("en") recomputes the content fingerprint, invalidating any
    prior duplicate-detection result based on old wording. Any translation write bumps
    updatedAt on the parent question — this is what makes a translation-only edit visible on
    the next delta /sync.
  actor: Admin
  preconditions:
    - Question exists
    - Language code exists in languages
  inputs:
    - "{questionText, options, explanation, content} for path params {id}, {lang}"
  expected_outputs:
    - "Full QuestionResponse (all languages) with updatedAt bumped"
  validations:
    - "Unknown language code -> 400"
    - "Wrong option count/shape for the question's type -> 400"
    - "Invalid/missing content for ASSERTION_REASON/STATEMENT_COMBINATION -> 400"
  permissions: admin
  dependencies:
    - REQ-QUESTIONS-001
    - REQ-QUESTIONS-002
    - REQ-CATALOG-010
  error_conditions:
    - "401, 403, 404 unknown question id, 400 as above"
  edge_conditions:
    - "Adding a new language doesn't remove existing ones (upsert, not replace-all)"
  offline_behavior: >
    Translated content is exactly what syncs to devices via /sync//live — a signed-out
    student's bilingual reading experience depends entirely on this data being correctly
    populated per language.
  acceptance_criteria:
    - Adding a Hindi translation to an English-only question preserves the English
      translation and appears in the next GET
  priority: Critical
  status: Active
  ambiguity: null
  automation_status: Automated
  automation_hint: "QuestionCrudTest.upsertTranslation_addsNewLanguageWithoutRemovingExisting"

