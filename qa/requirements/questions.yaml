- id: REQ-QUESTIONS-010
  feature: Bulk import questions
  module: QUESTIONS
  system: [Backend, Admin]
  source_doc: api/QUESTIONS.md
  source_section: "POST /api/questions/bulk-import; TICKET-106, TICKET-109"
  description: "Import many questions from a prepared batch in one request, for the admin content pipeline."
  business_rule: >
    SINGLE_CHOICE only — no questionType/answerKey/contentStructure/content field exists on
    BulkImportQuestionRequest; every imported row is created as SINGLE_CHOICE. Unlike single
    create, Subject and Topic are resolved by name and auto-created if new; exam codes still
    must pre-exist. Rows are flushed in batches of 50; if a batch's flush fails at the DB
    level, every row in that batch (not just the offending one) is reported as failed.
    Per-row failures are reported inside the 201 response body (failures: [{index, error}]),
    not as an HTTP error — one bad row does not fail the whole batch (this per-item isolation
    is the specific fix from TICKET-109, replacing an earlier all-or-nothing behavior).
  actor: Admin
  preconditions:
    - "Difficulty and exam codes referenced by each row must already exist; subject/topic need not"
  inputs:
    - >
      {questions: [{correctAnswer, subjectName, topicName, difficulty, examCodes, premium,
      pyq, pyqYear, pyqShift, sourcePaperId, questionNumber, sourceUrl, translations}]}
  expected_outputs:
    - "201 Created: {createdCount, ids, failures: [{index, error}], duplicatesDetected: {[importedId]: originalId}}"
  validations:
    - >
      Same per-row validation as single create (root-language translation required,
      exactly-4 options for SINGLE_CHOICE, etc.), reported per-index in failures rather than
      failing the whole request — except a batch-level DB flush failure, which fails every
      row in that 50-row batch
  permissions: admin
  dependencies:
    - REQ-QUESTIONS-001
    - REQ-CATALOG-001
    - REQ-CATALOG-007
    - REQ-CATALOG-008
  error_conditions:
    - "401, 403. Individual row errors are 201-body content, not HTTP errors"
  edge_conditions:
    - >
      A batch (of 50) that fails at the DB flush level reports all 50 rows in that batch as
      failed, even if only one row was actually bad, since the batch failure can't be
      attributed to a single row
  offline_behavior: "N/A (admin write path); imported questions become sync-visible once created."
  acceptance_criteria:
    - >
      A 2-item batch with 1 valid + 1 invalid item returns createdCount: 1, failures:
      [{index: 1, error: "..."}], and the valid item is NOT rolled back by the invalid one's
      failure
  priority: Critical
  status: Active
  ambiguity: >
    null — note: the pre-import client-side "review and remove before sending" UX (TICKET-109)
    is an Admin-frontend behavior layered on top of this API, not part of the API contract itself.
  automation_status: Automated
  automation_hint: >
    BulkOperationsTest.bulkImport_allValid_createsEveryQuestion,
    BulkOperationsTest.bulkImport_reusesExistingSubjectAndTopicByName_doesNotDuplicate,
    BulkOperationsTest.bulkImport_oneBadItem_doesNotBlockTheOthers,
    BulkOperationsTest.bulkImport_unknownExamCode_failsThatItemOnly

