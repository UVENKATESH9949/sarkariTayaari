  inputs:
    - "N/A (same /sync call as REQ-QUESTIONS-012)"
  expected_outputs:
    - "The deleted question's row in the sync page, deleted: true, full content present"
  validations: []
  permissions: none (public)
  dependencies:
    - REQ-QUESTIONS-008
