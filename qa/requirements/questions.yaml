- id: REQ-QUESTIONS-008
  feature: Soft-delete a single question (tombstone)
  module: QUESTIONS
  system: [Backend, Admin, Mobile]
  source_doc: api/QUESTIONS.md
  source_section: "DELETE /api/questions/{id}; system-design/03 \"What changed includes deletions\""
  description: "Deleting a question sets deleted=true and bumps updatedAt; the row is never physically removed."
  business_rule: >
    This is the mechanism that makes the deletion visible as a tombstone on the next /sync —
    a hard/physical delete would silently strand any device that already downloaded the
    question.
  actor: Admin
  preconditions:
    - Question exists
  inputs:
    - "path {id}"
  expected_outputs:
    - "204 No Content"
  validations: []
  permissions: admin
  dependencies:
    - REQ-QUESTIONS-012
  error_conditions:
    - "401, 403, 404 unknown question id"
  edge_conditions:
    - "Deleting an already-deleted question is not specifically documented as idempotent-safe vs. erroring — worth clarifying (see _conflicts.md)"
  offline_behavior: >
    A device that already has this question locally must remove it on its next delta sync
    upon seeing deleted: true.
  acceptance_criteria:
    - "DELETE returns 204; a subsequent GET on the same id shows deleted: true"
  priority: Critical
  status: Active
  ambiguity: >
    REQUIRES CLARIFICATION: behavior of deleting an already-soft-deleted question is not
    explicitly stated (idempotent 204 vs error) — not testable from the doc alone.
  automation_status: PartiallyAutomated
  automation_hint: "QuestionCrudTest.delete_softDeletes_stillReadableAsDeleted"

