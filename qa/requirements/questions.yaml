- id: REQ-QUESTIONS-012
  feature: Content-sync endpoint — delta/full sync with pagination
  module: QUESTIONS
  system: [Backend, Mobile]
  source_doc: api/QUESTIONS.md
  source_section: "GET /api/questions/sync; TICKET-102/103/104"
  description: >
    The public delta-sync endpoint every mobile device polls to catch up on content changes.
    Supports full sync (since omitted/blank/"0") and delta sync (since=<ISO-8601 timestamp>).
  business_rule: >
    Always returns the entire question bank across every exam — no examCode filter exists on
    this endpoint (a deliberate change from an earlier exam-scoped version, see
    _conflicts.md). Results ordered by updatedAt ascending so a client resuming after a
    network drop can safely continue from the last page it processed. page default 0; size
    default 500, clamped server-side to a max of 1000.
  actor: "Mobile app (signed-out or signed-in student)"
  preconditions:
    - "none — deliberately public"
  inputs:
    - "since (opt), page (opt, default 0), size (opt, default 500, max 1000), supportedTypes (opt — see REQ-QUESTIONS-015)"
  expected_outputs:
    - "Page<QuestionResponse> (content, totalPages, totalElements, number, size, last)"
  validations:
    - "since that fails to parse as ISO-8601 (and isn't blank/\"0\") -> 400"
  permissions: none (public)
  dependencies:
    - REQ-QUESTIONS-013
    - REQ-QUESTIONS-014
    - REQ-QUESTIONS-015
  error_conditions:
    - "400 invalid since timestamp"
  edge_conditions:
    - "Requesting size above 1000 is silently clamped, not rejected"
    - "since=0 (literal string) means \"everything, from epoch\""
  offline_behavior: >
    This is THE offline sync mechanism — a device downloads the full bank once (first sync)
    and only changes thereafter (delta sync), enabling fully offline practice/mock-test
    taking once synced.
  acceptance_criteria:
    - >
      A delta sync with a cutoff after question A's updatedAt but before question B's returns
      B but not A
    - "Requesting size=2 returns exactly 2 results"
  priority: Critical
  status: Active
  ambiguity: "null (see _conflicts.md for the historical exam-scoping change)"
  automation_status: Automated
  automation_hint: >
    SyncEndpointTest.sinceZero_returns200AndRespectsPageSize,
    SyncEndpointTest.deltaSync_onlyReturnsChangesAfterCutoff,
    SyncEndpointTest.invalidSinceFormat_returns400, SyncEndpointTest.pageSize_isRespected

- id: REQ-QUESTIONS-013
  feature: Soft-deleted questions sync as full-content tombstones
  module: QUESTIONS
  system: [Backend, Mobile]
  source_doc: api/QUESTIONS.md
