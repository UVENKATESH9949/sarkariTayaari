- id: REQ-QUESTIONS-026
  feature: Bounded/paginated reads across the Questions module (performance & crash-prevention)
  module: QUESTIONS
  system: [Backend, Mobile]
  source_doc: api/QUESTIONS.md
  source_section: >
    page-size caps stated per-endpoint (/sync max 1000, /live max 500, /mock-sample max 200,
    /question-duplicates list max 100, /backfill max 5000);
    reports/19-startup-gate-and-query-limits/, reports/12-load-test-data-seeding/
  description: >
    Every question-serving read in this module must be bounded (paginated with a
    server-enforced cap, or an explicit LIMIT) — an unbounded query against a ~37,900+ row
    question bank is a documented, real failure mode, not a theoretical concern.
  business_rule: >
    Server-side, every public/admin read endpoint documented in QUESTIONS.md clamps its
    page/result size rather than trusting the client. Reinforced by a real, previously-shipped
    client-side bug: the mobile app's local practice-question query had no LIMIT and used
    ORDER BY RANDOM() with one bind parameter per matched row — a latent SQLite crash once a
    topic's question count exceeded SQLite's bound-parameter ceiling, masked only by a
    since-lifted temporary ~500-question pool restriction. Fixed with an explicit
    PRACTICE_QUESTION_LIMIT = 200 on the mobile side.
  actor: "System (backend + mobile query layers)"
  preconditions:
    - >
      A sufficiently large question bank (masked entirely at small scale — only surfaced once
      the load-test data (~14k-37.9k questions) and the full, un-pooled bank existed)
  inputs: []
  expected_outputs:
    - >
      Every read caps its result size server-side regardless of what a client requests, and
      no client-side query against synced question data omits a LIMIT
  validations: []
  permissions: N/A
  dependencies:
    - REQ-QUESTIONS-012
    - REQ-QUESTIONS-016
    - REQ-QUESTIONS-018
  error_conditions:
    - "An unbounded query is the failure mode being prevented (a crash/timeout), not a normal error response"
  edge_conditions:
    - >
      A topic/filter combination matching thousands of rows must still return promptly and
      without exceeding a client-side parameter-binding limit
  offline_behavior: >
    Directly enables offline use at real scale — a full sync of the ~37,884-question bank (76
    pages @ up to 1000/page) must complete without crashing the client, and a local practice
    query against a heavily-populated topic must not crash SQLite.
  acceptance_criteria:
    - >
      Requesting /sync or /live with size above the documented max is silently clamped, not
      rejected or allowed to balloon
    - >
      A local practice-question fetch against a topic with hundreds of matching rows returns
      at most PRACTICE_QUESTION_LIMIT results without error
  priority: High
  status: Active
  ambiguity: null
  automation_status: PartiallyAutomated
  automation_hint: >
    SyncEndpointTest.pageSize_isRespected (server-side cap only; the mobile-side LIMIT fix has
    no cited automated test — no mobile test runner exists in this project, verified only via
    on-device testing per reports/19).

- id: REQ-QUESTIONS-027
  feature: "Web Practice engine scores and reveals every question type"
  module: QUESTIONS
  system: [Web]
  source_doc: tasks/TASK-2601-student-web-application.md
  source_section: "Phase 1 — Practice"
  description: >
    The web Practice quiz renders and correctly scores all nine question types the backend
    supports — SINGLE_CHOICE, MULTIPLE_CHOICE, TRUE_FALSE, NUMERIC, FILL_BLANK, MATCH,
    ORDERING, ASSERTION_REASON, STATEMENT_COMBINATION — using the SAME shared evaluator
    (@sarkaritaiyaari/core/evaluation) the phone app and the backend use, and reveals
    correct/incorrect styling immediately once an answer is confirmed (Practice is
    immediate-feedback, unlike Mock Test).
  business_rule: >
    A type that cannot infer "done" from a single click (MULTIPLE_CHOICE, NUMERIC,
    FILL_BLANK, MATCH, ORDERING) requires an explicit "Check answer" step before revealing;
    SINGLE_CHOICE/TRUE_FALSE/ASSERTION_REASON/STATEMENT_COMBINATION reveal on the single
    click that answers them, since that click is the only action there is.
  actor: Student (signed in or signed out — accounts are optional)
  preconditions:
    - "A topic/difficulty selection with at least one available question"
  inputs:
    - "One answer per question, in whichever shape that question type needs"
  expected_outputs:
    - "Immediate CORRECT/INCORRECT/UNATTEMPTED styling and the question's explanation text"
  validations:
    - "Reveal styling on MATCH/ORDERING items must reflect per-item correctness, not just an overall banner"
  permissions: none (client-side; reads already-public question data)
  dependencies:
    - REQ-QUESTIONS-016
    - REQ-WEB-001
    - REQ-WEB-002
  error_conditions: []
  edge_conditions:
    - "A question with no confirmed answer is excluded from the session's final score, not counted as wrong"
  offline_behavior: "None — the web app is online-only by design (TASK-2601 decision 2)"
  acceptance_criteria:
    - "Every one of the nine types renders its answer area and, once confirmed, shows correct/incorrect styling matching the shared evaluator's outcome"
    - "MATCH and ORDERING colour BOTH sides/positions on reveal, not only one"
  priority: Critical
  status: Active
  ambiguity: null
  automation_status: ManualOnly
  automation_hint: >
    packages/core's questionEvaluator.test.ts proves the scoring logic itself; the web
    rendering/reveal layer has no browser-test runner in this project.

- id: REQ-QUESTIONS-028
  feature: "Question-group (passage/media) content renders in web Practice"
  module: QUESTIONS
  system: [Web]
  source_doc: tasks/TASK-2601-student-web-application.md
  source_section: "Phase 1 — Practice; api/QUESTION-GROUPS.md"
  description: >
    A question belonging to a shared group (a reading passage, or attached media) shows that
    group's content above the question text, collapsible for a passage. Practice has no
    atomic-group guarantee (unlike Mock Test's group-aware sampler), so a grouped question can
    appear with none of its siblings present in the same session — this renders whichever
    group the CURRENT question belongs to, independent of the rest of the fetched set.
  business_rule: >
    Media is fetched live from its third-party (Cloudinary) URL — there is no mobile-style
    pre-download to fall back to on the web.
  actor: Student
  preconditions:
    - "At least one fetched question has a non-null questionGroupId"
  inputs: []
  expected_outputs:
    - "The group's passage text (in the current question-content language) and/or media, above the question"
  validations:
    - "A question with no group renders no group content at all"
  permissions: none (public read)
  dependencies:
    - REQ-QUESTIONS-016
  error_conditions: []
  edge_conditions:
    - "The passage toggle's collapsed/expanded state does not affect answering or reveal"
  offline_behavior: "None — online-only"
  acceptance_criteria:
    - "A real grouped question's passage renders with correct text and collapses/expands on click"
  priority: Medium
  status: Active
  ambiguity: null
  automation_status: ManualOnly
  automation_hint: "No browser-test runner exists in this project for web."
