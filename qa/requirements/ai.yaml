- id: REQ-AI-020
  feature: Live per-student PROFILE_SUMMARY narrative generation for the Preparation Radar screen
  module: AI
  system: [Backend, Mobile]
  source_doc: tasks/TASK-2701-on-device-and-hybrid-ai.md
  source_section: "Phase 7.3 -- PROFILE_SUMMARY"
  description: >
    A signed-in student can request POST /api/exams/{examCode}/profile-summary to get a short
    "how you're doing overall" narrative over the Weakness Radar's already-ranked strengths and
    weaknesses for that exam. A different AI task (PROFILE_SUMMARY, not SESSION_FEEDBACK) with a
    different request shape (LearnerProfileContext, not SessionContext), but the same
    PersonalNarrativeService and the same flag-gate/generate/validate/never-throw posture as
    REQ-AI-018/019.
  business_rule: >
    Checked in the same order as REQ-AI-018: PROFILE_SUMMARY must be enabled in ai_task_flags
    before a request is built; the generated narrative must cite only numbers/topic names it was
    actually given (topicsInSyllabus, topicsWithEvidence, and every strength/weakness's
    healthScore and topicName), enforced by the same PersonalNarrativeGrounding/
    PersonalNarrativeValidation REQ-AI-018 already established. Cached server-side in
    user_profile_summaries (V45), one row per (user, exam), keyed on a SHA-256 of exactly the
    facts a narrative may cite -- NOT on the radar's computedAt, because the radar recomputes on a
    schedule whether or not anything a narrative could mention actually moved. The cache is
    checked before a prompt is built, for the same reason the flag is: never spend a request
    discovering the answer is already known.
  actor: Signed-in student (any role)
  preconditions:
    - Student holds a valid bearer token
  inputs:
    - "examCode, overviewStatus, topicsInSyllabus, topicsWithEvidence, strengths[], weaknesses[], preferredLanguage (ProfileSummaryRequest)"
  expected_outputs:
    - "{ narrative: string | null }"
  validations:
    - Every number the narrative cites is traceable to a given fact
    - The narrative names at least one topic it was actually given, when any were supplied
    - A response that is not valid JSON, or missing/blank narrative, is treated as a failure (null), never an error
  permissions: any signed-in student (requireUser)
  dependencies:
    - REQ-AI-018
  error_conditions:
    - "401 with no/invalid Authorization header"
  edge_conditions:
    - "topicsWithEvidence is 0 (a student who has not practised) -- the mobile client does not even call this endpoint in that case, matching the screen's own 'invitation, not an empty radar' state"
    - "strengths or weaknesses is empty -- the narrative still states coverage, naming only whichever list is non-empty"
  offline_behavior: >
    The mobile client only calls the cloud tier, falling back to profileSummaryTemplate directly
    when the router reports UNAVAILABLE -- the same discipline as REQ-AI-018/019, minus any cache
    to write through to (deliberately, see business_rule above).
  acceptance_criteria:
    - POST with no Authorization header returns 401
    - With the flag off, the response is 200 with narrative: null
    - With the flag on and a provider that returns a grounded response, the response is 200 with a non-null narrative
    - A second request with identical facts is served from cache without a second provider call
    - A request whose facts have changed regenerates rather than serving the cached narrative
  priority: Medium
  status: Active
  ambiguity: null
  automation_status: Automated
  automation_hint: "ProfileSummaryControllerTest (requiresAuthentication, returnsNullNarrativeWhenTheFlagIsOff, generatesAGroundedNarrativeWhenEnabled, identicalFactsAreServedFromCacheWithoutSpendingASecondModelCall, changedFactsRegenerateRatherThanServingAStaleNarrative)"

- id: REQ-AI-021
  feature: Every AI call is persisted with its token counts, and aggregated for an admin
  module: AI
  system: [Backend]
  source_doc: api/AI-ADMIN.md
  source_section: "GET /api/admin/ai-usage/summary"
  description: >
    Every call through AIService -- success or failure -- is written to ai_usage_events (V46) by
    DatabaseAIUsageRecorder, which replaces Phase 1's log-only LoggingAIUsageRecorder as the
    @Primary AIUsageRecorder bean with no change to AIServiceImpl. An admin can read aggregates
    (calls, input/output tokens, failures, grouped by feature and model) over a time window via
    GET /api/admin/ai-usage/summary.
  business_rule: >
    Recording must never be able to break the feature it measures. Two protections: nothing
    propagates out of the recorder (a failed usage write must not turn a good AI response into an
    error for the student -- the call already happened and was already billed), and the write uses
    REQUIRES_NEW so usage survives a caller's later rollback. REQUIRES_NEW is safe here
    specifically because the insert references no uncommitted parent row -- the exact condition
    that made it the wrong choice in DocumentStoreService. Failures are recorded, not just
    successes: a burst of rate-limit or validation failures is the most useful thing to see and is
    invisible if only successes are stored. No cost/pricing column is stored -- per-model pricing
    changes on the vendor's schedule, so cost stays a calculation over (model, tokens).
  actor: Admin (for the aggregate); the system itself (for recording)
  preconditions:
    - An AI provider is configured and at least one AI call has occurred
  inputs:
    - "since (optional ISO-8601 UTC instant; omitted/0 means the last 30 days)"
  expected_outputs:
    - "{ since, totalCalls, totalInputTokens, totalOutputTokens, totalTokens, totalFailures, byFeature[] }"
  validations:
    - totalTokens equals totalInputTokens + totalOutputTokens
    - A malformed since is rejected 400
  permissions: admin (requireAdmin)
  dependencies:
    - REQ-AI-018
  error_conditions:
    - "401 with no/invalid Authorization header; 403 for a signed-in non-admin"
    - "400 for a malformed since value"
  edge_conditions:
    - "A since with a +05:30 offset decodes as a space in a query string unless percent-encoded -- the Z form is the documented input"
    - "A failed usage write is logged and swallowed; the AI response is still returned to the caller"
  offline_behavior: n/a (backend only)
  acceptance_criteria:
    - A successful AI call produces exactly one ai_usage_events row with matching token counts
    - The summary endpoint aggregates that row under its feature name
    - The summary endpoint is admin-only (401 unauthenticated, 403 for a student)
    - A malformed since returns 400
  priority: Medium
  status: Active
  ambiguity: null
  automation_status: Automated
  automation_hint: "AiUsageTrackingTest (everyAiCallIsPersistedWithItsTokenCounts, theAdminSummaryAggregatesByFeature, theSummaryIsAdminOnly, aMalformedSinceIsRejected)"

- id: REQ-AI-022
  feature: An admin can read AI usage aggregates in the console, without querying the database
  module: AI
  system: [Admin]
  source_doc: api/AI-ADMIN.md
  source_section: "GET /api/admin/ai-usage/summary"
  description: >
    The admin console renders the aggregates REQ-AI-021 exposes: headline totals (calls, input
    tokens, output tokens, total tokens, failures) and a per-feature-and-model breakdown, over a
    selectable time window. Until this page existed the endpoint had no UI at all, so AI spend was
    only answerable by calling the API by hand -- which is why a real truncation bug (a task
    exhausting its output budget, billing in full and returning nothing) stayed invisible until
    someone went looking for it.
  business_rule: >
    The page reports tokens, never a money figure of its own. Per-model pricing changes on the
    vendor's schedule, so freezing a rate into this app would eventually report a confidently
    wrong number; instead the operator may enter today's rate and get an estimate computed in the
    browser, clearly labelled as derived from what they typed and never persisted. Failures are
    displayed beside successes and a non-zero count is styled as a problem, because an aggregate
    that hides failures is what let the truncation bug above go unnoticed.
  actor: Admin
  preconditions:
    - Signed in as an admin
  inputs:
    - "A time window (last 24 hours / 7 days / 30 days / 90 days), which maps to the endpoint's since parameter"
    - "Optionally, an input rate and an output rate per 1M tokens, for a client-side cost estimate"
  expected_outputs:
    - Headline totals for the selected window
    - A row per (feature, model) with calls, input/output/total tokens, and failures
  validations:
    - The selected window is sent as an ISO-8601 UTC ("Z") instant
    - A superseded in-flight response is discarded rather than allowed to overwrite a newer one
  permissions: admin (the endpoint enforces requireAdmin; the console is admin-only)
  dependencies:
    - REQ-AI-021
  error_conditions:
    - "A failed request surfaces the error message in a banner and clears stale data rather than showing it as current"
  edge_conditions:
    - "A window containing no calls renders an explicit empty state, not an empty table"
    - "Usage only exists from the point the database-backed recorder shipped, so an older call never appears"
  offline_behavior: n/a (admin console is online-only)
  acceptance_criteria:
    - Headline totals and the per-feature table match what the endpoint returns for the same window
    - Changing the window re-queries and re-renders
    - A non-zero failure count is visually distinguished
    - No vendor price is hardcoded anywhere in the page
  priority: Medium
  status: Active
  ambiguity: null
  automation_status: ManualOnly
  automation_hint: "No automated browser-test runner exists for admin/ in this project"
