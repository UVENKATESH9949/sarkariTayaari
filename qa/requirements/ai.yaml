- id: REQ-AI-015
  feature: Public sync feed withholds unpublished content
  module: AI
  system: [Backend]
  source_doc: api/AI-CONTENT.md
  source_section: "GET /api/ai-content/sync"
  description: >
    A signed-out or signed-in client can delta-sync AI-generated content the same way it syncs
    questions or exam structure — no auth required. A row is included regardless of its
    contentStatus (so a device can drop content that stopped being published), but its payload
    and a `published` flag are the only signal: payload is present only when published is true.
  business_rule: >
    Never let unreviewed or rejected model output reach a public endpoint even as inert JSON — the
    tombstone role `isDeleted` plays for every other synced table is played here by
    `published: false`, which is a property of review state, not deletion.
  actor: Any client (no auth)
  preconditions: []
  inputs:
    - "since (ISO-8601 timestamp, or 0/omitted for a full sync)"
  expected_outputs:
    - "An array of {id, taskId, questionId, topicId, languageCode, published, payload, updatedAt}"
  validations:
    - A malformed since value is rejected 400
    - payload is null whenever published is false
  permissions: none (public)
  dependencies:
    - REQ-AI-012
  error_conditions:
    - "400 for a malformed since parameter"
  edge_conditions:
    - "A row that was PUBLISHED and is later unpublished still appears in a later sync, now with published=false and payload=null"
  offline_behavior: >
    This is the endpoint an offline-first client's own sync engine calls; the endpoint itself has
    no offline behavior of its own.
  acceptance_criteria:
    - A DRAFT row's sync entry has published=false and no payload
    - Publishing the row makes its next sync entry have published=true and a real payload
    - Unpublishing it again reverts the sync entry to published=false with no payload
    - No Authorization header is required
  priority: Critical
  status: Active
  ambiguity: null
  automation_status: Automated
  automation_hint: "AiContentIntegrationTest.sync_omitsPayloadUnlessPublished_andNeverNeedsAuth"

- id: REQ-AI-016
  feature: Public client-config feed reports every AI task's enable state
  module: AI
  system: [Backend, Mobile]
  source_doc: tasks/TASK-2701-on-device-and-hybrid-ai.md
  source_section: "Phase 4 -- client-config / feature-flag endpoint"
  description: >
    Any client (no auth) can fetch GET /api/client-config to learn which of the 9 registered
    AiTaskIds are currently enabled. Every known AiTaskId always appears in the response, whether
    or not an admin has ever touched it -- a task with no ai_task_flags row is reported as
    enabled=false rather than being silently absent, so "unknown means off" holds identically
    whether the gap is "never toggled" or "not yet synced to this device."
  business_rule: >
    The router (packages/core/src/ai/router.ts) and this feed must agree: a task not present, or
    present with false, is disabled. Never let a missing key be read as enabled by default,
    server-side or client-side.
  actor: Any client (no auth); the mobile app's own reference sync
  preconditions: []
  inputs: []
  expected_outputs:
    - "{ aiTasks: { <AiTaskId>: boolean, ... } } with all 9 known task ids present"
  validations:
    - A task with no ai_task_flags row is present in the response with value false
    - An enabled task is present with value true
  permissions: none (public)
  dependencies:
    - REQ-AI-017
  error_conditions: []
  edge_conditions:
    - "A task disabled after being enabled reverts to false on the next fetch, not simply disappearing"
  offline_behavior: >
    The mobile app caches this feed locally (client_config_ai_tasks, full-replace on every
    reference sync) so an AI surface can check a task's flag without a network call; a device
    that has never synced treats every task as disabled (no local row = false), matching the
    server's own default.
  acceptance_criteria:
    - GET /api/client-config with no Authorization header returns 200
    - All 9 AiTaskIds are present in aiTasks even with zero ai_task_flags rows in the database
    - Enabling a task via the admin endpoint flips its value to true on the very next fetch
  priority: Critical
  status: Active
  ambiguity: null
  automation_status: Automated
  automation_hint: "AiTaskFlagTest.clientConfig_defaultsEveryKnownTaskToDisabled_andNeedsNoAuth"

- id: REQ-AI-017
  feature: Admin per-task AI enable/disable control
  module: AI
  system: [Backend, Admin]
  source_doc: tasks/TASK-2701-on-device-and-hybrid-ai.md
  source_section: "Phase 4 -- AI Admin Control Center per-task flags"
  description: >
    An authenticated admin can list every known AiTaskId's current flag (GET
    /api/admin/ai-task-flags) and toggle one on or off (PUT
    /api/admin/ai-task-flags/{taskId}), independent of the provider-level AI Control Center
    settings shipped earlier. Every mutation is optimistic-locked via expectedVersion, matching
    ai_content/ai_provider_configs/ai_settings's existing convention.
  business_rule: >
    A task new to the system (created after this feature shipped) has never had a row and must
    still round-trip through this endpoint safely -- creating it for the first time is itself a
    version transition (0 -> 1), not exempt from the stale-version check on a second call.
  actor: ADMIN
  preconditions:
    - "Caller holds a valid ADMIN bearer token"
  inputs:
    - "taskId (path, must be a real AiTaskId)"
    - "enabled (boolean)"
    - "expectedVersion (long)"
  expected_outputs:
    - "AiTaskFlagView: { taskId, enabled, updatedAt, updatedByEmail, version }"
    - "AiTaskFlagListResponse: { flags: [AiTaskFlagView, ...] }, one entry per known AiTaskId"
  validations:
    - An unauthenticated or non-admin (including REVIEWER) caller is rejected
    - An unknown taskId is rejected 400
    - A stale expectedVersion is rejected 409, including on the very first toggle of a
      never-before-touched task (see business_rule above)
  permissions: ADMIN only
  dependencies:
    - REQ-AI-016
  error_conditions:
    - "401 with no token"
    - "403 for STUDENT or REVIEWER"
    - "400 for an unknown taskId"
    - "409 for a stale expectedVersion"
  edge_conditions:
    - "A task that has never been toggled is still listed (via a synthesized disabled/version-0 view), not omitted"
  offline_behavior: n/a
  acceptance_criteria:
    - Enabling a task makes it appear enabled=true in both the admin list and the public client-config feed
    - The very first toggle of an untouched task, followed immediately by a second call reusing expectedVersion=0, is rejected 409
    - GET /api/admin/ai-task-flags always returns exactly 9 entries, one per AiTaskId
  priority: High
  status: Active
  ambiguity: null
  automation_status: Automated
  automation_hint: "AiTaskFlagTest.adminCanEnableATask_andItThenAppearsInClientConfig; AiTaskFlagTest.update_rejectsAStaleVersion"
