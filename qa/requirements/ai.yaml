- id: REQ-AI-018
  feature: Live per-student SESSION_FEEDBACK narrative generation
  module: AI
  system: [Backend, Mobile]
  source_doc: tasks/TASK-2701-on-device-and-hybrid-ai.md
  source_section: "Phase 7.1 -- live, per-student SESSION_FEEDBACK generation"
  description: >
    A signed-in student can request POST /api/practice-sessions/{sessionId}/feedback after
    finishing a Practice session. Unlike AI-CONTENT.md's batch-generate-then-review pipeline
    (REQ-AI-010 onward), this is the first endpoint that calls AIService directly per request --
    the content (a 2-4 sentence narrative over that student's own just-finished session) cannot
    be generated ahead of time or shared between students. Context (accuracy, per-topic
    health/trend) is supplied by the client, already computed by the existing deterministic
    Weakness Radar/intelligence layer -- this endpoint only asks a model to phrase it, never to
    derive it (mirrors the trust posture QUESTION_EXPLANATION already takes toward a verified
    correctAnswer).
  business_rule: >
    Checked in this order, each a hard gate before the next: (1) SESSION_FEEDBACK must be
    enabled in ai_task_flags (AiTaskFlagService.isEnabled) before a request is even built --
    never spend a call finding out a feature is off; (2) the generated narrative must pass
    PersonalNarrativeGrounding -- every number it cites must be one it was given, and it must
    name at least one topic it was actually given, when any were supplied. The Java check
    (PersonalNarrativeGrounding) and the shared TypeScript check
    (packages/core/src/ai/schema/validate.ts's groundedNarrative) must agree on every case in
    sample-data/personal-narrative-grounding-fixtures.json, the same parity discipline
    ai-answer-grounding-fixtures.json already established for REQ-AI-011. A disabled flag,
    failed validation, or a provider error all resolve to narrative: null -- never a 4xx/5xx for
    "the model declined."
  actor: Signed-in student (any role)
  preconditions:
    - Student holds a valid bearer token
    - sessionId in the path identifies which session the narrative is about (need not exist on
      the backend yet -- a device can ask before its own sync has run)
  inputs:
    - "sessionKind, examCode, answeredCount, correctCount, accuracyPercent, preferredLanguage, topics[] (SessionFeedbackRequest)"
  expected_outputs:
    - "{ narrative: string | null }"
  validations:
    - Every number the narrative cites is traceable to a given fact
    - The narrative names at least one topic it was actually given, when any were supplied
    - A response that is not valid JSON, or missing/blank narrative, is treated as a failure (null), never an error
  permissions: any signed-in student (requireUser)
  dependencies:
    - REQ-AI-017
  error_conditions:
    - "401 with no/invalid Authorization header"
  edge_conditions:
    - "sessionId does not correspond to any session synced to this backend yet -- generation still runs; only opportunistic persistence is skipped"
    - "sessionId belongs to a different user -- same as above (findByIdAndUserId), never leaks or errors"
    - "A student with no topics touched (topics: []) still gets a narrative built from accuracy alone"
  offline_behavior: >
    The mobile client (getOrBuildSessionFeedback) only calls the cloud tier -- SESSION_FEEDBACK's
    DETERMINISTIC tier (sessionFeedbackTemplate, a canned-sentence template) is invoked directly
    as the on-screen fallback when the router reports UNAVAILABLE (offline, signed out, or the
    backend declined), never routed through routeAiTask itself, so the router's "cheapest tier
    that fully answers" contract stays intact for any future caller that does want the template
    tried first. A generated narrative is cached locally (practice_sessions.feedback_narrative)
    and, when the session has synced, opportunistically cached server-side too
    (user_practice_sessions.feedback_narrative) so reopening the same session never re-generates
    (and re-bills) an unchanging result.
  acceptance_criteria:
    - POST with no Authorization header returns 401
    - With the flag off, the response is 200 with narrative: null
    - With the flag on and a provider that returns a grounded response, the response is 200 with a non-null narrative
    - The narrative persists onto the session row when that session has already synced to this backend
    - Calling with a sessionId that has not synced yet still succeeds and returns a narrative
  priority: High
  status: Active
  ambiguity: null
  automation_status: Automated
  automation_hint: "SessionFeedbackControllerTest (requiresAuthentication, returnsNullNarrativeWhenTheFlagIsOff, generatesAGroundedNarrativeWhenEnabled, doesNotFailWhenNoSessionHasSyncedForThatId, persistsTheNarrativeOntoAnAlreadySyncedSession); PersonalNarrativeGroundingTest.everyFixtureCaseHolds"

