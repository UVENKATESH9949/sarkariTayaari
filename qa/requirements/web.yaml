    The question evaluator, topic-health algorithm, translation catalogues and engine, design
    tokens, and the HTTP API client exist once, in packages/core, and are consumed by both
    mobile/ and web/. Neither app carries its own copy.
  business_rule: >
    Scoring rules already exist twice on purpose (Java on the server, TypeScript on the
    client) so evaluation can run offline. A third copy for web would make correctness a
    three-way agreement problem with no test on two of the sides.
