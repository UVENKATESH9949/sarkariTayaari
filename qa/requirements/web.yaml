- id: REQ-WEB-014
  feature: Home — hero + category browsing rows
  module: WEB
  system: [Web]
  source_doc: "session instruction (Hotstar-style Home redesign)"
  source_section: "Home page layout — hero banner, horizontal category rows, exam poster cards"
  description: >
    Home shows one hero (a real admin-badged exam, e.g. carrying an editorial "Popular"
    tag, with its real photo/emblem, cycle name and demo disclosure, vacancy count and
    days-to-deadline when the backend has them — or a plain generic welcome hero when no
    exam carries a badge) followed by horizontally-scrollable rows of exam tiles grouped
    by category. Each tile shows the exam's real uploaded photo when one exists, or a
    two-letter monogram on a category-tinted background when it doesn't.
  business_rule: >
    `ExamCard.category` (real admin data) is null on every currently-active exam — checked
    directly against the live API — so category grouping falls back to reading the real
    exam CODE's own prefix (SSC_CGL is an SSC exam) rather than collapsing every exam into
    one row; the real field always wins once an admin sets it (see homeCategories.ts's own
    comment). The "Popular" row and hero both come from the real, admin-curated `badge`
    field — no popularity/attempt-count is invented. Category colors are fixed per category
