# WEB module — requirement repository
#
# Scope: the student-facing web application (web/) and the shared package it stands on
# (packages/core). Primary source: tasks/TASK-2601-student-web-application.md. Secondary:
# web/src/**, packages/core/src/**, WEB-DEPLOY-SETUP.md.
#
# WHY THIS MODULE EXISTS AT ALL, given qa/README.md says module codes follow api/*.md contract
# boundaries. Web adds no API contract — it consumes the ones that already exist. What it does
# add is a whole client with behaviour of its own: responsive layout, theming, a translation
# surface, session handling in a browser, and a hard dependency on the backend's CORS
# allowlist. None of that belongs to AUTH or CATALOG. So WEB covers web-specific behaviour,
# and from Phase 1 onward a feature area's cases attach to its existing contract module with
# `Web` added to that requirement's `system` list, rather than being duplicated here.
#
# automation_status is evidence-based. `Automated` appears only where a named test genuinely
# asserts the requirement. web/ has no browser-test runner configured in this project (no
# Playwright/Vitest under web/ — the Phase 0 browser checks were one-off scripts, not a suite),
# so every UI requirement is ManualOnly, the same standing as mobile/ and admin/.

- id: REQ-WEB-001
  feature: Shared logic has exactly one implementation
  module: WEB
  system: [Mobile, Web]
  source_doc: tasks/TASK-2601-student-web-application.md
  source_section: "Phase 0 — shared package extraction"
  description: >
    The question evaluator, topic-health algorithm, translation catalogues and engine, design
    tokens, and the HTTP API client exist once, in packages/core, and are consumed by both
    mobile/ and web/. Neither app carries its own copy.
  business_rule: >
    Scoring rules already exist twice on purpose (Java on the server, TypeScript on the
    client) so evaluation can run offline. A third copy for web would make correctness a
    three-way agreement problem with no test on two of the sides.
  actor: Developer
  preconditions:
    - packages/core is installed in both consumers
  inputs:
    - "A change to any module under packages/core/src"
  expected_outputs:
    - "Both mobile/ and web/ observe the change without a second edit"
  validations:
    - Mobile typechecks, lints at its documented baseline, and produces a Metro bundle containing the shared modules
    - scripts/check-topic-health-parity.js passes against the moved path
  permissions: n/a
  dependencies: []
  error_conditions:
    - "A shared module referencing a platform-specific global fails packages/core's platform-purity test"
  edge_conditions:
    - "__DEV__ exists on React Native and not in a browser; shared code must guard it with typeof"
  offline_behavior: n/a
  acceptance_criteria:
    - No duplicate definition of the evaluator, topic-health constants, catalogues or palettes exists outside packages/core
    - The topic-health parity script passes
  priority: Critical
  status: Active
  ambiguity: null
  automation_status: Automated
  automation_hint: "packages/core platformPurity.test.ts + questionEvaluator.test.ts; scripts/check-topic-health-parity.js"

