- id: REQ-WEB-007
  feature: Browser session
  module: WEB
  system: [Backend, Web]
  source_doc: web/src/auth/AuthProvider.tsx
  source_section: "AuthProvider"
  description: >
    A student can register, sign in and sign out from the browser against the same accounts the
    phone app uses. A stored token is validated against the server on startup rather than
    trusted, and a token the server rejects as unauthorised is discarded.
  business_rule: >
    Only the server knows a token has been revoked. A transient failure (offline, backend down)
    is NOT evidence a token is bad and must not sign the student out.
  actor: Student
  preconditions:
    - The backend is reachable and its CORS allowlist contains this origin
  inputs:
    - "email, password, optional display name"
  expected_outputs:
    - "A session that survives reload; sign-out clears it"
  validations:
    - Sign-out clears the local session even if the server call fails
  permissions:
    - "Any anonymous visitor may register or sign in"
  dependencies: [REQ-WEB-008]
  error_conditions:
    - "401 on startup validation discards the stored token"
    - "A network failure on startup validation retains the token"
  edge_conditions:
    - "The app is fully usable signed out — accounts are optional"
  offline_behavior: "Sign-in requires a network; an existing session renders without one"
  acceptance_criteria:
    - A signed-in session survives a full page reload
    - Signing out returns the app to its signed-out state
  priority: Critical
  status: Active
  ambiguity: null
  automation_status: ManualOnly
  automation_hint: "Backend-side auth is covered by AuthTest; the browser session layer has no runner"

- id: REQ-WEB-008
  feature: Cross-origin access to the backend
  module: WEB
  system: [Backend, Web]
  source_doc: WEB-DEPLOY-SETUP.md
  source_section: "4. Add the deployed origin to the backend's CORS allowlist"
  description: >
    The backend permits requests from exactly the origins listed in app.cors.allowed-origins
    (APP_CORS_ALLOWED_ORIGINS). The web app's origin must be listed or every request fails.
  business_rule: >
    Origins are matched exactly. http://127.0.0.1:5174 is a different origin from
    http://localhost:5174, and https://x.web.app is different from https://x.firebaseapp.com —
    Firebase serves both by default.
  actor: Student (via the browser)
  preconditions:
    - The backend is running with a known allowlist
  inputs:
    - "An Origin header on a preflight or actual request"
  expected_outputs:
    - "Allowlisted origin — 200 with Access-Control-Allow-Origin echoed"
    - "Unlisted origin — 403 'Invalid CORS request'"
  validations:
    - The Authorization header is permitted, so bearer auth works cross-origin
  permissions: n/a
  dependencies: []
  error_conditions:
    - "A blocked origin surfaces in the browser only as an opaque network failure, indistinguishable from the backend being down"
  edge_conditions:
    - "Adding an origin requires a backend restart (local) or a new revision (Cloud Run)"
    - "APP_CORS_ALLOWED_ORIGINS replaces rather than appends — omitting the admin origin breaks the admin console"
  offline_behavior: n/a
  acceptance_criteria:
    - A preflight from an allowlisted origin returns Access-Control-Allow-Origin for that origin
    - A preflight from an unlisted origin is refused
  priority: Critical
  status: Active
  ambiguity: null
  automation_status: CandidateForAutomation
  automation_hint: "A backend integration test could assert the allowlist behaviour directly; none exists today"

- id: REQ-WEB-010
  feature: Mock Test engine — timed, blind, navigable, with an unload guard
  module: WEB
  system: [Web]
  source_doc: tasks/TASK-2601-student-web-application.md
  source_section: "Phase 2 — Mock Test"
  description: >
    A full-length timed attempt in the browser: a countdown that auto-submits at zero, no
    reveal of correct/incorrect until submit ("blind mode"), mark-for-review, clear-response,
    a question-navigator grid scaled to real paper sizes (SSC/IBPS/RRB papers run 80-190
    questions), per-question language switching, and a guard against losing an in-progress
    attempt to an accidental tab close or refresh.
  business_rule: >
    A mock test must behave like the real exam it rehearses — no early feedback, and a
    countdown that keeps running (and auto-submits) even if the student never returns.
    Leaving mid-attempt is real work lost, so it is guarded, not silent — the browser
    equivalent of mobile's hardware-back interceptor (`activeSessionContext.tsx`), built on
    the two mechanisms a browser actually offers: in-app navigation is intercepted by the
    app itself with a styled dialog; a tab close/refresh can only trigger the browser's own
    native, un-stylable `beforeunload` prompt.
  actor: Student
  preconditions:
    - "A mockable paper exists with at least one section that has available questions"
  inputs:
    - "paperId; the student's answers, marks-for-review, and navigation between questions"
  expected_outputs:
    - "A completed attempt with a real scorecard (marks scored, correct/wrong/unattempted, per-subject breakdown, per-question review)"
  validations:
    - "No .option-correct/.option-wrong (or equivalent reveal styling) exists anywhere before submit"
    - "The question-navigator grid remains fully usable (its own Close button reachable) on a paper with 100+ questions"
    - "The countdown is derived from a fixed end-timestamp, not a decrementing counter, so a throttled/backgrounded tab still reports the correct remaining time"
  permissions: n/a
  dependencies: [REQ-QUESTIONS-018]
  error_conditions:
    - "The countdown reaching zero auto-submits exactly once, even if triggered from a backgrounded tab"
  edge_conditions:
    - "In-app navigation away from an active attempt shows a styled confirmation dialog, not the native browser prompt"
    - "A tab close/refresh during an active attempt triggers the browser's native beforeunload prompt; the dialog carries no custom text (browsers do not allow one)"
    - "A section whose subjects have fewer live questions than requested runs with the shorter, honestly-disclosed count rather than failing"
  offline_behavior: "None — Mock Test requires a live connection throughout (decision 2, online-only)"
  acceptance_criteria:
    - "Submitting shows a confirmation naming how many questions are answered, and cannot be undone once confirmed"
    - "The result scorecard's marks match the paper's own marking scheme (+marksCorrect per correct, -marksWrong per wrong)"
    - "Marked-for-review and answered are tracked and rendered as visually distinct navigator states"
  priority: Critical
  status: Active
  ambiguity: null
  automation_status: ManualOnly
  automation_hint: "No browser-test runner is configured under web/; verified this phase via a one-off Playwright script (not a committed suite), per this file's own header note"

- id: REQ-WEB-009
  feature: Client-side routing survives a direct hit
  module: WEB
  system: [Web]
  source_doc: firebase.json
  source_section: "hosting.rewrites"
  description: >
    Any in-app route opened directly — typed, bookmarked, shared or reloaded — renders that
    screen rather than a host 404.
  business_rule: >
    A single-page app serves one HTML file; without a catch-all rewrite the CDN never hands
    unmatched paths to the app.
  actor: Student
  preconditions:
    - The app is served by a host configured with a catch-all rewrite to /index.html
  inputs:
    - "A direct request for an in-app path"
  expected_outputs:
    - "The corresponding screen renders"
  validations:
    - An unknown path renders the app's own not-found screen, not the host's
  permissions: n/a
  dependencies: []
  error_conditions: []
  edge_conditions:
    - "index.html must not be cached, or a deploy leaves returning visitors on the previous build"
  offline_behavior: n/a
  acceptance_criteria:
    - Reloading the browser while on a non-root route re-renders that route
  priority: High
  status: Active
  ambiguity: null
  automation_status: ManualOnly
  automation_hint: "Requires a served build; no runner configured"
