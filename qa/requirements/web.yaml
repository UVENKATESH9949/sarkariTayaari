- id: REQ-WEB-003
  feature: Responsive layout from phone browser to desktop
  module: WEB
  system: [Web]
  source_doc: tasks/TASK-2601-student-web-application.md
  source_section: "Decisions already taken — decision 3"
  description: >
    The app is usable from roughly 360px wide up to a large desktop monitor. **Stale-doc
    correction (2026-09-18, per AI_RULES.md §6):** this requirement previously described a
    bottom-tab-bar + compact top bar below 1024px switching to a sidebar at 1024px. By
    explicit later direction the whole app moved onto a single top navigation bar at every
    width instead — see REQ-WEB-011's own "Nav scope" decision. Below 1024px the five
    primary links collapse into a menu button rather than showing inline; there is no
    bottom tab bar and no sidebar at any width any more. Content itself also adapts, not
    just navigation: the exam-card grid (Practice, Mock Test) renders 1 column below
    768px, 2 from 768px, 3 from 1024px, and 4 from 1600px, and the page content's max
    width grows in two further steps at 1280px and 1600px so a large monitor gets more
    grid columns rather than one implausibly wide card. No layout produces horizontal
    page scrolling at any of these widths.
  business_rule: >
    The web app exists partly to serve students who will not install an APK, so a phone
    browser is a first-class target rather than a degraded one. A large desktop monitor
    should show more of the catalogue at once, not a single column stretched to fill the
    screen. Moving off the bottom tab bar is a real, disclosed trade-off (a phone no longer
    has an always-visible, thumb-reach primary nav) accepted in exchange for one navigation
    idiom across the whole app instead of two.
  actor: Student
  preconditions: []
  inputs:
    - "Viewport width"
  expected_outputs:
    - "One sticky top nav bar at every width — inline links + account button >=1024px; brand + menu button <1024px"
    - "Exam-card grid column count: 1 (<768px), 2 (>=768px), 3 (>=1024px), 4 (>=1600px)"
  validations:
    - No horizontal overflow at any supported width
    - The footer renders (compact, above the standard page padding) below 1024px and in its full multi-column form at and above 1024px
  permissions: n/a
  dependencies: []
  error_conditions: []
  edge_conditions:
    - "Exactly at the 1024px breakpoint, exactly one of (inline links, menu button) is visible"
    - "A short page's footer sits at the bottom of the viewport rather than floating mid-screen; a tall page's footer simply follows the content"
  offline_behavior: n/a
  acceptance_criteria:
    - Every primary destination is reachable at both widths
    - document.scrollWidth never exceeds the viewport width
    - The exam-card grid column count matches the table above at each documented breakpoint
  priority: High
  status: Active
  ambiguity: null
  automation_status: ManualOnly
  automation_hint: "No browser-test runner is configured under web/; verified this session via a one-off Playwright script (not a committed suite)"

