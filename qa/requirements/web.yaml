# WEB module — requirement repository
#
# Scope: the student-facing web application (web/) and the shared package it stands on
# (packages/core). Primary source: tasks/TASK-2601-student-web-application.md. Secondary:
# web/src/**, packages/core/src/**, WEB-DEPLOY-SETUP.md.
#
# WHY THIS MODULE EXISTS AT ALL, given qa/README.md says module codes follow api/*.md contract
# boundaries. Web adds no API contract — it consumes the ones that already exist. What it does
# add is a whole client with behaviour of its own: responsive layout, theming, a translation
# surface, session handling in a browser, and a hard dependency on the backend's CORS
# allowlist. None of that belongs to AUTH or CATALOG. So WEB covers web-specific behaviour,
# and from Phase 1 onward a feature area's cases attach to its existing contract module with
# `Web` added to that requirement's `system` list, rather than being duplicated here.
#
# automation_status is evidence-based. `Automated` appears only where a named test genuinely
# asserts the requirement. web/ has no browser-test runner configured in this project (no
# Playwright/Vitest under web/ — the Phase 0 browser checks were one-off scripts, not a suite),
# so every UI requirement is ManualOnly, the same standing as mobile/ and admin/.

- id: REQ-WEB-001
