    - scripts/check-topic-health-parity.js passes against the moved path
  permissions: n/a
  dependencies: []
  error_conditions:
    - "A shared module referencing a platform-specific global fails packages/core's platform-purity test"
  edge_conditions:
    - "__DEV__ exists on React Native and not in a browser; shared code must guard it with typeof"
  offline_behavior: n/a
  acceptance_criteria:
    - No duplicate definition of the evaluator, topic-health constants, catalogues or palettes exists outside packages/core
    - The topic-health parity script passes
  priority: Critical
  status: Active
  ambiguity: null
  automation_status: Automated
  automation_hint: "packages/core platformPurity.test.ts + questionEvaluator.test.ts; scripts/check-topic-health-parity.js"

