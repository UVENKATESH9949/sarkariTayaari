  validations: []
  permissions: []
  dependencies: []
  error_conditions: []
  edge_conditions: []
  offline_behavior: "Unchanged — same hybrid local/live behavior as before this change"
  acceptance_criteria:
    - "A full official-paper attempt completes and scores identically to before the Hub existed"
  priority: Critical
  status: Active
  ambiguity: null
  automation_status: ManualOnly
  automation_hint: "No automated test runner exists for mobile in this project; this is a device regression check."
