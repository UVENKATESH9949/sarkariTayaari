# DAILYPLAN module — requirement repository
#
# Scope: PreparationProfileController (GET/POST /api/me/preparation-profile) and
# DailyPlanController (GET /api/me/daily-plan) — TASK-3301, Phase 5 of the personalization program.
# Both in one module because the profile exists only to feed the planner: the endpoint was built in
# the same change, for that reason, and splitting them would hide the dependency.
#
# The caveat to carry forward: the student never states a number of minutes. Onboarding asks for a
# BAND (UNDER_1H, ONE_TO_TWO, ...), so every minutes figure the planner uses is its own assumption,
# declared in the payload rather than presented as the student's answer.
#
# automation_status is evidence-based, per qa/README.md's standing rule.

- id: REQ-DAILYPLAN-001
  feature: The preparation profile reaches the server and stays scoped to its owner
  module: DAILYPLAN
  system: [Backend]
  source_doc: api/PREPARATION-PROFILE.md
  source_section: "GET / POST /api/me/preparation-profile"
  description: >
    A signed-in student can upload and read back their preparation profile — display name, primary
    exam, stage, target year, preparation level and daily study time. The acting student comes from
    the bearer token; there is no user-id parameter anywhere.
  business_rule: >
    Onboarding still runs before sign-in and still writes to device-local app_preferences. This row
    is the account-wide copy and is authoritative for PLANNING only, which is narrower than being
    authoritative for the profile. An account that never uploaded one has no row, and that is a real
    answer rather than an error.
  actor: Signed-in student
  preconditions:
    - "A valid bearer token"
  inputs:
    - "A profile body carrying the device's own updatedAt"
  expected_outputs:
    - "200 with the stored profile; GET returns {profile: null} when none exists"
  validations:
    - "401 without a token"
    - "An unknown preparationLevel or dailyStudyTime is rejected with 400"
    - "updatedAt is required — without it two devices cannot be resolved"
  permissions:
    - "User token required; one account cannot read or overwrite another's profile"
  dependencies: [REQ-AUTH-001]
  error_conditions:
    - "A targetYear outside 2000-2100 is rejected"
  edge_conditions:
    - "Every field except the timestamps may be null — a student can finish onboarding having skipped a step"
    - "An upload replaces every field, including with null, so a cleared value can reach the server"
  offline_behavior: "The device keeps its own copy; onboarding is unaffected by being signed out"
  acceptance_criteria:
    - "A profile round-trips, and a second account reading the same endpoint sees only its own"
    - "A value outside the app's own vocabulary never reaches the planner"
  priority: High
  status: Active
  ambiguity: null
  automation_status: Automated
  automation_hint: >
    DailyPlanTest.theProfileRoundTripsAndIsScopedToItsOwner and .anUnknownStudyTimeBandIsRejected.

- id: REQ-DAILYPLAN-002
  feature: Two devices disagreeing resolve on when the edit happened, not on who synced last
  module: DAILYPLAN
  system: [Backend]
  source_doc: api/PREPARATION-PROFILE.md
  source_section: "Last-write-wins"
  description: >
    An upload whose updatedAt is older than the stored row does not overwrite it. The response
    reports stored: false and returns the winning profile.
  business_rule: >
    updatedAt is supplied by the device, not stamped on arrival, because an edit made offline and
    uploaded three days later happened three days ago. Stamping on arrival would let a stale edit
    win purely by syncing second. Same rule user_bookmarks and followed_exams already apply.
  actor: Signed-in student with more than one device
  preconditions:
    - "A stored profile with a recent updatedAt"
  inputs:
    - "A second upload carrying an older updatedAt"
  expected_outputs:
    - "200 with stored: false and the winning profile in the body"
  validations:
    - "The stored row is unchanged afterwards"
  permissions:
    - "User token required"
  dependencies: [REQ-DAILYPLAN-001]
  error_conditions: []
  edge_conditions:
    - "A losing upload is not an error — the loser is handed the winner so it can correct itself in the same round trip"
  offline_behavior: "This rule exists specifically so an offline edit uploaded later behaves correctly"
  acceptance_criteria:
    - "The older edit loses and the caller is told what won"
  priority: High
  status: Active
  ambiguity: null
  automation_status: Automated
  automation_hint: "DailyPlanTest.anOlderEditDoesNotOverwriteANewerOneAndTheLoserIsToldWhatWon"

- id: REQ-DAILYPLAN-003
  feature: A day's tasks fit the time the student said they have
  module: DAILYPLAN
  system: [Backend]
  source_doc: api/DAILY-PLAN.md
  source_section: "The budget"
  description: >
    GET /api/me/daily-plan?examCode=&zone= returns today's tasks with a budget, the minutes those
    tasks add up to, and each task's own planned minutes, question count and estimate tier.
  business_rule: >
    The student chose a BAND, never a number, so the planner maps each band to a figure — 45 / 90 /
    180 / 300 / 360 minutes — and reports the band beside the minutes so the assumption is visible.
    SIX_PLUS takes the floor of an open-ended band: inventing an upper bound the student never gave
    would be worse than planning short. No profile at all means a declared default of 60, labelled
    DEFAULT rather than dressed up as the student's answer.
  actor: Signed-in student
  preconditions:
    - "An exam with practicable topics"
    - "A profile stating ONE_TO_TWO, or no profile at all"
  inputs:
    - "examCode and an optional IANA zone"
  expected_outputs:
    - "budget {dailyStudyTime, minutes, basis}, plannedMinutes, and ordered tasks"
  validations:
    - "plannedMinutes does not exceed the budget when any task fits inside it"
    - "Every task carries an estimate tier from the shared workload ladder"
    - "Every task names a topic that has questions behind it"
  permissions:
    - "User token required"
  dependencies: [REQ-DAILYPLAN-001, REQ-ROADMAP-003, REQ-REVISION-005]
  error_conditions:
    - "An unknown time zone is a 400, never a silent fallback that would plan a different day"
  edge_conditions:
    - "An exam with nothing practicable returns an empty plan rather than an error"
    - "A single task longer than the whole budget is still assigned — an empty day is worse — and the overshoot is reported honestly"
  offline_behavior: "None — server-computed"
  acceptance_criteria:
    - "A student who said 1-2 hours gets a 90-minute budget and tasks that fit it"
    - "A student with no profile still gets a plan, with the budget labelled DEFAULT"
  priority: High
  status: Active
  ambiguity: >
    Whether the band mid-points are the right figures is unmeasured — nobody has checked what a
    student who says "1-2 hours" actually does.
  automation_status: Automated
  automation_hint: >
    DailyPlanTest.aOneToTwoHourStudentGetsADayThatFitsTheBudget,
    .withNoProfileTheBudgetIsADeclaredDefault, .anUnknownTimeZoneIsRejected and
    .anExamWithNothingPracticableGetsAnEmptyPlanRatherThanAnError.

- id: REQ-DAILYPLAN-004
  feature: A day is planned once, and what was assigned is recorded
  module: DAILYPLAN
  system: [Backend]
  source_doc: api/DAILY-PLAN.md
  source_section: "A day is planned once"
  description: >
    The first read for a given student, day and exam generates and persists that day's tasks into
    study_tasks; every later read returns the same rows, with generated: false.
  business_rule: >
    Re-planning on each read would show a different list to a student who had already started, and
    would destroy the record Phase 6 needs. That record is the only reason this phase stores
    anything: without it, "no Percentage practice this week" cannot distinguish never-assigned from
    ignored from abandoned from completed-offline-and-unsynced.
  actor: Signed-in student
  preconditions:
    - "An exam with practicable topics"
  inputs:
    - "Two successive reads of the same day"
  expected_outputs:
    - "generated true then false, with identical task ids and identical plannedMinutes"
  validations:
    - "Task ids are stable across reads"
    - "Tasks are returned in their assigned display order"
  permissions:
    - "User token required"
  dependencies: [REQ-DAILYPLAN-003]
  error_conditions: []
  edge_conditions:
    - "The zone the day was resolved in is stored with the task, so a student who travels does not get two Mondays or none"
  offline_behavior: "None"
  acceptance_criteria:
    - "A second read returns the same plan rather than a new one"
  priority: High
  status: Active
  ambiguity: null
  automation_status: Automated
  automation_hint: "DailyPlanTest.asecondReadReturnsTheSamePlanRatherThanReplanning"

- id: REQ-DAILYPLAN-005
  feature: A closed day's tasks are settled from what the student actually practised
  module: DAILYPLAN
  system: [Backend]
  source_doc: api/DAILY-PLAN.md
  source_section: "Outcomes: what actually happened"
  description: >
    When a new day's plan is generated, tasks from earlier days that are still ASSIGNED are judged
    against real attempts on their topic that day and settled to COMPLETED, PARTIAL or SKIPPED.
    settledTaskCount reports how many were judged.
  business_rule: >
    There is no "mark as done" control, because there is no screen to put one on — the outcome is
    inferred instead, which is possible only because V47 froze topic_id onto every attempt row.
    COMPLETED is at least 60% of the asked questions, PARTIAL is real but insufficient work, SKIPPED
    is nothing at all. Accuracy never decides the outcome: doing the work and doing it well are
    different questions, and the health model owns the second. Two limits are accepted openly —
    self-directed practice on an assigned topic counts as the task, and the 60% line is a declared
    judgement rather than a measurement.
  actor: Signed-in student
  preconditions:
    - "Tasks assigned on a day that has since closed"
  inputs:
    - "A daily-plan read on a later day"
  expected_outputs:
    - "Each closed task carrying COMPLETED, PARTIAL or SKIPPED, and settledTaskCount"
  validations:
    - "A topic practised past the threshold settles COMPLETED; one never touched settles SKIPPED"
    - "Settlement is idempotent — a second read judges nothing"
    - "Today's own tasks stay ASSIGNED while the day is still open"
  permissions:
    - "User token required; settlement is scoped to the calling student"
  dependencies: [REQ-DAILYPLAN-004, REQ-USERPROGRESS-001]
  error_conditions: []
  edge_conditions:
    - "Lookback is 14 days; older tasks stay ASSIGNED, which is an honest 'never judged'"
    - "Each task is judged in the zone its own day was resolved in, so a student who travelled still gets their own midnight"
  offline_behavior: "None — server-computed"
  acceptance_criteria:
    - "Yesterday's tasks stop saying ASSIGNED once the day is over"
    - "A day already judged is never re-judged"
  priority: High
  status: Active
  ambiguity: >
    Whether 60% is the right line is unmeasured — nobody has checked what share of an assigned set
    real students complete.
  automation_status: Automated
  automation_hint: >
    AdaptiveReplanningTest.yesterdaysTasksSettleFromWhatWasActuallyPractised, .settlementIsIdempotent,
    .todaysOwnTasksAreLeftAssigned, and service.TaskOutcomeRuleTest for the rule itself.

- id: REQ-DAILYPLAN-006
  feature: Every task explains why it was assigned, and reports what happened against it
  module: DAILYPLAN
  system: [Backend]
  source_doc: api/DAILY-PLAN.md
  source_section: "Every task says why it is there"
  description: >
    Each task carries a one-sentence deterministic reason fixed at assignment time, plus
    answeredToday and accuracyToday describing real activity on its topic during its day.
  business_rule: >
    A plan that changes with no reason given reads as arbitrary, and this project explains rather
    than asserts. The sentence comes from a rule table and never from a model. It is STORED rather
    than derived on read, because it explains why a task was chosen at the moment it was chosen —
    re-deriving it later would explain an old plan using new state, which is the very thing that
    moved.
  actor: Signed-in student
  preconditions:
    - "A generated plan"
  inputs:
    - "examCode"
  expected_outputs:
    - "reason on every task, naming its topic; answeredToday and accuracyToday"
  validations:
    - "accuracyToday is null when nothing was answered, never zero"
    - "A never-started topic's reason says so rather than giving a generic ranking line"
  permissions:
    - "User token required"
  dependencies: [REQ-DAILYPLAN-003]
  error_conditions: []
  edge_conditions:
    - "Null reason for tasks assigned before migration V50 — no backfill was invented"
  offline_behavior: "None"
  acceptance_criteria:
    - "Every task in a generated plan carries a non-blank reason naming its own topic"
    - "Observed activity is readable against the plan that asked for it"
  priority: Medium
  status: Active
  ambiguity: null
  automation_status: Automated
  automation_hint: >
    AdaptiveReplanningTest.everyTaskCarriesADeterministicReason and
    .aTaskReportsTheWorkActuallyDoneOnItsTopicToday.

- id: REQ-DAILYPLAN-007
  feature: The phone sends the preparation profile, so the planner budgets the student's real time
  module: DAILYPLAN
  system: [Backend, Mobile]
  source_doc: api/PREPARATION-PROFILE.md
  source_section: "Consumers"
  description: >
    On sign-in and on every push sync, the device uploads its preparation profile and accepts the
    server's copy when that copy is newer. Mobile migration 0030 adds profile_updated_at, stamped
    whenever the student edits the profile.
  business_rule: >
    Until this existed the server side was complete and unused: every real account fell back to the
    declared 60-minute default budget however long the student had actually said they study. The
    timestamp is the moment of the EDIT, never of the upload — an edit made offline and synced three
    days later must still lose to a newer one made elsewhere. An install predating 0030 has no
    profile_updated_at and falls back to onboarding_completed_at, which IS the moment the student
    answered these questions and is already stored. Only an install with neither — one that never
    completed onboarding — uploads nothing, because inventing a "now" there would beat a genuine
    older edit on the student's other device.
  actor: Signed-in student
  preconditions:
    - "A device with a locally-stored preparation profile"
  inputs:
    - "A full sync, a push sync, or a sign-out flush"
  expected_outputs:
    - "The profile present on the server, or the server's newer copy written locally"
  validations:
    - "A losing upload writes the winner locally, preserving the remote edit's own timestamp"
    - "A failure here never aborts the batch that restores practice history"
  permissions:
    - "User token required"
  dependencies: [REQ-DAILYPLAN-001, REQ-DAILYPLAN-002]
  error_conditions:
    - "A backend predating V48 returns 404; caught per-call so the rest of the sync completes"
  edge_conditions:
    - "Content languages, interface language, theme and zoom are deliberately not synced — device preferences, not planning inputs"
    - "The two onboarding timestamps stay device-local: they answer whether THIS INSTALL was onboarded"
    - >
      An install predating 0030 uploads using onboarding_completed_at. Corrected 2026-09-20 after
      the device pass: the first rule ("a NULL timestamp uploads nothing") would have silenced every
      existing install, which is precisely the population this change exists to serve.
  offline_behavior: "The edit is kept locally with its own timestamp and goes up on the next sync"
  acceptance_criteria:
    - "A student who chose 1-2 hours gets a 90-minute budget on the server rather than the 60-minute default"
    - "Two devices disagreeing converge on the later edit, in one round trip"
  priority: High
  status: Active
  ambiguity: null
  automation_status: ManualOnly
  automation_hint: >
    No automated runner exists for mobile in this project. The server halves are covered by
    DailyPlanTest.theProfileRoundTripsAndIsScopedToItsOwner and
    .anOlderEditDoesNotOverwriteANewerOneAndTheLoserIsToldWhatWon; the device half needs a real
    device pass.

- id: REQ-DAILYPLAN-008
  feature: A student can see today's plan in the app
  module: DAILYPLAN
  system: [Mobile]
  source_doc: api/DAILY-PLAN.md
  source_section: "Consumers"
  description: >
    A root-level "Today's Plan" screen (mobile/src/app/daily-plan.tsx) reads
    GET /api/me/daily-plan for the active exam and lists the day's tasks, each naming its topic,
    its stored reason, its question count and its estimated minutes. Reached from a card on Home
    and a row in More. Tapping a task opens Practice's levels screen for that topic.
  business_rule: >
    The first student-facing consumer of the personalization program: six phases and five
    endpoints had shipped with no reader at all. The screen renders the server's plan and adds
    no ranking, no reordering and no second opinion — a third opinion about what matters is the
    drift Phases 3, 4 and 7 exist to remove. Where the payload is an assumption it says so: the
    minutes budget is always reported with the band it came from, or plainly as an assumed
    default when no profile reached the server.
  actor: Signed-in student
  preconditions:
    - "An active exam is selected"
    - "The student is signed in and the device can reach the backend"
  inputs:
    - "Opening the screen from Home or More; pull-to-refresh"
  expected_outputs:
    - "The budget, the planned total, and one card per task in the server's order"
    - "Each task's stored reason, question count and estimated minutes"
  validations:
    - "budget.basis DEFAULT is described as an assumption, never shown as the student's own answer"
    - "A task opens /practice/levels for its own topic"
  permissions:
    - "User token required; the screen never holds it — data/dailyPlanData.ts reads the session"
  dependencies: [REQ-DAILYPLAN-001, REQ-DAILYPLAN-007]
  error_conditions:
    - "Signed out: a real state with its own message, because the plan is stored server-side and has no local equivalent"
    - "Offline or a server error: an error state with retry; there is deliberately no cache"
    - "Unknown exam (404): says so, rather than blaming the connection"
  edge_conditions:
    - "No active exam: prompts to pick one rather than failing to load"
    - "An exam with nothing practicable returns an empty plan, shown as an invitation not an error"
    - >
      The time zone comes from the device and is validated for IANA shape before being sent, since
      an unknown zone is a 400. If it cannot be resolved the server plans in UTC, which is a
      different calendar day in IST between midnight and 05:30 — planDate is shown so that is
      visible rather than silent.
  offline_behavior: >
    None, deliberately. There is no cache: reading the endpoint is what GENERATES the day, so a
    cached read would hand back a plan while leaving the day unplanned on the server, and a saved
    plan risks showing yesterday's work as today's. The screen says it needs a connection.
  acceptance_criteria:
    - "A signed-in student with an active exam sees today's tasks, each with its reason and cost"
    - "The 90-minute budget is shown as following from the band the student chose"
    - "Tapping a task lands on Practice's levels screen for that task's topic"
  priority: High
  status: Active
  ambiguity: >
    There is no way to change the study-time band after onboarding — nothing in the app calls
    savePreparationProfile outside the first-run flow — so a student shown an assumed default
    cannot correct it. Recorded rather than worked around: an edit surface is a separate change.
  automation_status: ManualOnly
  automation_hint: >
    No automated runner exists for mobile in this project. The endpoint behind it is covered by
    DailyPlanTest and AdaptiveReplanningTest; the screen itself needs a real device pass.

- id: REQ-DAILYPLAN-009
  feature: A student can change the study time the planner budgets from
  module: DAILYPLAN
  system: [Mobile]
  source_doc: api/PREPARATION-PROFILE.md
  source_section: "Consumers"
  description: >
    A "Study preferences" screen (mobile/src/app/study-preferences.tsx) lets a signed-in or
    signed-out student change their daily study-time band and preparation level. Reached from More,
    and from the daily plan itself whenever the budget is an assumed default. Each tap saves
    locally, stamping profile_updated_at to that moment, and pushes to the server when signed in.
  business_rule: >
    Onboarding asked these questions once and nothing could change them afterwards -
    savePreparationProfile had exactly one caller and it was the first-run flow. That became a
    visible defect the moment the daily plan began telling students "we've assumed an hour": the
    app named an assumption the student could not correct. profile_updated_at (migration 0030)
    already existed to resolve later edits that nothing could make. Scoped to the two answers the
    planner reads; the active exam has its own switcher and a display name is not a planning input.
  actor: Student, signed in or out
  preconditions:
    - "Onboarding has run at least once on this install"
  inputs:
    - "Tapping one of five study-time bands, or one of five preparation levels"
  expected_outputs:
    - "The choice is stored locally and reflected immediately"
    - "When signed in, the server holds it with the moment of the edit as updatedAt"
    - "The next daily-plan read budgets from the new band"
  validations:
    - "The screen opens showing the student's current answers, not blank defaults"
    - "A change made while signed out still persists locally"
  permissions:
    - "None to edit locally; the push uses the stored session, which the screen never handles"
  dependencies: [REQ-DAILYPLAN-007, REQ-DAILYPLAN-008]
  error_conditions:
    - "A failed push is silent by design - the edit is safely local and every sync point retries it"
  edge_conditions:
    - >
      Today's TASKS do not change, because a day is planned once and stored. The budget figure does
      update immediately, since it is resolved on read - so the screen promises tomorrow's plan
      rather than "nothing changes today", which would be false.
  offline_behavior: "Fully usable offline; the edit syncs at the next sync point."
  acceptance_criteria:
    - "A student shown an assumed budget can correct it without reinstalling"
    - "The corrected band reaches the server and the plan budgets from it"
  priority: High
  status: Active
  ambiguity: >
    Whether changing the band should also re-plan the remainder of today is an open product
    question, deliberately not answered here: re-planning would destroy the record of what was
    originally assigned, which Phase 6 depends on.
  automation_status: ManualOnly
  automation_hint: >
    No automated runner exists for mobile. The server half is covered by DailyPlanTest's profile
    cases; the screen needs a device pass.

# ---------------------------------------------------------------------------------------------
# TASK-3501 — the day becomes five learning purposes instead of two.
#
# The caveat to carry forward here: the 25/20/20/15/10 split and the 1/2/3 new-topic ladder are
# product judgements, declared and versioned in code. No test below asserts they are the RIGHT
# numbers, and none could.
# ---------------------------------------------------------------------------------------------

- id: REQ-DAILYPLAN-010
  feature: A day is built from five learning purposes, not two
  module: DAILYPLAN
  system: [Backend, Mobile]
  source_doc: api/DAILY-PLAN.md
  source_section: "The five purposes a day is built from"
  description: >
    Every task carries a source naming its learning purpose: NEW_TOPIC (ground not yet covered),
    REVISION (work done and fading), WEAK_TOPIC (currently struggling), STRENGTHEN (encountered but
    not yet strong) or MISTAKE_REVIEW (questions previously answered wrongly). The mobile screen
    renders one section per purpose.
  business_rule: >
    No purpose has a ranking of its own. Revision comes from RevisionPlanService's due list, weak
    and strengthening topics are walked in WeaknessRadarService's existing order (NEEDS_ATTENTION
    then NEEDS_REVISION; IMPROVING then DEVELOPING), new ground comes from StudyRoadmapService's
    priority-and-interleave order, and every question count is still the radar's own recommendation
    sized by WorkloadEstimator. STRONG topics are never selected, so maintaining a reliable topic
    cannot take time a developing one needs. No AI or LLM is involved at any point.
  actor: Signed-in student
  preconditions:
    - "An exam with a topic map and practicable questions"
  inputs:
    - "GET /api/me/daily-plan?examCode=&zone="
  expected_outputs:
    - "Tasks whose source is one of the five declared values"
  validations:
    - "No task carries a source outside the five"
    - "The pre-TASK-3501 value PRACTICE never appears - V52 relabelled it to NEW_TOPIC"
    - "A topic the student has practised is not offered as new ground"
  permissions:
    - "User token required; the plan is scoped to the calling student"
  dependencies: [REQ-DAILYPLAN-003, REQ-ROADMAP-001, REQ-REVISION-001]
  error_conditions: []
  edge_conditions:
    - >
      A topic selected for one of the four fresh-practice purposes is excluded from the others, so a
      weak topic that is also revision-due becomes a REVISION task rather than appearing twice.
      MISTAKE_REVIEW stands outside that rule deliberately - it assigns no question set, and
      excluding it would make the purpose unreachable for exactly the students who have mistakes.
  offline_behavior: "None - the plan is server-generated and stored; there is no local fallback."
  acceptance_criteria:
    - "A day can contain all five purposes"
    - "Existing exam-priority, prerequisite, difficulty and performance logic is unchanged"
  priority: High
  status: Active
  ambiguity: >
    Which of WEAK_TOPIC, STRENGTHEN or REVISION a struggling topic lands in depends on health
    thresholds and on whether it is revision-due, so it is not fixed per topic.
  automation_status: Automated
  automation_hint: >
    DailyPlanTest.everyTaskCarriesOneOfTheFiveDeclaredPurposes and
    DailyPlanTest.apractisedTopicIsNotOfferedAsNewGround.

- id: REQ-DAILYPLAN-011
  feature: The number of new topics a day opens is explicitly capped by the time band
  module: DAILYPLAN
  system: [Backend]
  source_doc: api/DAILY-PLAN.md
  source_section: "New topics have an explicit maximum"
  description: >
    A day opens at most 1 new topic at or below 45 budgeted minutes, at most 2 up to 120, and at
    most 3 above that. These are maximums: a day with fewer eligible topics assigns fewer.
  business_rule: >
    The count must not emerge only from dividing the budget by an estimated question duration. A
    fast solver on a long day would otherwise be handed six unfamiliar topics at once, which is a
    worse day than three done properly - a judgement about learning rather than arithmetic, so it is
    stated. Keyed on resolved budget MINUTES rather than on the band name, which is what also gives
    the 60-minute DEFAULT a defined answer.
  actor: Signed-in student
  preconditions:
    - "More eligible new topics than the cap allows"
  inputs:
    - "A preparation profile naming a study-time band, or none at all"
  expected_outputs:
    - "No more NEW_TOPIC tasks than the band's maximum"
  validations:
    - "45 minutes yields exactly 1; 90 yields at most 2; 180 yields at most 3"
    - "An enormous budget still stops at 3"
  permissions:
    - "User token required"
  dependencies: [REQ-DAILYPLAN-003]
  error_conditions: []
  edge_conditions:
    - "Question counts inside a selected topic still come from measured pace, not from the cap"
  offline_behavior: "None - server-computed"
  acceptance_criteria:
    - "A 90-minute student cannot receive more than 2 NEW_TOPIC tasks"
    - "The maximum is configuration, not a side effect of time arithmetic"
  priority: High
  status: Active
  ambiguity: >
    Whether 1/2/3 are the right maximums is unmeasured - nobody has checked how many new topics a
    student can absorb in a sitting.
  automation_status: Automated
  automation_hint: >
    service.DailyPlanAllocationTest.theNewTopicMaximumFollowsTheStatedTimeBands and
    .anEnormousBudgetStillOpensAtMostThreeNewTopics; DailyPlanTest.aNinetyMinuteDayOpensAtMostTwoNewTopics,
    .aShortDayOpensOnlyOneNewTopic and .aLongDayStillStopsAtThreeNewTopics.

- id: REQ-DAILYPLAN-012
  feature: The day's minutes are divided between the purposes, and a task that does not fit gets fewer questions
  module: DAILYPLAN
  system: [Backend]
  source_doc: api/DAILY-PLAN.md
  source_section: "How the day's minutes are divided"
  description: >
    Each purpose receives a target share of the budget - 25/20/20/15/10 minutes at a 90-minute
    reference, scaled for any other budget and always summing to exactly the budget. A purpose may
    under-spend, leaving its remainder to later purposes, but never over-spend.
  business_rule: >
    Question counts are never a fixed number derived from the daily time. The radar's own 10/15
    recommendation is the ceiling and the remaining allowance is the floor: a set that does not fit
    is trimmed to what does, and only a topic that cannot fit even one question is passed over.
    WorkloadEstimator remains the sole source of how long a question takes, walking its existing
    personal then cohort-topic then cohort-difficulty then default ladder. This supersedes the
    previous half-the-budget revision cap, which was a second, looser rule for the same decision.
  actor: Signed-in student
  preconditions:
    - "Eligible topics in more than one purpose"
  inputs:
    - "A resolved time budget"
  expected_outputs:
    - "plannedMinutes at or below budget.minutes, with no purpose taking the whole day"
  validations:
    - "The five shares sum to exactly the budget at every band"
    - "A slower measured pace yields fewer questions for the same allowance"
    - "A fitted count never costs more minutes than its allowance"
  permissions:
    - "User token required"
  dependencies: [REQ-DAILYPLAN-003, REQ-ROADMAP-002]
  error_conditions: []
  edge_conditions:
    - >
      If nothing fits at all, one task is still assigned and plannedMinutes exceeds the budget
      honestly - an empty day is worse than a slightly long one. This is the only case where the
      total may exceed the budget.
  offline_behavior: "None - server-computed"
  acceptance_criteria:
    - "The total plan stays close to the student's daily time budget"
    - "Question count is not globally hardcoded from the daily time"
  priority: High
  status: Active
  ambiguity: >
    The 25/20/20/15/10 split is a declared product judgement. Nothing measures whether it is the
    right balance.
  automation_status: Automated
  automation_hint: >
    service.DailyPlanAllocationTest.aNinetyMinuteDayIsSplitAsSpecified, .theSharesAlwaysSumToTheBudget,
    .aRecommendationThatDoesNotFitIsTrimmedRatherThanDropped, .aFittedCountNeverCostsMoreThanItsAllowance;
    DailyPlanTest.thePlanStaysInsideTheBudgetAndNoPurposeTakesItAll.

- id: REQ-DAILYPLAN-013
  feature: Mistake review is built from the student's real wrong answers
  module: DAILYPLAN
  system: [Backend, Mobile]
  source_doc: api/DAILY-PLAN.md
  source_section: "What Mistake Review does and does not know"
  description: >
    A MISTAKE_REVIEW task names a topic on which the student has genuinely answered questions
    wrongly in the last 14 days, and how many are worth re-reading. Tapping it opens Revise's Wrong
    Answers tab, which already shows each question with the answer chosen, the correct answer and
    the explanation.
  business_rule: >
    Built from outcome = INCORRECT over rows that already exist, grouped by the topic_id V47 froze
    onto every attempt - so a question retagged since cannot silently change what a past mistake
    looks like. UNATTEMPTED and PENDING_REVIEW are excluded: running out of time on a timed paper is
    a clock problem, not a mistake. The question text, chosen answer, correct answer and explanation
    are deliberately NOT sent - the client already holds all four for every wrong answer it has
    recorded, and a second copy would be two sources of truth for the same content.
  actor: Signed-in student
  preconditions:
    - "Wrong answers recorded within the last 14 days on a topic in this exam's map"
  inputs:
    - "GET /api/me/daily-plan"
  expected_outputs:
    - "A MISTAKE_REVIEW task naming that topic, with a count no larger than the mistakes made"
  validations:
    - "Ordered most recent first, then most numerous"
    - "A topic outside this exam's map is not offered, however many mistakes it holds"
    - "The count never exceeds the number of mistakes actually made"
  permissions:
    - "User token required; only the calling student's own attempts are counted"
  dependencies: [REQ-USERPROGRESS-001, REQ-ANALYTICS-001]
  error_conditions: []
  edge_conditions:
    - "A student with no recent mistakes simply has no such task - the purpose is absent, not empty"
  offline_behavior: >
    The task itself needs the server, but the content it points at is already on the device - Revise
    reads local session history, so the review works offline once the plan has been read.
  acceptance_criteria:
    - "Mistake review uses actual user mistakes where the data supports it"
    - "It consumes a small share of the day rather than dominating it"
  priority: Medium
  status: Active
  ambiguity: >
    Review time is estimated as solving time. Re-reading a question with its explanation is probably
    not the same work, but this app has never measured review time and a separate constant would be
    invented. Settlement also judges these tasks by topic activity, since there is no per-question
    reviewed signal.
  automation_status: Automated
  automation_hint: "DailyPlanTest.mistakeReviewComesFromRealWrongAnswers"

- id: REQ-DAILYPLAN-014
  feature: The device keeps a snapshot of the plan the server decided
  module: DAILYPLAN
  system: [Mobile]
  source_doc: reports/42-daily-plan-snapshot-cache/daily-plan-snapshot-cache.md
  source_section: "The policy"
  description: >
    After a successful read of GET /api/me/daily-plan the response is stored verbatim in the local
    `remote_snapshots` table (migration 0031), keyed by user, exam, plan date and zone. Opening
    Today's Plan renders any stored snapshot immediately and refreshes in the background;
    a screen showing a snapshot says so and gives the time it was taken.
  business_rule: >
    THE DEVICE NEVER COMPUTES A PLAN. It stores and displays one the server decided. Re-deriving
    the allocation on the device is the drift D5.1 exists to prevent, and nothing in this feature
    may cross that line. A snapshot is never a source of truth; the server's answer always wins
    when the server answers.
  actor: Signed-in student
  preconditions:
    - "One successful daily-plan fetch has happened on this device"
  inputs:
    - "Opening Today's Plan"
  expected_outputs:
    - "A stored plan renders without waiting on the network"
    - "A background refresh replaces it with the server's answer when one arrives"
    - "The snapshot state is labelled, with the time it was taken"
  validations:
    - "The key includes the user id, so another account cannot see this plan"
    - "The key includes plan date and zone, so yesterday's snapshot can never render as today's"
    - "Sign-out clears snapshots"
  permissions:
    - "Signed-in only, exactly as the endpoint itself is"
  dependencies: [REQ-DAILYPLAN-001]
  error_conditions:
    - >
      A FAILED BACKGROUND REFRESH MUST NOT REPLACE A USABLE PLAN WITH AN ERROR. Offline, the
      student keeps the stored plan; swapping it for an error screen would make the cache
      actively harmful.
  edge_conditions:
    - >
      Offline on a NEW day there is no snapshot for that date, so the screen reports it cannot
      build one and no plan is generated server-side. That is the correct record - the student
      genuinely was not assigned a day - and Phase 6 settlement reads study_tasks, so the absence
      does not confuse it.
    - "Switching exam must not evict the other exam's snapshot; both are keyed separately"
  offline_behavior: "The whole point: a stored plan is readable and usable with no connection"
  acceptance_criteria:
    - "A second open of Today's Plan shows the plan without a loading state"
    - "Offline, a stored plan still renders, labelled"
    - "A failed refresh leaves the stored plan on screen"
  priority: High
  status: Active
  ambiguity: null
  automation_status: ManualOnly
  automation_hint: "No mobile runner. snapshotStore.ts is a thin, pure read/write layer and would be the first thing testable."

- id: REQ-DAILYPLAN-015
  feature: A stored plan shows progress counted on the device, not frozen figures
  module: DAILYPLAN
  system: [Mobile]
  source_doc: reports/42-daily-plan-snapshot-cache/daily-plan-snapshot-cache.md
  source_section: "Definition and progress are cached differently"
  description: >
    A task's `answeredToday` and `accuracyToday` are server-computed from real attempts. When a
    plan is rendered from a snapshot those figures are RE-DERIVED from the device's own practice
    and mock history rather than replayed from the stored JSON.
  business_rule: >
    Cache the progress verbatim and a student who answered twelve questions offline still reads
    "0 of 15", which looks like their work was lost. The local derivation mirrors
    TaskOutcomeService.observedOn exactly - practice AND mock, the same day window, the same
    exclusion of UNATTEMPTED and PENDING_REVIEW - so the same task cannot read one way online and
    another offline. `status` is deliberately NOT re-derived: settlement applies a threshold that
    belongs in one place.
  actor: Signed-in student
  preconditions:
    - "A stored plan, and practice history for one of its topics today"
  inputs:
    - "Answering questions on a planned topic"
  expected_outputs:
    - "The answered count on a stored plan reflects what this device has recorded today"
  validations:
    - "A fresh server response is never overwritten by the local derivation"
    - "status is left as the server last reported it"
  permissions:
    - "None beyond being signed in"
  dependencies: [REQ-DAILYPLAN-014]
  error_conditions:
    - "A failed local derivation costs the overlay only; the plan still renders"
  edge_conditions:
    - >
      TWO KNOWN DIVERGENCES FROM THE SERVER, both stated in the code. The server reads topic_id
      frozen onto each result row at upload (V47); local rows carry no topic, so this joins
      questions live and a retagged question moves here and not there. And a null local `outcome`
      is counted, which is right for practice rows (a row exists only if answered) and harmless
      for mock rows (genuinely unattempted ones carry a real UNATTEMPTED outcome).
  offline_behavior: "This is the offline path; it reads only local tables"
  acceptance_criteria:
    - "Progress on a stored plan reflects work done on this device"
    - "Online figures and offline figures do not contradict each other for the same task"
  priority: Medium
  status: Active
  ambiguity: null
  automation_status: ManualOnly
  automation_hint: "getTopicActivityForDay is a pure query, testable against a seeded local database."

