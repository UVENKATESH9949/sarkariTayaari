<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Practice questions, take mock tests and track your preparation for Indian government exams." />
    <!-- Set by applyTheme() before React renders, so the browser chrome matches the painted theme. -->
    <meta name="theme-color" content="#0A0D14" />
    <!-- Self-hosting Inter would be the more self-contained choice, but this app already has
         no build-time asset pipeline for fonts, and Google Fonts' CDN is fast and reliable
         enough for a production SPA — the same trade-off most enterprise SaaS products make.
         preconnect shaves the DNS/TLS handshake off the critical rendering path. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&family=Fraunces:opsz,wght@9..144,600..800&display=swap"
      rel="stylesheet"
    />
    <!-- Fraunces is used narrowly, for Home's hero headline only (`--font-display` in
         index.css) — an editorial serif accent on top of Inter, not a second body font. -->

    <title>SarkariTaiyaari</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
